# 收信入口配置（scripts/mail_fetch.py → customer-files/pending/*.eml）
#
# 业务口径 2026-11-13：收信接入流水线、不回信、暂不按客户分类。
# 2026-11-18：做单主邮箱换成 demochen@ghouseproducts.com（腾讯企业邮）；
#             旧账户 sora@handscript.net 保留但不再进流水线（himalaya -a sora 可手动访问）。
# 邮箱：demochen@ghouseproducts.com —— 账户细节见 hermes skill `himalaya`。
#
# 这里只决定「哪些信进流水线」，不做任何字段映射（那是客户档案的事）。

account: demochen        # himalaya 账户名；留空 = 用配置里的默认账户
folder: INBOX

page_size: 50            # 每轮看多少封信封（只是列表，不是下载）
max_per_run: 5           # 每轮最多落盘几封：积压时不会一次把队列灌爆

himalaya: himalaya       # 二进制名或绝对路径（PATH 里有 /home/claw/.local/bin）
timeout: 90              # 单次 himalaya 调用超时（秒）

# 不送进流水线的信：系统通知、退信、自动回复之类。
# 匹配方式是**子串，不分大小写**（对发件人地址、对标题各扫一遍）。
skip_senders:
  - 10000@exmail.weixin.qq.com    # 企业微信「登录提醒」
  - mailer-daemon@                # 退信
  - postmaster@
  - no-reply@
  - noreply@
  - relay@relay.firefox.com       # Mozilla Firefox Relay 营销信（2026-11-13 落成空单）
  - "@relay.firefox.com"          # 同上，域名兜底（今后可能换发件地址）
  # 2026-11-18 demochen 邮箱实测：这两家是纯系统通知，永不发询价
  - "@bookchainproject.com"       # Book Chain Project「Bill Of Materials Accepted」物料合规回执
  - "announcement@inklab.hk"      # 华辉公司人力资源科（考勤/行政通告）

skip_subjects:
  - 企业微信邮箱登录提醒
  - 自动回复
  - Auto-Reply
  - Out of Office
  - Firefox Relay                  # 营销/产品通知，不是询价
  - "欢迎来到 ⁨Firefox"            # 中文本地化标题带 U+2068/U+2069 方向控制符
  # 2026-11-17 腾讯企业邮「转发设置」系统通知（落成空单 831ab1c2…：正文只有一句
  # 「Mark Lin（marketing@wafai.net）已设置将邮件转发至您的邮箱」+ 腾讯页面链接，
  # 无附件、无产品字段 → profile=generic、values={}）。按标题子串拦，不动发件人
  # （marketing@wafai.net 可能是真客户的联系人，将来仍可能发询价）。
  - "已设置将邮件转发"
  - "已设置自动转发"

# 标题正则（re.search + IGNORECASE）：拦「同一类通知的各种变体」。
# 子串拦不住变体是实测出来的 —— 德文客户端的自动回复叫 `Automatische Antwort:` /
# `Abwesenheitsnotiz:`，中文客户端叫 `自动回复:`，还会叠 `AW:` / `Re:` / `回复:`
# 前缀和全角冒号，逐条堆子串永远漏。正则一条覆盖。
# 注意：这里只放**绝不会出现在询价标题里**的模式，宁可漏拦也别误伤真询价。
skip_subject_regex:
  - "^(\\s*(AW|Re|RE|Fw|FWD|WG|TR|回复|答复|转发)\\s*[:：]?\\s*)*\\s*(Automatische Antwort|Abwesenheitsnotiz|Abwesenheit|自动回复|自動応答)"
  - "^\\s*Bill Of Materials (Accepted|Approved)"
  - "^\\s*(关于违反|通告[:：])"          # 行政/人事通告

# ── 方向判断：本公司**外发**的回信不进流水线 ───────────────────────────────
# 2026-11-17 实测（10 封里 4 封是外发）：邮箱把本公司发出的回信也收进来
# （`Re: PO16528 …`、`Re: AW: Lidl 10-2026 …`、`Re: KHDD26100021 …`、
# `Ndeues Möbel …`），正文全是 ozalid 进度 / 报价回信，没有任何询价字段，
# 却都被抽成了空单。
#
# 判据是**方向**，不是「发件人是不是自己人」：同事把客户询价转发给业务
# （`Fw: WG: Anfrage …` → marklin@）发件人也是自家域名，那是真询价，必须保留。
#   发件人在这几个域名  +  To/Cc 里有**外部**收件人  →  外发，跳过
#   发件人在这几个域名  +  收件人全在自家域内        →  内部转发，照常入队
self_domains:
  - ghouseproducts.com
  - ghouseproducts-germany.de
  - wafai.net
