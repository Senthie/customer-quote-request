# ═══════════════════════════════════════════════════════════════
# 内部导出字段（我方自用，**不是** ERP 表单字段）
#
# 背景（业务 2026-09-24）：
#   * 「导出现在缺少一份内部导出字段 ID，该字段标注我们的当前执行的任务，方便日志维护」
#   * 「将 CPMC 修改为存英文表达，使用 CPMC_ZH 来标注中文表达」
#   * 「给导出的 json 再添加一个字段 version，标识当前配置的版本，目前设置版本为 2」
#
#   当前清单：ID / CPMC_ZH / Reminder / version（= 本文件 fields: 的顺序 = 产物顺序）
#
# 这些东西 ERP 字典里都没有（`uv run ./scripts/erp_schema.py --field ID` 查不到），
# 所以它们**不属于那 59 键**，规则如下：
#
#   1. 位置：一律**追加在 59 个 ERP 键之后**（ERP 自己的导出也是这么干的 ——
#      权威导出在 Remark3 之后多挂了 `产品备注`）。59 键的顺序/位置**一个都不动**，
#      下游按位置读前 59 键的解析器不受影响。
#   2. 校验：不参与 ERP 字典校验（不算 error/warn，也不算「字典里没有这个字段」）。
#   3. 顺序：本文件里 `fields:` 的排列顺序 = 产物里的追加顺序，有测试钉着。
#   4. 开关：`main.py --strip-internal` 可产出**只有 59 键**的纯净文件，
#      给「ERP 导入端不收未知字段」的情况兜底。
#
# ⚠️ 加字段前先想清楚：这是给**我们**做日志追溯用的，还是 ERP 要的？
#   ERP 要的字段请写进 assets/add_customer_quote_request.json（那 59 键）+
#   assets/erp_form_schema.yaml（字典），并同步键序断言。
# ═══════════════════════════════════════════════════════════════
version: 2

fields:
  # ── ID：本次执行的任务号 ─────────────────────────────────────────────
  # 与下面三处用的是**同一个** ID，方便「产物 → 日志」一步对回去：
  #   * customer-files/processed/<task_id>/          （产物目录）
  #   * logs/quote_request_<YYYYmmdd_HHMMSS>.log     （任务日志开头会打印 ID）
  #   * logs/quote_request_*.log 里的 "任务ID: <id>"
  # 实现：`source: task_id` → main.py 用 uuid4().hex 生成的任务 ID。
  - key: ID
    label: 任务ID
    source: task_id
    notes: >-
      标注本次执行的任务（= 产物目录名 = 日志里的「任务ID」）。ERP 表单里没有这个字段，
      纯内部追溯用；导入 ERP 前若被告知「不收未知字段」，用 --strip-internal 去掉。

  # ── CPMC_ZH：产品名称的中文表达 ──────────────────────────────────────
  # 业务口径：`CPMC` 存**英文表达**，中文表达落 `CPMC_ZH`。
  #   CPMC    = 档案 rules.cpmc.template     渲染结果（不含中文）
  #   CPMC_ZH = 档案 rules.cpmc.zh_template  渲染结果（业务员/Aldi 中文品名
  #             中文类别/英文原文(FSC) —— 就是 1.0.21 之前 CPMC 的那个写法）
  # 客户档案没声明 `cpmc.zh_template` 时本字段为空（例如 igl —— 它的 CPMC 历史口径
  # 是 `编号;名称-系列`，英文版该怎么写**待补充真实 ERP 信息后再处理**，见 SKILL.md 第 12 节）。
  - key: CPMC_ZH
    label: 产品名称（中文）
    source: cpmc_zh
    notes: >-
      CPMC 的中文表达。CPMC 只放英文；中文品名/中文类别落这里。
      客户未声明 cpmc.zh_template 时为空。

  # ── Reminder：给业务的提醒（原样带进产物，不只留在日志里）─────────────
  # 业务 2026-09-24：「这提醒现在每次跑都会自动出来」→ 加一个字段把它固化下来。
  # 目前唯一来源是「报价截止日期已过期」（check_offer_deadline）。
  #   * 有提醒 → 文本（多条用换行分隔）
  #   * 没提醒 → 空字符串（= 模板空值口径；与「值为无 → null」是两件事，
  #              见 customers/_defaults.yaml 的 rules.null_values）
  # 同内容的结构化版本在 validation.json 的 reminders 段（kind/deadline/days_over）。
  - key: Reminder
    label: 提醒
    source: reminder
    notes: >-
      报价截止日期过期等需要业务确认的事项。跑完也会打在 stdout 末尾的醒目块里。
      没有待办时为空字符串。

  # ── version：配置版本（哪一代口径跑出来的）────────────────────────────
  # 业务 2026-09-24：「给导出的 json 再添加一个字段 version，标识当前配置的版本，
  # 目前设置版本为 2，这样方便我们的技能迭代」。
  # 取值来源 = 客户档案顶层 `version:`（公共默认值写在 customers/_defaults.yaml，
  # 客户档案可覆盖）—— 所以它标记的是**跑出这份产物的那份档案配置**，不是脚本版本。
  # 口径一变就 +1；历史产物没有这个字段（= 第 1 代口径）。
  # 实现：`source: config_version` → main.py 从 CustomerProfile.version 取。
  - key: version
    label: 配置版本
    source: config_version
    notes: >-
      当前配置（客户档案）的版本号。业务看产物时靠它判断是哪一代口径，
      不用去翻日志或 git。改口径 → customers/_defaults.yaml 的 version +1。
      --strip-internal 时一起去掉（它也是我方自用字段，ERP 字典里没有）。

  # ── schema_version：产物**格式契约**版本（≠ 上面的口径版本）──────────────
  # 2026-10-30 森西拍板 B 方案：`version` 继续只表示「跑出这份产物的客户档案
  # 是哪一代口径」，格式变更另用 schema_version 标，两个号各管一件事。
  #   v2 = 顶层数组（一个文件可装多条产品记录）
  #   v3 = 数组 + 每条记录带 question_answers（内部确认清单，见下）
  # 现有 47 条 v2 产物没有任何口径错误，不该被标成「旧口径」——
  # 这就是不把格式号塞进 version 的理由。
  # 实现：`source: schema_version` → main.py 取 question_answers.SCHEMA_VERSION。
  - key: schema_version
    label: 格式契约版本
    source: schema_version
    notes: >-
      本条记录的结构版本。v3 起每条记录多一个 question_answers（内部确认清单）。
      读取方按它判结构：没有该键或 <= 2 → 老产物，question_answers 视为 [].

  # ── question_answers：内部确认清单（2026-10-30 业务口径合并）─────────────
  # 森西 2026-10-30 的 5 条拍板：①放**每条记录内** ②语义是**内部确认**
  # ③ERP 导入端自己过滤未知字段 ④格式号走 schema_version ⑤把散在四处的
  # 「还没确定的事」**合并**到这一处（Reminder / validation warn / CPMS 里的
  # 「待确认」）。
  #
  # 条目 = 固定 9 键的**对象**（id/field/question/answer/status/blocking/
  # source/asked_at/answered_at），**不允许**拿问题文本当 key —— 同题追问会
  # 静默覆盖、客户改个措辞就成新问题、也没法统计「平均几天关闭」。
  # 结构与判据的唯一实现：scripts/question_answers.py（有测试钉着）。
  #
  # 闸门口径：只有 blocking=True 且仍 open 的项**卡交付**。业务明确「由业务
  # 补填、不猜」的字段（如 2026-10-21 拍板的 ZDFS 线路）用 blocking=False：
  # 看得见，但不堵路。
  - key: question_answers
    label: 内部确认清单
    source: question_answers
    notes: >-
      这条产品记录还欠哪些内部确认、已经确认了什么（含出处与日期）。
      空数组 = 没有待确认项（v2 旧产物没有这个键，读取方一律当 []）。
      --strip-internal 时一并去掉；ERP 导入端虽会自行过滤未知字段，
      但「只给 ERP 的干净文件」仍用 --strip-internal 产出。
