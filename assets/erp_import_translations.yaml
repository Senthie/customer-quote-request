# ═══════════════════════════════════════════════════════════════════════════
# ERP 导入端口径翻译表（我方产物 → ERP 导入端）
#
# 为什么需要这一层（2026-11-11 森西拍板「三处类型偏差做翻译，对接 ERP 的接口」）：
#   我们的产物是**内部表达**（业务拍板、便于人读与校验），ERP 导入端要的是
#   **它能存的样子**。两边差三处类型，硬改产物会毁掉已经拍板的口径，也会让
#   历史产物和新的产物不可比 —— 所以差异一律在「导出给 ERP」这一步翻译掉。
#
#   消费方：scripts/erp_import_adapter.py
#   判据来源：assets/add_customer_quote_request.json（模板默认值/类型）
#             + 真实 ERP 单据（erp_quote_detail 读回，2026-11-11）
#
# 规则类型
#   bool_to_label : 布尔 → 文本枚举（true/false → 指定文本）
#   empty_to      : 空值（"" / null）→ 指定值（可以是 null 或具体值）
#   label_to_bool : 文本枚举 → 布尔（回读/对账时用，导入不触发）
#
# 除本表显式声明的字段外，`erp_form_schema.yaml` 里 type=int/number 的字段
# 遇到空串一律落 `null`（ERP 未填的整数就是 null，不是 0）。
# ═══════════════════════════════════════════════════════════════════════════
version: 1
captured_at: "2026-11-11"

fields:

  # ── ① SFYPJ 是否有配件 ────────────────────────────────────────────────────
  # 我们：布尔（业务 2026-10-21 定案：有配件 true / 无配件 false，由档案
  #       rules.accessories 关键词推）。模板里是空串，ERP 存的是文本。
  # ERP：字符串「是」/「否」—— 实测 `BJXQ261111005` → SFYPJ="否"，
  #      `BJXQ260706007` → SFYPJ="否"；列表页「是否有配件」列也是「否」/「是」。
  # 所以 true→是、false→否；已经是文本的原样放行（历史产物/人工改过的单）。
  SFYPJ:
    type: bool_to_label
    mapping:
      true: "是"
      false: "否"
    keep_text: true          # 已是「是」「否」文本时不动
    empty: ""                # null/空串 → 空串（保持模板空值口径）
    reason: >-
      业务口径里这是布尔，ERP 里是文本枚举。导入端不认布尔，写进去会被存成
      "True"/"False" 或者直接报错 —— 必须在导出这一步翻成「是」/「否」。

  # ── ② PXH 排序号 ─────────────────────────────────────────────────────────
  # 我们：空串（NGV 档案 erp_fixed 显式留空 —— 「排序号由 ERP/业务侧填」，
  #       模板默认是 1，留 1 会让人以为我们排过序）。
  # ERP：实测两单都是 PXH=1（ERP 侧自己补的默认值）。
  # 所以导出时空串翻回 1 —— 让 ERP 收到它预期的整数，而不是空串。
  PXH:
    type: empty_to
    values: ["", null]
    to: 1
    reason: >-
      模板默认 1、ERP 实存 1。我们产品里刻意留空是为了「不假装排过序」，
      导入时补回 ERP 的默认值即可，语义不变。

  # ── ③ YYS 每款语言种数 ────────────────────────────────────────────────────
  # 我们：空串（单语言 → 空；业务口径见 ngv.yaml erp_fixed 注释）。
  # ERP：实测两单都是 YYS=null（不是 0、也不是 1）。
  # 所以空串 → null，别写成 1（1 会被读成「单语言，一种语言」，
  # 而「空」表达的是「这件事不适用 / 未确认」）。
  YYS:
    type: empty_to
    values: ["", null]
    to: null
    reason: >-
      业务口径「单语言 → 空」。ERP 未填时就是 null，写 1 会把「不适用」
      变成「一种语言」，语义被改掉。

# ── 回读方向的对照（导账/对账用，导入流程不触发）─────────────────────────
readback:
  SFYPJ:
    "是": true
    "否": false
