                el("h3", { text: ig.name }),
                el("span", { class: "hint", text: ig.hint || "" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge int", text: internal.length + " 个" }),
            ),
            el("div", { class: "field-grid" }, internal.map((f) => renderField(
                f.key,
                { label: f.label, legal: [] },
                f.source === "config_version" ? "配置版本" : null,
            ))),
        ));
    }

    // 多出来的键（当前结构与内部清单都不认识）也要显示，否则会被当成没导出
    const extra = structuralDiff().extra;
    if (extra.length) {
        sections.push(el("section", { class: "panel" },
            el("div", { class: "group-head" },
                el("h3", { text: "其他键（不在当前结构里）" }),
                el("span", { class: "hint", text: "可能是旧版产物留下的键，核对后再决定是否清理" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge warn", text: extra.length + " 个" }),
            ),
            el("div", { class: "field-grid" }, extra.map((k) => renderField(k, specOf(k)))),
        ));
    }
    return el("div", { style: "display:flex;flex-direction:column;gap:14px" }, sections);
}

function renderRaw() {
    if (!state.showRaw) return el("span", { class: "hidden" });
    const n = state.records.length;
    // 多产品时显示**整个数组**（交付物就是一个文件），不是单条 —— 避免误以为只有这一条
    const payload = n > 1 ? state.records : (state.records[0] || state.current || {});
    const json = JSON.stringify(payload, null, 2);
    return el("section", { class: "panel" },
        el("div", { class: "panel-head" },
            el("h2", { text: "原始 JSON" }),
            n > 1 ? el("span", { class: "badge v2", text: "数组 · " + n + " 条" }) : null,
            el("span", { class: "hint", style: "font-size:.78rem;color:var(--ink-3)",
                         text: n > 1
                             ? "整个数组（交付物就是这一个文件；每条记录 59 个 ERP 键，键序不许动）"
                             : "键顺序 = 文件里的实际顺序（前 59 个是 ERP 键，位置不许动）" }),
        ),
        el("pre", { class: "raw", text: json }),
    );
}

function renderEmptyState() {
    return el("section", { class: "panel" },
        el("div", { class: "empty-state" },
            el("h3", { text: "还没有可看的产物" }),
            el("p", { text: "左边列表是空的。" }),
            el("ol", {},
                el("li", {}, "跑一份报价需求：", el("code", { text: "uv run ./scripts/main.py <附件> --customer ngv" })),
                el("li", {}, "然后点右上角", el("b", { text: "🔄 刷新" })),
                el("li", {}, "或者点", el("b", { text: "⬆️ 导入 JSON" }), "直接看具体某个文件"),
            ),
        ),
    );
}

/* ═══════════════════════════════════════════════════════════════════════
   总渲染
   ═══════════════════════════════════════════════════════════════════════ */
/** 浏览器把 `document.title` 当作「另存为 PDF」的默认文件名 → 让它有意义 */
function syncTitle() {
    const m = state.currentMeta;
    if (!m) { document.title = BASE_TITLE; return; }
    const cur = state.current || {};
    const ident = String(cur.CPMC_ZH || cur.CPMC || cur.KHDH || "").trim();
    const stamp = String(m.task_id || "").slice(0, 8);
    // 多产品：标题带上「第几条」，导出的 PDF 才分得清是哪一条
    const which = state.records.length > 1
        ? "第" + (state.activeRecord + 1) + "条/" + state.records.length
        : "";
    // 文件名里不能有的字符换掉（Windows 更严），太长也截一下
    document.title = [BASE_TITLE, stamp, which, ident].filter((s) => s !== "")
        .join(" · ").replace(/[\\/:*?"<>|\n\r\t]/g, "_").slice(0, 120);
}

function render() {
    syncTitle();
    /* 每 10 秒自动刷新会重建整页 —— 正在搜索时会把焦点踢掉。
       记下焦点元素和光标位置，重建后还回去（否则打字打一半就断了）。 */
    const active = document.activeElement;
    const focusId = active && active.id ? active.id : null;
    const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;

    const page = document.getElementById("page");
    const main = el("main");
    if (state.currentMeta) {
        // 任务级摘要 → 产品记录 Tab → 确认清单 → 当前这条记录的字段
        // ★ v3 内部确认清单：字段级、单独成块（v2 旧产物没有这个键 → 不显示）
        const qPanel = renderQuestions(state.records[state.activeRecord]);
        main.append(renderTaskSummary(), renderTabs(), renderSummary(),
                    qPanel ? qPanel : el("span", { class: "hidden" }),
                    renderGroups(), renderRaw());
    } else {
        main.append(renderEmptyState());
    }
    page.replaceChildren(
        renderHeader(),
        el("div", { class: "layout" + (state.listFolded ? " folded" : "") }, renderList(), main),
    );

    if (focusId) {
        const again = document.getElementById(focusId);
        if (again) {
            again.focus();
            if (caret !== null && typeof again.setSelectionRange === "function") {
                try { again.setSelectionRange(caret, caret); } catch (_) { /* 某些类型不支持 */ }
            }
        }
    }
}

/* ═══════════════════════════════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════════════════════════════ */
document.getElementById("fileInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = "";
});

// 上传：普通多选 / 整个文件夹（webkitdirectory）
document.getElementById("uploadInput").addEventListener("change", (e) => {
    doUpload(e.target.files);
    e.target.value = "";
});
document.getElementById("dirInput").addEventListener("change", (e) => {
    state.upload.group = "one";     // 选文件夹 = 这堆文件属于同一份报价
    doUpload(e.target.files);
    e.target.value = "";
});

loadFromServer();

// 业务 2026-10-20：每 10 秒刷新一次（抽取由定时任务做，页面只管把结果捡回来）
setInterval(refreshQuietly, 10000);

// 打印时把清单展开：折叠状态下 body 压根没构建，不只印出个标题就糟了。
// （beforeprint 在 Chrome/Edge/Safari 可靠；不支持的浏览器最多是打印到折叠态）
window.addEventListener("beforeprint", () => {
    if (!state.current || state.current.question_answers === undefined) return;
    if (qaIsOpen(state.activeRecord)) return;
    state.qaOpen[qaOpenKey(state.activeRecord)] = true;
    render();
});
</script>
