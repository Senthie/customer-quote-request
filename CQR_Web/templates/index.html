<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP · 报价需求单导出查看器</title>
    <!--
      ERP 导出 JSON 查看器（配置版本 2 结构）

      这是 Flask 应用的模板（CQR_Web/templates/index.html），由 CQR_Web/app.py
      的 render_template 送出。
      ⚠️ **刻意不含任何 Jinja 语法**（双花括号 / 百分号花括号都不许出现）——
      页面数据全部走下面的 /api/* 读；往模板里塞变量会被 Jinja 吃掉一部分 JS，
      而且报错位置很难查。有测试钉着这条（本注释第一版就误写了双花括号，
      当场被那条测试拦下 —— 别重犯）。

      为什么没有外部依赖：旧版引了 unpkg 的 Vue3 + jsdelivr 的 dayjs，
      断网/内网环境直接白屏 —— 这是个内部生产工具，必须离线可用。
      纯原生 JS + document.createElement，零 CDN。

      数据来源（`CQR_Web/data.py` 算，`app.py` 送 —— 页面不自己判定任何东西）：
        GET /api/schema   字段字典（标签/类型/合法取值）+ 内部字段 + 分组
        GET /api/exports  自动扫描扫描根（默认 customer-files/processed）下的 ERP_*.json
        GET /api/export?path=…  某一份产物的完整 JSON + 权威取值校验 + 交付闸门
      起服务：uv run python -m CQR_Web（或 uv run ./scripts/erp_viewer.py，等价）。
      直接用 file:// 打开也能用，只是没有自动扫描（浏览器不许列目录）→ 走「导入 JSON」。
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --ink: #0b1e3a;
            --ink-2: #33475f;
            --ink-3: #6b7c93;
            --line: #d7dee8;
            --line-2: #e8edf4;
            --brand: #1a3a6f;
            --brand-2: #2550a4;
            --ok: #0f7b52;
            --ok-bg: #e6f6ef;
            --warn: #9a6200;
            --warn-bg: #fff4de;
            --bad: #b02a2a;
            --bad-bg: #fdeced;
            --internal: #5b3fa8;
            --internal-bg: #f0ebfb;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.5;
            padding: 18px;
        }

        /* ── 头部 ───────────────────────────────────────────── */
        header.top {
            max-width: 1720px; margin: 0 auto 14px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 16px 20px;
            box-shadow: 0 6px 18px rgba(11, 30, 58, .06);
        }
        .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 1.32rem; font-weight: 650; letter-spacing: .3px; }
        h1 .sub { font-size: .8rem; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
        .spacer { flex: 1; }
        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button {
            font: inherit; font-size: .84rem; font-weight: 500;
            padding: 7px 14px; border-radius: 30px; cursor: pointer;
            background: #f7f9fc; border: 1px solid #c3cedd;
            color: #1e293b; transition: .15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        button:hover { background: #eaf1fb; border-color: #6f9bd6; }
        button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        button.primary:hover { background: var(--brand-2); }
        button:disabled { opacity: .45; cursor: not-allowed; }
        input[type=file] { display: none; }
        input[type=search], input[type=text] {
            font: inherit; font-size: .85rem; padding: 7px 11px;
            border: 1px solid #cbd5e1; border-radius: 10px; background: #fff;
            color: var(--ink);
        }
        input[type=search]:focus, input[type=text]:focus {
            outline: none; border-color: #2b6eb3; box-shadow: 0 0 0 3px rgba(43,110,179,.13);
        }
        .status { font-size: .8rem; color: var(--ink-3); }
        .status.err { color: var(--bad); }

        .banner {
            margin-top: 12px; padding: 10px 14px; border-radius: 12px;
            font-size: .85rem; border: 1px solid;
        }
        .banner.info { background: #eef4fd; border-color: #c3d8f3; color: #1c4a86; }
        .banner.warn { background: var(--warn-bg); border-color: #f0d09a; color: var(--warn); }
        .banner.bad  { background: var(--bad-bg); border-color: #f0b9bc; color: var(--bad); }
        .banner .gate { margin-top: 3px; padding-left: 2px; }
        .banner code {
            font-family: var(--mono); font-size: .8rem;
            background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 5px;
        }

        /* ── 布局 ───────────────────────────────────────────── */
        .layout {
            max-width: 1720px; margin: 0 auto;
            display: grid; grid-template-columns: 330px minmax(0, 1fr);
            gap: 14px; align-items: start;
        }
        @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; box-shadow: 0 6px 18px rgba(11, 30, 58, .05);
        }
        aside.list { position: sticky; top: 18px; max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
        .panel-head {
            padding: 12px 14px; border-bottom: 1px solid var(--line-2);
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .panel-head h2 { font-size: .92rem; font-weight: 620; }
        .count-badge {
            font-size: .74rem; font-weight: 600; color: var(--brand);
            background: #e9f0fa; border: 1px solid #c8dcf5;
            padding: 1px 8px; border-radius: 20px;
        }
        .items { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

        .item {
            text-align: left; width: 100%; display: block;
            border: 1px solid var(--line-2); border-radius: 11px;
            padding: 9px 11px; background: #fcfdff; cursor: pointer;
            font: inherit; font-size: .82rem; transition: .13s;
        }
        .item:hover { border-color: #9dbbdf; background: #f3f8ff; }
        .item.active { border-color: var(--brand); background: #eaf1fb; box-shadow: 0 0 0 2px rgba(26,58,111,.10); }
        .item .l1 { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
        .item .when { font-family: var(--mono); font-size: .74rem; color: var(--ink-3); }
        .item .tid { font-family: var(--mono); font-size: .72rem; color: var(--ink-2);
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item .cpmc { color: var(--ink-2); font-size: .8rem; margin-top: 3px;
                      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                      overflow: hidden; }
        .item .l3 { margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; }

        main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

        /* ── 徽章 ───────────────────────────────────────────── */
        .badge {
            font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 20px;
            border: 1px solid; white-space: nowrap; display: inline-block;
        }
        .badge.v2    { color: #fff; background: var(--brand); border-color: var(--brand); }
        .badge.ver0  { color: var(--ink-3); background: #eef1f6; border-color: var(--line); }
        .badge.ok    { color: var(--ok); background: var(--ok-bg); border-color: #b9e2d1; }
        .badge.warn  { color: var(--warn); background: var(--warn-bg); border-color: #f0d09a; }
        .badge.bad   { color: var(--bad); background: var(--bad-bg); border-color: #f0b9bc; }
        .badge.old   { color: var(--ink-3); background: #f2f4f8; border-color: var(--line); }
        .badge.int   { color: var(--internal); background: var(--internal-bg); border-color: #d6c9f5; }
        .badge.plain { color: var(--ink-3); background: #f6f8fb; border-color: var(--line-2); }

        /* ── 摘要 ───────────────────────────────────────────── */
        .summary { padding: 14px 16px; }
        .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 18px; }
        .kv { display: flex; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line-2); padding-bottom: 6px; }
        .kv .k { color: var(--ink-3); font-size: .78rem; white-space: nowrap; min-width: 78px; }
        .kv .v { font-family: var(--mono); font-size: .82rem; color: var(--ink); word-break: break-all; }
        .kv .v.plain { font-family: inherit; }

        /* ── 字段组 ─────────────────────────────────────────── */
        .group { border-top: 1px solid var(--line-2); }
        .group:first-of-type { border-top: none; }
        .group-head {
            padding: 11px 16px; background: #f8fafd; display: flex;
            align-items: center; gap: 9px; flex-wrap: wrap;
            border-bottom: 1px solid var(--line-2);
        }
        .group-head h3 { font-size: .9rem; font-weight: 640; }
        .group-head .hint { font-size: .78rem; color: var(--ink-3); }
        .group.internal .group-head { background: #f7f4fe; }

        /* ── 字段：紧凑网格（1.0.27 排版重做）─────────────────────
           以前一个字段独占一行（左 190px 标签 + 右侧值），63 个字段要滚 ~2800px，
           而 TZS=1、CPSX=三岁以上 这类短值把大半行宽白扔了。
           现在同组内按宽度自动分列（窗口越宽列越多），**只有长文本跨整行**。 */
        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        }
        .field {
            display: flex; flex-direction: column; gap: 3px;
            padding: 8px 16px; min-width: 0;
            border-right: 1px dashed var(--line-2);
            border-bottom: 1px dashed var(--line-2);
        }
        .field:hover { background: #fafcff; }
        .field.missing { background: #fdfdfd; }
        .field.wide { grid-column: 1 / -1; border-right: none; }
        .field-label { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
        .field-label .zh { font-size: .82rem; font-weight: 560; color: var(--ink-2); }
        .field-label .code { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
        .field-value { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .field-value .line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .val { font-family: var(--mono); font-size: .84rem; color: var(--ink); word-break: break-word; }
        .val.plain { font-family: inherit; }
        .val.empty { color: var(--ink-3); font-style: italic; }
        .val.illegal { color: var(--bad); font-weight: 600; }

        pre.long {
            font-family: var(--mono); font-size: .79rem; line-height: 1.55;
            background: #f8fafd; border: 1px solid var(--line-2); border-radius: 9px;
            padding: 9px 11px; white-space: pre-wrap; word-break: break-word;
            max-height: 190px; overflow: auto; color: var(--ink-2);
        }
        pre.long.open { max-height: none; }

        details.legal { font-size: .78rem; }
        details.legal summary {
            cursor: pointer; color: var(--brand-2); width: fit-content;
            list-style: none; user-select: none;
        }
        details.legal summary::-webkit-details-marker { display: none; }
        details.legal summary::before { content: '▸ '; }
        details.legal[open] summary::before { content: '▾ '; }
        .legal-list {
            margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;
            max-height: 230px; overflow: auto; padding: 7px;
            background: #f8fafd; border: 1px solid var(--line-2); border-radius: 9px;
        }
        .legal-item {
            font-family: var(--mono); font-size: .74rem; padding: 1px 7px;
            border-radius: 20px; background: #fff; border: 1px solid var(--line);
            color: var(--ink-2);
        }
        .legal-item.cur { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }

        .chk { font-size: .84rem; display: inline-flex; align-items: center; gap: 6px; }
        .chk .box { font-size: 1rem; }

        .empty-state { padding: 40px 24px; text-align: center; color: var(--ink-3); }
        .empty-state h3 { font-size: 1rem; color: var(--ink-2); margin-bottom: 8px; }
        .empty-state ol { text-align: left; max-width: 520px; margin: 12px auto 0; padding-left: 22px; }
        .empty-state li { margin: 5px 0; font-size: .85rem; }
        .empty-state code { font-family: var(--mono); background: #f1f4f9; padding: 1px 6px; border-radius: 5px; }

        pre.raw {
            font-family: var(--mono); font-size: .78rem; line-height: 1.5;
            background: #0f1b2d; color: #d6e2f2; padding: 14px 16px;
            border-radius: 0 0 16px 16px; overflow: auto; max-height: 620px;
            white-space: pre; tab-size: 2;
        }
        .hidden { display: none !important; }
        .foot { padding: 10px 14px; font-size: .74rem; color: var(--ink-3);
                border-top: 1px solid var(--line-2); font-family: var(--mono); word-break: break-all; }

        /* ── 打印 / 导出 PDF（1.0.27）─────────────────────────────
           零依赖做法：按钮调 `window.print()`，浏览器「另存为 PDF」即得文件。
           刻意不引 jsPDF / html2canvas 之类的库：
             * 这页面**必须离线可用**（内网/断网），引 CDN 会白屏；
             * 引库还得再抄一份排版，跟屏幕上的必然漂。
           所以要打印的东西就一套 DOM + 下面这些覆盖规则。 */
        @media print {
            @page { size: A4; margin: 12mm; }
            body { background: #fff; padding: 0; font-size: 11px; }
            header.top {
                box-shadow: none; border: none; border-radius: 0;
                padding: 0 0 8px; margin: 0 0 10px;
                border-bottom: 2px solid var(--ink);
            }
            .layout { display: block; max-width: none; }
            /* 侧栏 / 工具栏 / 原始 JSON / 合法取值清单 —— 都是「查询用」的，不进 PDF */
            aside.list, .toolbar, .no-print, pre.raw, details.legal { display: none !important; }
            button { display: none !important; }        /* 展开/收起这类控件也别进 PDF */
            main { gap: 8px; }
            .panel { box-shadow: none; border-radius: 0; }
            .group-head { background: #f1f5fa !important; break-after: avoid; page-break-after: avoid; }
            .field-grid { grid-template-columns: repeat(3, 1fr); }   /* A4 竖版固定 3 列 */
            .field { break-inside: avoid; page-break-inside: avoid; }
            .banner { break-inside: avoid; }
            pre.long { max-height: none; overflow: visible; background: #fff; }  /* 长文本全量打印 */
        }
    </style>
</head>
<body>
<div id="page"></div>
<input type="file" id="fileInput" accept=".json,application/json">

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   状态
   ═══════════════════════════════════════════════════════════════════════ */
const state = {
    schema: null,          // /api/schema 的回应
    exports: [],           // /api/exports 的 exports
    scanRoot: "",
    scanOk: false,         // 服务端可达 → 能自动扫描
    scanError: "",
    current: null,         // 当前选中的产物（原始对象）
    currentMeta: null,     // 列表项（含 relpath / mtime / superseded）
    validation: null,      // 权威取值校验结果（服务端给 /api/export 带回来的）
    incomplete: null,      // 交付闸门：CPMS 未写 / 中文品名占位符（服务端算，页面只显示）
    filter: "",
    showRaw: false,
    openPre: {},           // 长文本展开状态 { key: bool }
};

const BASE_TITLE = "ERP · 报价需求单导出查看器";

/* ═══════════════════════════════════════════════════════════════════════
   小工具
   ═══════════════════════════════════════════════════════════════════════ */
function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = String(v);
        else if (k === "html") node.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") {
            node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) node.setAttribute(k, "");
        else node.setAttribute(k, String(v));
    }
    for (const c of children.flat(Infinity)) {
        if (c === null || c === undefined || c === false) continue;
        node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
}

const isEmptyValue = (v) => v === null || v === undefined || v === "";

/** 值的展示文本（null / 空 都变成可读文案，不显示 "null" 这种裸值） */
function describeValue(v) {
    if (v === null) return { text: "null（空值）", cls: "empty" };
    if (v === undefined) return { text: "本产物缺失该键", cls: "empty" };
    if (v === "") return { text: "（空字符串）", cls: "empty" };
    if (typeof v === "boolean") return { text: v ? "true（勾选）" : "false（未勾选）", cls: "plain" };
    if (typeof v === "number") return { text: String(v), cls: "" };
    return { text: String(v), cls: "plain" };
}

/** 是否属于「长文本」字段（用 <pre> 渲染 + 展开按钮） */
function isLongText(key, value) {
    if (typeof value !== "string") return false;
    if (value.includes("\n")) return true;
    if (/^(CPMS|BGMS|Remark|CPMX|Remark1|Remark3|Remark4)$/.test(key)) return value.length > 60;
    return value.length > 160;
}

/** 这个字段在网格里要不要跨整行 —— 长值 / 长文本 / 带校验原因的都要，短值挤成多列 */
function fieldIsWide(key, value) {
    if (isLongText(key, value)) return true;
    if (typeof value === "string" && value.length > 40) return true;
    const issue = issueMap()[key];
    return !!(issue && issue.message);
}

function fmtNum(n) {
    if (typeof n !== "number" || !Number.isFinite(n)) return String(n);
    return n.toLocaleString("en-US");
}

/* ═══════════════════════════════════════════════════════════════════════
   数据加载
   ═══════════════════════════════════════════════════════════════════════ */
async function loadFromServer() {
    try {
        const [schemaRes, listRes] = await Promise.all([
            fetch("api/schema", { cache: "no-store" }),
            fetch("api/exports", { cache: "no-store" }),
        ]);
        if (!schemaRes.ok) throw new Error("schema HTTP " + schemaRes.status);
        if (!listRes.ok) throw new Error("exports HTTP " + listRes.status);
        state.schema = await schemaRes.json();
        const list = await listRes.json();
        state.exports = list.exports || [];
        state.scanRoot = list.root || "";
        state.scanOk = true;
        state.scanError = "";

        // 支持 ?path=… 深链接；否则自动选最新的一份
        const want = new URLSearchParams(location.search).get("path");
        const target = (want && state.exports.find((e) => e.relpath === want))
            || state.exports.find((e) => !e.superseded)
            || state.exports[0]
            || null;
        if (target) await selectExport(target);
        render();
    } catch (err) {
        state.scanOk = false;
        state.scanError = (err && err.message) || String(err);
        state.exports = [];
        render();
    }
}

async function selectExport(meta) {
    try {
        const res = await fetch("api/export?path=" + encodeURIComponent(meta.relpath), { cache: "no-store" });
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || ("HTTP " + res.status));
        }
        const payload = await res.json();
        state.current = payload.data || {};
        state.validation = payload.validation || null;
        state.incomplete = payload.incomplete || [];
        state.currentMeta = meta;
        state.showRaw = false;
        state.openPre = {};
        try {
            history.replaceState(null, "", "?path=" + encodeURIComponent(meta.relpath));
        } catch (_) { /* file:// 下可能不允许，忽略 */ }
    } catch (err) {
        state.current = {};
        state.validation = null;
        state.incomplete = null;   // 取不到产物 → 交付状态未知，不瞎标
        state.currentMeta = meta;
        state.currentMeta.loadError = (err && err.message) || String(err);
    }
    render();
}

/** 手动导入（没有服务端时唯一的路） */
function importFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            state.current = data && typeof data === "object" && !Array.isArray(data) ? data : {};
            state.validation = null;   // 手动导入没有权威校验结果（页面会说明）
            state.incomplete = null;   // 交付闸门也只在服务端算 → 手动导入判不了，不瞎标
            state.currentMeta = {
                relpath: file.name, filename: file.name,
                task_id: "(手动导入)", mtime_iso: new Date(file.lastModified).toLocaleString("sv-SE"),
                size: file.size, superseded: false, key_count: Object.keys(state.current).length,
                manual: true,
            };
            state.showRaw = false;
            state.openPre = {};
            render();
        } catch (err) {
            alert("JSON 解析失败：" + err.message);
        }
    };
    reader.readAsText(file, "utf-8");
}

/* ═══════════════════════════════════════════════════════════════════════
   派生：结构对照（这份产物 vs 当前 59 键结构）
   ═══════════════════════════════════════════════════════════════════════ */
function structuralDiff() {
    const cur = state.current || {};
    const schema = state.schema || {};
    const erpKeys = (schema.erp_fields || []).map((f) => f.key);
    const internalKeys = (schema.internal_fields || []).map((f) => f.key);
    const actual = Object.keys(cur);
    return {
        erpKeys,
        internalKeys,
        missing: erpKeys.filter((k) => !(k in cur)),
        extra: actual.filter((k) => !erpKeys.includes(k) && !internalKeys.includes(k)),
        missingInternal: internalKeys.filter((k) => !(k in cur)),
        actualCount: actual.length,
    };
}

function specOf(key) {
    const list = (state.schema && state.schema.erp_fields) || [];
    return list.find((f) => f.key === key) || null;
}

function internalSpecOf(key) {
    const list = (state.schema && state.schema.internal_fields) || [];
    return list.find((f) => f.key === key) || null;
}

/** {字段: {level, message}} —— 来自服务端的**权威**校验结果（erp_schema.validate_result
 *  原样带过来的当次运行报告）。页面**不自己比枚举**：
 *  `CPLB` 我们的口径是「编号;名称」，而字典的 legal 列表是 88 个裸名称 ——
 *  前端拿字符串直接比会把每一份产物的 CPLB 都误标成非法（真踩过，2026-09-24）。 */
function issueMap() {
    const map = {};
    const v = state.validation;
    if (!v) return map;
    for (const issue of [...(v.errors || []), ...(v.warnings || [])]) {
        const f = issue && issue.field;
        if (!f) continue;
        const level = issue.level === "error" ? "error" : "warn";
        // 同一字段多条：error 优先
        if (!map[f] || (map[f].level === "warn" && level === "error")) {
            map[f] = { level, message: issue.message || "" };
        }
    }
    return map;
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：头部
   ═══════════════════════════════════════════════════════════════════════ */
function renderHeader() {
    const cfgVer = state.schema ? state.schema.config_version : null;
    const cur = state.current || {};
    const curVer = cur.version;

    let verBadge;
    if (curVer === undefined) {
        verBadge = el("span", { class: "badge old", text: "产物无 version（第 1 代口径）" });
    } else if (cfgVer !== null && curVer === cfgVer) {
        verBadge = el("span", { class: "badge v2", text: "version " + curVer + "（= 当前配置）" });
    } else {
        verBadge = el("span", { class: "badge warn", text: "version " + curVer + "（当前配置 " + cfgVer + "）" });
    }

    const status = el("span", { class: "status" + (state.scanOk ? "" : " err") });
    if (state.scanOk) {
        status.textContent = "已扫描 " + state.exports.length + " 份产物";
    } else {
        status.textContent = "未连上服务端（" + state.scanError + "）";
    }

    const toolbar = el("div", { class: "toolbar" },
        status,
        el("button", {
            onclick: () => loadFromServer(),
            title: "重新扫描 customer-files/processed",
        }, "🔄 刷新"),
        el("button", {
            onclick: () => document.getElementById("fileInput").click(),
        }, "⬆️ 导入 JSON"),
        el("button", {
            class: "no-print",
            disabled: !state.currentMeta,
            onclick: () => window.print(),
            title: "打开浏览器打印对话框 → 目标选「另存为 PDF」。"
                 + "PDF 由浏览器生成（零依赖、离线可用），排版跟屏幕一致；"
                 + "侧栏、工具栏、原始 JSON、字典取值清单都不会进 PDF。",
        }, "🖨 导出 PDF"),
        el("button", {
            class: state.showRaw ? "primary" : "",
            disabled: !state.currentMeta,
            onclick: () => { state.showRaw = !state.showRaw; render(); },
        }, "{ } 原始 JSON"),
        state.current ? verBadge : null,
    );

    const head = el("header", { class: "top" },
        el("div", { class: "title-row" },
            el("h1", {}, "📘 ERP · 报价需求单导出",
                el("span", { class: "sub", text: "配置版本 " + (cfgVer === null ? "?" : cfgVer) + " · 59 个 ERP 字段 + 内部字段" })),
            el("div", { class: "spacer" }),
            toolbar,
        ),
    );

    if (!state.scanOk) {
        head.append(el("div", { class: "banner warn" },
            el("span", {},
                "浏览器不允许 ", el("code", { text: "file://" }), " 页面列出本地目录，所以「自动扫描」需要一个小服务端。",
                el("br"),
                "在仓库根目录跑：", el("code", { text: "uv run python -m CQR_Web" }),
                " 然后打开它给出的地址（会自动开浏览器）。现在也可以点「导入 JSON」手动看单份文件。"),
        ));
    }

    // ★ 未完成 · 不得交付 —— 比下面的「提醒」更严重，放上头
    //   （CPMS / 中文品名这两处脚本刻意不写，管道刚跑完的产物天然是这个状态）
    if (Array.isArray(state.incomplete) && state.incomplete.length) {
        const gate = el("div", { class: "banner bad" },
            el("div", {},
                el("b", { text: "❗ 未完成 · 不得交付" }),
                el("span", { text: " —— 产物里还有必须由 agent 亲自补的地方：" })));
        for (const why of state.incomplete) {
            gate.append(el("div", { class: "gate", text: "· " + why }));
        }
        head.append(gate);
    }

    const reminder = cur.Reminder;
    if (typeof reminder === "string" && reminder.trim() !== "") {
        head.append(el("div", { class: "banner bad" },
            el("span", { text: "⚠️ " + reminder })));
    }
    if (state.currentMeta && state.currentMeta.loadError) {
        head.append(el("div", { class: "banner bad", text: "读取失败：" + state.currentMeta.loadError }));
    }
    return head;
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：左侧产物列表
   ═══════════════════════════════════════════════════════════════════════ */
function renderList() {
    const q = state.filter.trim().toLowerCase();
    const items = state.exports.filter((it) => {
        if (!q) return true;
        return [it.task_id, it.CPMC, it.CPMC_ZH, it.ID, it.relpath, it.KHDH,
                String(it.version ?? ""), it.mtime_iso]
            .some((s) => String(s ?? "").toLowerCase().includes(q));
    });

    const head = el("div", { class: "panel-head" },
        el("h2", { text: "产物列表" }),
        el("span", { class: "count-badge", text: items.length + " / " + state.exports.length }),
    );

    const search = el("div", { style: "padding:8px 10px 0" },
        el("input", {
            type: "search", placeholder: "按 task_id / CPMC / 单号 / 版本 过滤…",
            value: state.filter, style: "width:100%",
            oninput: (e) => { state.filter = e.target.value; renderListOnly(); },
        }));

    const box = el("div", { class: "items", id: "itemsBox" });
    if (!state.exports.length) {
        box.append(el("div", { class: "empty-state", style: "padding:22px 12px" },
            el("div", { text: state.scanOk ? "processed/ 下还没有 ERP_*.json" : "未连上服务端" })));
    }
    for (const it of items) {
        const active = state.currentMeta && state.currentMeta.relpath === it.relpath;
        const badges = el("div", { class: "l3" });
        if (it.broken) {
            badges.append(el("span", { class: "badge bad", text: "文件损坏" }));
        } else {
            badges.append(it.version === undefined
                ? el("span", { class: "badge old", text: "v1（无 version）" })
                : el("span", { class: "badge v2", text: "v" + it.version }));
            badges.append(el("span", {
                class: "badge " + (it.key_count === 59 ? "plain" : "warn"),
                text: it.key_count + " 键",
                title: "当前结构 = 59 ERP + 内部字段",
            }));
            // 当次运行的校验结果（没有报告就不标，别拿现算的吓人）
            const v = it.validation;
            if (v) {
                badges.append(el("span", {
                    class: "badge " + (v.error ? "bad" : (v.warn ? "warn" : "ok")),
                    text: v.error || v.warn ? `${v.error}e/${v.warn}w` : "校验通过",
                    title: "本次运行的取值校验（erp_schema）"
                        + (it.customer ? "，客户档案 " + it.customer : ""),
                }));
            }
            if (it.customer) {
                badges.append(el("span", { class: "badge plain", text: it.customer }));
            }
            if (it.incomplete && it.incomplete.length) {
                badges.append(el("span", {
                    class: "badge bad", text: "未完成",
                    title: "不得交付：" + it.incomplete.join("；"),
                }));
            }
            if (it.superseded) badges.append(el("span", { class: "badge old", text: "已被取代" }));
        }
        box.append(el("button", {
            class: "item" + (active ? " active" : ""),
            onclick: () => selectExport(it),
        },
            el("div", { class: "l1" },
                el("span", { class: "when", text: it.mtime_iso || "" }),
                el("div", { class: "spacer" }),
            ),
            el("div", { class: "tid", text: it.task_id || "" }),
            el("div", { class: "cpmc", text: it.CPMC_ZH || it.CPMC || "（无产品名称）" }),
            badges,
        ));
    }

    const foot = el("div", { class: "foot", text: state.scanRoot || "(未连接服务端)" });
    return el("aside", { class: "panel list", id: "listPanel" }, head, search, box, foot);
}

/* 只刷列表，避免每次输入都重建整个页面（会丢焦点） */
function renderListOnly() {
    const old = document.getElementById("listPanel");
    if (!old) return render();
    old.replaceWith(renderList());
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：字段值
   ═══════════════════════════════════════════════════════════════════════ */
function renderValue(key, value, spec) {
    const wrap = el("div", { class: "field-value" });
    const isMissing = !(key in (state.current || {}));

    // 勾选框
    if (typeof value === "boolean") {
        wrap.append(el("div", { class: "line" },
            el("span", { class: "chk" },
                el("span", { class: "box", text: value ? "☑" : "☐" }),
                el("span", { text: value ? "勾选" : "未勾选" })),
        ));
        return wrap;
    }

    // 空值 / null / 缺失
    if (isEmptyValue(value) && !isMissing) {
        const d = describeValue(value);
        wrap.append(el("span", { class: "val " + d.cls, text: d.text }));
        return wrap;
    }
    if (isMissing) {
        wrap.append(el("span", { class: "val empty", text: "本产物缺失该键" }));
        return wrap;
    }

    // 长文本
    if (isLongText(key, value)) {
        const open = !!state.openPre[key];
        const pre = el("pre", { class: "long" + (open ? " open" : ""), text: value });
        const btn = el("button", {
            style: "align-self:flex-start;font-size:.76rem;padding:3px 10px",
            onclick: () => { state.openPre[key] = !open; render(); },
        }, open ? "收起" : ("展开全文（" + value.length + " 字）"));
        wrap.append(pre, btn);
        return wrap;
    }

    // 普通值 + 枚举校验
    const line = el("div", { class: "line" });
    const text = String(value);
    if (typeof value === "number") {
        line.append(el("span", { class: "val", text: text }),
            text.length > 4 ? el("span", { class: "badge plain", text: fmtNum(value) }) : null);
    } else {
        line.append(el("span", { class: "val plain", text: text }));
    }

    const legal = (spec && spec.legal) || [];
    const issue = issueMap()[key];
    if (issue) {
        // 权威校验结果：error 红 / warn 黄，带后端给的原因
        line.append(el("span", {
            class: "badge " + (issue.level === "error" ? "bad" : "warn"),
            text: issue.level === "error" ? "校验 error" : "校验 warn",
            title: issue.message,
        }));
        if (issue.message) {
            wrap.append(el("div", {
                style: "font-size:.77rem;color:" + (issue.level === "error"
                    ? "var(--bad)" : "var(--warn)") + ";line-height:1.45",
                text: issue.message,
            }));
        }
    }
    wrap.append(line);

    // 枚举字段：折叠列出字典里的合法取值，纯参考（**不做判定** —— 认定交给 erp_schema）
    if (legal.length) {
        const listBox = el("div", { class: "legal-list" },
            legal.map((v) => el("span", { class: "legal-item" + (v === text ? " cur" : ""), text: v })));
        wrap.append(el("details", { class: "legal" },
            el("summary", { text: "字典合法取值（" + legal.length + "）" }), listBox));
    }
    return wrap;
}

function renderField(key, spec, badgeText) {
    const cur = state.current || {};
    const missing = !(key in cur);
    const zh = spec ? spec.label : "";
    const label = el("div", { class: "field-label" },
        el("span", { class: "zh", text: (zh || "（字典里没有）") }),
        el("span", { class: "code", text: key }),
    );
    // 长值跨整行，短值跟邻居并排（排版见 CSS 的 .field-grid / .field.wide）
    const wide = fieldIsWide(key, cur[key]) ? " wide" : "";
    const field = el("div", { class: "field" + wide + (missing ? " missing" : "") }, label,
        renderValue(key, cur[key], spec));
    if (badgeText) {
        label.querySelector(".zh").append(" ", el("span", { class: "badge int", text: badgeText }));
    }
    return field;
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：主区
   ═══════════════════════════════════════════════════════════════════════ */
/** 取值校验徽章 —— 用服务端权威结果（run_report 最可信） */
function validBadge() {
    const v = state.validation;
    if (!v) return el("span", { class: "badge plain", text: "无校验结果" });
    const e = (v.errors || []).length;
    const w = (v.warnings || []).length;
    if (v.source === "unavailable") return el("span", { class: "badge warn", text: "校验不可用" });
    const src = v.source === "run_report"
        ? ("本次运行报告" + (v.customer ? "·客户 " + v.customer : ""))
        : "现场重算（未按档案豁免）";
    return el("span", {
        class: "badge " + (e ? "bad" : (w ? "warn" : "ok")),
        text: "校验 " + e + " error / " + w + " warn（" + src + "）",
        title: v.note || "",
    });
}

function renderSummary() {
    const m = state.currentMeta || {};
    const d = structuralDiff();
    const cur = state.current || {};
    const kvs = [
        ["任务ID", m.task_id || "-"],
        ["配置版本", cur.version === undefined ? "缺（第 1 代产物）" : String(cur.version)],
        ["文件名", m.filename || "-"],
        ["产出时间", m.mtime_iso || "-"],
        ["键统计", d.actualCount + " 个（应有 " + d.erpKeys.length + " ERP"
            + (d.internalKeys.length ? " + " + d.internalKeys.length + " 内部" : "") + "）"],
        ["CPLB", cur.CPLB === undefined ? "缺" : String(cur.CPLB || "（空）")],
        ["TZS / CPSL1", (cur.TZS ?? "缺") + " 款 / " + (cur.CPSL1 ?? "缺")],
        ["KHDH", cur.KHDH === undefined ? "缺" : (cur.KHDH || "（空）")],
    ];
    const panel = el("section", { class: "panel" },
        el("div", { class: "panel-head" }, el("h2", { text: "本份产物" }),
            m.superseded ? el("span", { class: "badge old", text: "已被取代" }) : null,
            m.manual ? el("span", { class: "badge plain", text: "手动导入" }) : null,
            m.broken ? el("span", { class: "badge bad", text: "文件损坏" }) : null,
            validBadge(),
        ),
        el("div", { class: "summary" },
            el("div", { class: "kv-grid" },
                kvs.map(([k, v]) => el("div", { class: "kv" },
                    el("span", { class: "k", text: k }),
                    el("span", { class: "v", text: v })))),
        ),
    );

    // 结构对照：缺了哪些当前结构的键 —— 旧产物一眼看出差在哪
    const notes = el("div", { style: "padding:0 16px 14px;display:flex;flex-direction:column;gap:7px" });
    if (d.missing.length) {
        notes.append(el("div", { class: "banner warn", style: "margin:0" },
            el("div", {}, el("b", { text: "缺 " + d.missing.length + " 个 ERP 字段（当前结构有、这份没有）：" })),
            el("div", { class: "code", style: "font-family:var(--mono);font-size:.76rem", text: d.missing.join(", ") }),
        ));
    }
    if (d.missingInternal.length) {
        notes.append(el("div", { class: "banner warn", style: "margin:0" },
            el("b", { text: "缺内部字段：" }), String(d.missingInternal.join(", "))));
    }
    if (d.extra.length) {
        notes.append(el("div", { class: "banner info", style: "margin:0" },
            el("b", { text: "多出 " + d.extra.length + " 个不在当前结构与内部清单里的键：" }),
            " " + d.extra.join(", ")));
    }
    if (!d.missing.length && !d.extra.length && !d.missingInternal.length) {
        notes.append(el("div", { class: "banner info", style: "margin:0" },
            "✅ 键与当前结构完全一致（" + d.erpKeys.length + " ERP + " + d.internalKeys.length + " 内部）"));
    }
    if (notes.children.length) panel.append(notes);
    return panel;
}

function renderGroups() {
    const cur = state.current || {};
    const schema = state.schema;
    if (!schema) return el("div");

    const groups = schema.groups || [];
    const groupKeys = new Set(groups.flatMap((g) => g.keys));
    // 字典里有、但没归组的键 → 落到「其他」，绝不静默丢掉
    const ungrouped = (schema.erp_fields || []).map((f) => f.key).filter((k) => !groupKeys.has(k));

    const sections = [];
    for (const g of [...groups, { name: "其他（未归组）", hint: "字典里有但还没归类的字段", keys: ungrouped }]) {
        const keys = g.keys;
        if (!keys.length) continue;
        const fieldCount = keys.filter((k) => k in cur).length;
        sections.push(el("section", { class: "panel" },
            el("div", { class: "group-head" },
                el("h3", { text: g.name }),
                el("span", { class: "hint", text: g.hint || "" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge " + (fieldCount === keys.length ? "plain" : "warn"),
                             text: fieldCount + " / " + keys.length + " 有值" }),
            ),
            el("div", { class: "field-grid" }, keys.map((k) => renderField(k, specOf(k)))),
        ));
    }

    // 内部导出字段单独成组
    const internal = schema.internal_fields || [];
    const ig = schema.internal_group || { name: "内部导出字段", hint: "" };
    if (internal.length) {
        sections.push(el("section", { class: "panel group internal" },
            el("div", { class: "group-head" },
                el("h3", { text: ig.name }),
                el("span", { class: "hint", text: ig.hint || "" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge int", text: internal.length + " 个" }),
            ),
            el("div", { class: "field-grid" }, internal.map((f) => renderField(
                f.key,
                { label: f.label, legal: [] },
                f.source === "config_version" ? "配置版本" : null,
            ))),
        ));
    }

    // 多出来的键（当前结构与内部清单都不认识）也要显示，否则会被当成没导出
    const extra = structuralDiff().extra;
    if (extra.length) {
        sections.push(el("section", { class: "panel" },
            el("div", { class: "group-head" },
                el("h3", { text: "其他键（不在当前结构里）" }),
                el("span", { class: "hint", text: "可能是旧版产物留下的键，核对后再决定是否清理" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge warn", text: extra.length + " 个" }),
            ),
            el("div", { class: "field-grid" }, extra.map((k) => renderField(k, specOf(k)))),
        ));
    }
    return el("div", { style: "display:flex;flex-direction:column;gap:14px" }, sections);
}

function renderRaw() {
    if (!state.showRaw) return el("span", { class: "hidden" });
    const json = JSON.stringify(state.current, null, 2);
    return el("section", { class: "panel" },
        el("div", { class: "panel-head" },
            el("h2", { text: "原始 JSON" }),
            el("span", { class: "hint", style: "font-size:.78rem;color:var(--ink-3)",
                         text: "键顺序 = 文件里的实际顺序（前 59 个是 ERP 键，位置不许动）" }),
        ),
        el("pre", { class: "raw", text: json }),
    );
}

function renderEmptyState() {
    return el("section", { class: "panel" },
        el("div", { class: "empty-state" },
            el("h3", { text: "还没有可看的产物" }),
            el("p", { text: "左边列表是空的。" }),
            el("ol", {},
                el("li", {}, "跑一份报价需求：", el("code", { text: "uv run ./scripts/main.py <附件> --customer ngv" })),
                el("li", {}, "然后点右上角", el("b", { text: "🔄 刷新" })),
                el("li", {}, "或者点", el("b", { text: "⬆️ 导入 JSON" }), "直接看具体某个文件"),
            ),
        ),
    );
}

/* ═══════════════════════════════════════════════════════════════════════
   总渲染
   ═══════════════════════════════════════════════════════════════════════ */
/** 浏览器把 `document.title` 当作「另存为 PDF」的默认文件名 → 让它有意义 */
function syncTitle() {
    const m = state.currentMeta;
    if (!m) { document.title = BASE_TITLE; return; }
    const cur = state.current || {};
    const ident = String(cur.CPMC_ZH || cur.CPMC || cur.KHDH || "").trim();
    const stamp = String(m.task_id || "").slice(0, 8);
    // 文件名里不能有的字符换掉（Windows 更严），太长也截一下
    document.title = [BASE_TITLE, stamp, ident].filter((s) => s !== "")
        .join(" · ").replace(/[\\/:*?"<>|\n\r\t]/g, "_").slice(0, 120);
}

function render() {
    syncTitle();
    const page = document.getElementById("page");
    const main = el("main");
    if (state.currentMeta) {
        main.append(renderSummary(), renderGroups(), renderRaw());
    } else {
        main.append(renderEmptyState());
    }
    page.replaceChildren(
        renderHeader(),
        el("div", { class: "layout" }, renderList(), main),
    );
}

/* ═══════════════════════════════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════════════════════════════ */
document.getElementById("fileInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = "";
});
loadFromServer();
</script>
