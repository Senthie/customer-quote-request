<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP · 报价需求单导出查看器</title>
    <!--
      ERP 导出 JSON 查看器（配置版本 2 结构）

      这是 Flask 应用的模板（CQR_Web/templates/index.html），由 CQR_Web/app.py
      的 render_template 送出。
      ⚠️ **刻意不含任何 Jinja 语法**（双花括号 / 百分号花括号都不许出现）——
      页面数据全部走下面的 /api/* 读；往模板里塞变量会被 Jinja 吃掉一部分 JS，
      而且报错位置很难查。有测试钉着这条（本注释第一版就误写了双花括号，
      当场被那条测试拦下 —— 别重犯）。

      为什么没有外部依赖：旧版引了 unpkg 的 Vue3 + jsdelivr 的 dayjs，
      断网/内网环境直接白屏 —— 这是个内部生产工具，必须离线可用。
      纯原生 JS + document.createElement，零 CDN。

      数据来源（`CQR_Web/data.py` 算，`app.py` 送 —— 页面不自己判定任何东西）：
        GET /api/schema   字段字典（标签/类型/合法取值）+ 内部字段 + 分组
        GET /api/exports  自动扫描扫描根（默认 customer-files/processed）下的 ERP_*.json
        GET /api/export?path=…  某一份产物的完整 JSON + 权威取值校验 + 交付闸门
        GET /api/pending  还在等抽取的文件（排队条）
        POST /api/uploads 上传客户文件 → customer-files/pending/（本页唯一的写操作）
      起服务：uv run python -m CQR_Web（或 uv run ./scripts/erp_viewer.py，等价）。
      直接用 file:// 打开也能用，只是没有自动扫描（浏览器不许列目录）→ 走「导入 JSON」。

      1.0.43 分工：**页面只上传 + 只展示**。抽取由 Hermes 定时任务
      （`scripts/scan_pending.py`，每 5 分钟）扫 pending 时执行 —— 所以上传后
      最多等 5 分钟，产物会自动出现在列表里；页面每 10 秒刷新一次。
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --ink: #0b1e3a;
            --ink-2: #33475f;
            --ink-3: #6b7c93;
            --line: #d7dee8;
            --line-2: #e8edf4;
            --brand: #1a3a6f;
            --brand-2: #2550a4;
            --ok: #0f7b52;
            --ok-bg: #e6f6ef;
            --warn: #9a6200;
            --warn-bg: #fff4de;
            --bad: #b02a2a;
            --bad-bg: #fdeced;
            --internal: #5b3fa8;
            --internal-bg: #f0ebfb;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.5;
            padding: 18px;
        }

        /* ── 头部 ───────────────────────────────────────────── */
        header.top {
            max-width: 1720px; margin: 0 auto 14px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 16px 20px;
            box-shadow: 0 6px 18px rgba(11, 30, 58, .06);
        }
        .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 1.32rem; font-weight: 650; letter-spacing: .3px; }
        h1 .sub { font-size: .8rem; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
        .spacer { flex: 1; }
        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button {
            font: inherit; font-size: .84rem; font-weight: 500;
            padding: 7px 14px; border-radius: 30px; cursor: pointer;
            background: #f7f9fc; border: 1px solid #c3cedd;
            color: #1e293b; transition: .15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        button:hover { background: #eaf1fb; border-color: #6f9bd6; }
        button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        button.primary:hover { background: var(--brand-2); }
        button:disabled { opacity: .45; cursor: not-allowed; }
        input[type=file] { display: none; }
        input[type=search], input[type=text] {
            font: inherit; font-size: .85rem; padding: 7px 11px;
            border: 1px solid #cbd5e1; border-radius: 10px; background: #fff;
            color: var(--ink);
        }
        input[type=search]:focus, input[type=text]:focus {
            outline: none; border-color: #2b6eb3; box-shadow: 0 0 0 3px rgba(43,110,179,.13);
        }
        .status { font-size: .8rem; color: var(--ink-3); }
        .status.err { color: var(--bad); }

        /* ── 上传区（1.0.43）──────────────────────────────────── */
        .upload {
            margin-top: 12px; padding: 12px 14px;
            border: 1px solid var(--line-2); border-radius: 14px; background: #fbfcfe;
        }
        .upload-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
        .dropzone {
            flex: 1 1 300px; min-height: 64px; padding: 10px 12px;
            border: 2px dashed #b6c6db; border-radius: 12px; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; cursor: pointer; transition: .12s; text-align: center;
        }
        .dropzone:hover { border-color: #8fb3dd; background: #f8fbff; }
        .dropzone.hot { border-color: var(--brand-2); background: #eef5ff; }
        .dropzone .d1 { font-size: .9rem; font-weight: 550; color: var(--ink-2); }
        .dropzone .d2 { font-size: .77rem; color: var(--ink-3); }
        .upload-side { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .upload-opts { display: flex; gap: 12px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); }
        .upload-opts label {
            display: inline-flex; gap: 5px; align-items: center; cursor: pointer;
            padding: 3px 9px; border-radius: 20px; border: 1px solid transparent;
        }
        .upload-opts label:hover { background: #eef5ff; border-color: #cfe0f5; }
        .upload-opts input[type=radio] { accent-color: var(--brand-2); }
        .upload-msg { margin-top: 9px; font-size: .8rem; line-height: 1.45; }
        .upload-msg.ok { color: var(--ok); }
        .upload-msg.err { color: var(--bad); }
        .upload-msg.busy { color: var(--brand-2); }

        /* ── 等待抽取条 ───────────────────────────────────────── */
        .pending-strip {
            margin-top: 10px; padding: 8px 12px; border-radius: 12px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            background: var(--warn-bg); border: 1px solid #f0dcae; color: var(--warn);
            font-size: .82rem;
        }
        .pending-strip .pname {
            font-family: var(--mono); font-size: .77rem; color: var(--ink-2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62ch;
        }

        .banner {
            margin-top: 12px; padding: 10px 14px; border-radius: 12px;
            font-size: .85rem; border: 1px solid;
        }
        .banner.info { background: #eef4fd; border-color: #c3d8f3; color: #1c4a86; }
        .banner.warn { background: var(--warn-bg); border-color: #f0d09a; color: var(--warn); }
        .banner.bad  { background: var(--bad-bg); border-color: #f0b9bc; color: var(--bad); }
        .banner .gate { margin-top: 3px; padding-left: 2px; }
        .banner code {
            font-family: var(--mono); font-size: .8rem;
            background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 5px;
        }

        /* ── 布局 ───────────────────────────────────────────── */
        .layout {
            max-width: 1720px; margin: 0 auto;
            display: grid; grid-template-columns: 330px minmax(0, 1fr);
            gap: 14px; align-items: start;
        }
        @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; box-shadow: 0 6px 18px rgba(11, 30, 58, .05);
        }
        aside.list { position: sticky; top: 18px; max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
        .panel-head {
            padding: 12px 14px; border-bottom: 1px solid var(--line-2);
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .panel-head h2 { font-size: .92rem; font-weight: 620; }
        .count-badge {
            font-size: .74rem; font-weight: 600; color: var(--brand);
            background: #e9f0fa; border: 1px solid #c8dcf5;
            padding: 1px 8px; border-radius: 20px;
        }
        .items { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

        .item {
            text-align: left; width: 100%; display: block;
            border: 1px solid var(--line-2); border-radius: 11px;
            padding: 9px 11px; background: #fcfdff; cursor: pointer;
            font: inherit; font-size: .82rem; transition: .13s;
        }
        .item:hover { border-color: #9dbbdf; background: #f3f8ff; }
        .item.active { border-color: var(--brand); background: #eaf1fb; box-shadow: 0 0 0 2px rgba(26,58,111,.10); }
        .item .l1 { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
        .item .when { font-family: var(--mono); font-size: .74rem; color: var(--ink-3); }
        .item .tid { font-family: var(--mono); font-size: .72rem; color: var(--ink-2);
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item .cpmc { color: var(--ink-2); font-size: .8rem; margin-top: 3px;
                      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                      overflow: hidden; }
        .item .l3 { margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; }
        /* 列表主标题 = 用户上传时的原始文件名（不是那一串 task_id 哈希） */
        .item .src { color: var(--ink); font-weight: 600; font-size: .83rem; margin-top: 2px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── 产物列表折叠（业务 2026-10-21：列表要能收起来，把宽度还给产物） */
        .layout.folded { grid-template-columns: 46px minmax(0, 1fr); }
        @media (max-width: 1080px) { .layout.folded { grid-template-columns: 1fr; } }
        .fold-btn {
            margin-left: auto; border: 1px solid var(--line-2); background: #f7fafe;
            color: var(--ink-2); border-radius: 9px; padding: 2px 9px; cursor: pointer;
            font: inherit; font-size: .76rem;
        }
        .fold-btn:hover { border-color: #9dbbdf; color: var(--brand); background: #eef5ff; }
        aside.list.rail { padding: 10px 0; align-items: center; }
        .rail-btn {
            border: 1px solid var(--line-2); background: #f7fafe; color: var(--ink-2);
            border-radius: 10px; padding: 12px 4px; cursor: pointer; font: inherit;
            font-size: .78rem; writing-mode: vertical-rl; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px;
        }
        .rail-btn:hover { border-color: #9dbbdf; color: var(--brand); background: #eef5ff; }

        main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

        /* ── 产品记录 Tab（多产品）+ 徽章 ─────────────────────── */
        /* ★ 2026-10-29 多产品：产物是数组 → 任务详情按「产品记录」分 Tab 切换 */
        .tabs {
            display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch;
            padding: 10px 14px; border-bottom: 1px solid var(--line-2); background: #f7f9fc;
        }
        .tabs .tab {
            display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
            padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px;
            background: var(--card); cursor: pointer; font: inherit; text-align: left;
            max-width: 340px;
        }
        .tabs .tab:hover { border-color: #9dbbdf; background: #f3f8ff; }
        .tabs .tab.active { border-color: var(--brand); background: #eaf1fb;
                            box-shadow: 0 0 0 2px rgba(26,58,111,.10); }
        .tabs .tab .t1 { display: flex; align-items: center; gap: 6px; font-size: .8rem;
                         font-weight: 620; color: var(--ink); }
        .tabs .tab .t2 { font-size: .75rem; color: var(--ink-3); max-width: 320px;
                         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tabs .tab .idx { font-family: var(--mono); font-size: .72rem; color: #fff;
                          background: var(--brand); border-radius: 6px; padding: 0 6px; }
        .tabs .tab.warn .idx { background: var(--warn); }
        .tabs .tab.bad  .idx { background: var(--bad); }
        .tabs .tab.ok   .idx { background: var(--ok); }
        /* 任务列表里的「这条询价有哪几个产品」 */
        .prod-line { display: flex; gap: 6px; font-size: .77rem; color: var(--ink-2);
                     margin-top: 3px; line-height: 1.35; }
        .prod-line .idx2 { font-family: var(--mono); font-size: .7rem; color: var(--ink-3);
                           min-width: 1.1em; }
        .prod-line .cplb { color: var(--ink-3); }
        .badge {
            font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 20px;
            border: 1px solid; white-space: nowrap; display: inline-block;
        }
        .badge.v2    { color: #fff; background: var(--brand); border-color: var(--brand); }
        .badge.ver0  { color: var(--ink-3); background: #eef1f6; border-color: var(--line); }
        .badge.ok    { color: var(--ok); background: var(--ok-bg); border-color: #b9e2d1; }
        .badge.warn  { color: var(--warn); background: var(--warn-bg); border-color: #f0d09a; }
        .badge.bad   { color: var(--bad); background: var(--bad-bg); border-color: #f0b9bc; }
        .badge.old   { color: var(--ink-3); background: #f2f4f8; border-color: var(--line); }
        .badge.int   { color: var(--internal); background: var(--internal-bg); border-color: #d6c9f5; }
        .badge.plain { color: var(--ink-3); background: #f6f8fb; border-color: var(--line-2); }

        /* ── 摘要 ───────────────────────────────────────────── */
        .summary { padding: 14px 16px; }
        .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 18px; }
        .kv { display: flex; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line-2); padding-bottom: 6px; }
        .kv .k { color: var(--ink-3); font-size: .78rem; white-space: nowrap; min-width: 78px; }
        .kv .v { font-family: var(--mono); font-size: .82rem; color: var(--ink); word-break: break-all; }
        .kv .v.plain { font-family: inherit; }

        /* ── 字段组 ─────────────────────────────────────────── */
        .group { border-top: 1px solid var(--line-2); }
        .group:first-of-type { border-top: none; }
        .group-head {
            padding: 11px 16px; background: #f8fafd; display: flex;
            align-items: center; gap: 9px; flex-wrap: wrap;
            border-bottom: 1px solid var(--line-2);
        }
        .group-head h3 { font-size: .9rem; font-weight: 640; }
        .group-head .hint { font-size: .78rem; color: var(--ink-3); }
        .group.internal .group-head { background: #f7f4fe; }

        /* ── 字段：紧凑网格（1.0.27 排版重做）─────────────────────
           以前一个字段独占一行（左 190px 标签 + 右侧值），63 个字段要滚 ~2800px，
           而 TZS=1、CPSX=三岁以上 这类短值把大半行宽白扔了。
           现在同组内按宽度自动分列（窗口越宽列越多），**只有长文本跨整行**。 */
        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        }
        .field {
            display: flex; flex-direction: column; gap: 3px;
            padding: 8px 16px; min-width: 0;
            border-right: 1px dashed var(--line-2);
            border-bottom: 1px dashed var(--line-2);
        }
        .field:hover { background: #fafcff; }
        .field.missing { background: #fdfdfd; }
        .field.wide { grid-column: 1 / -1; border-right: none; }
        .field-label { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
        .field-label .zh { font-size: .82rem; font-weight: 560; color: var(--ink-2); }
        .field-label .code { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
        .field-value { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .field-value .line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .val { font-family: var(--mono); font-size: .84rem; color: var(--ink); word-break: break-word; }
        .val.plain { font-family: inherit; }
        .val.empty { color: var(--ink-3); font-style: italic; }
        .val.illegal { color: var(--bad); font-weight: 600; }

        pre.long {
            font-family: var(--mono); font-size: .79rem; line-height: 1.55;
            background: #f8fafd; border: 1px solid var(--line-2); border-radius: 9px;
            padding: 9px 11px; white-space: pre-wrap; word-break: break-word;
            max-height: 190px; overflow: auto; color: var(--ink-2);
        }
        pre.long.open { max-height: none; }

        details.legal { font-size: .78rem; }
        details.legal summary {
            cursor: pointer; color: var(--brand-2); width: fit-content;
            list-style: none; user-select: none;
        }
        details.legal summary::-webkit-details-marker { display: none; }
        details.legal summary::before { content: '▸ '; }
        details.legal[open] summary::before { content: '▾ '; }
        .legal-list {
            margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;
            max-height: 230px; overflow: auto; padding: 7px;
            background: #f8fafd; border: 1px solid var(--line-2); border-radius: 9px;
        }
        .legal-item {
            font-family: var(--mono); font-size: .74rem; padding: 1px 7px;
            border-radius: 20px; background: #fff; border: 1px solid var(--line);
            color: var(--ink-2);
        }
        .legal-item.cur { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }

        .chk { font-size: .84rem; display: inline-flex; align-items: center; gap: 6px; }
        .chk .box { font-size: 1rem; }

        .empty-state { padding: 40px 24px; text-align: center; color: var(--ink-3); }
        .empty-state h3 { font-size: 1rem; color: var(--ink-2); margin-bottom: 8px; }
        .empty-state ol { text-align: left; max-width: 520px; margin: 12px auto 0; padding-left: 22px; }
        .empty-state li { margin: 5px 0; font-size: .85rem; }
        .empty-state code { font-family: var(--mono); background: #f1f4f9; padding: 1px 6px; border-radius: 5px; }

        pre.raw {
            font-family: var(--mono); font-size: .78rem; line-height: 1.5;
            background: #0f1b2d; color: #d6e2f2; padding: 14px 16px;
            border-radius: 0 0 16px 16px; overflow: auto; max-height: 620px;
            white-space: pre; tab-size: 2;
        }
        .hidden { display: none !important; }
        .foot { padding: 10px 14px; font-size: .74rem; color: var(--ink-3);
                border-top: 1px solid var(--line-2); font-family: var(--mono); word-break: break-all; }

        /* ── 打印 / 导出 PDF（1.0.27）─────────────────────────────
           零依赖做法：按钮调 `window.print()`，浏览器「另存为 PDF」即得文件。
           刻意不引 jsPDF / html2canvas 之类的库：
             * 这页面**必须离线可用**（内网/断网），引 CDN 会白屏；
             * 引库还得再抄一份排版，跟屏幕上的必然漂。
           所以要打印的东西就一套 DOM + 下面这些覆盖规则。 */
        @media print {
            @page { size: A4; margin: 12mm; }
            body { background: #fff; padding: 0; font-size: 11px; }
            header.top {
                box-shadow: none; border: none; border-radius: 0;
                padding: 0 0 8px; margin: 0 0 10px;
                border-bottom: 2px solid var(--ink);
            }
            .layout { display: block; max-width: none; }
            /* 侧栏 / 工具栏 / 上传区 / 排队条 / 原始 JSON / 合法取值清单 —— 都是「操作/查询用」的，不进 PDF */
            aside.list, .toolbar, .upload, .pending-strip, .no-print, pre.raw, details.legal { display: none !important; }
            button { display: none !important; }        /* 展开/收起这类控件也别进 PDF */
            main { gap: 8px; }
            .panel { box-shadow: none; border-radius: 0; }
            .group-head { background: #f1f5fa !important; break-after: avoid; page-break-after: avoid; }
            .field-grid { grid-template-columns: repeat(3, 1fr); }   /* A4 竖版固定 3 列 */
            .field { break-inside: avoid; page-break-inside: avoid; }
            .banner { break-inside: avoid; }
            pre.long { max-height: none; overflow: visible; background: #fff; }  /* 长文本全量打印 */
            .qa-actions { display: none !important; }   /* 打印时只要答案文本，不要按钮 */
            .qa-input { border: 0 !important; padding: 0 !important; resize: none; }
        }

        /* ── 内部确认清单的答案编辑区（2026-10-30 起页面能写答案）────────── */
        .qa-edit { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
        .qa-input {
            width: 100%; box-sizing: border-box; padding: 6px 8px;
            font: inherit; font-size: .86rem; line-height: 1.45;
            color: var(--ink); background: #fff;
            border: 1px solid var(--line); border-radius: 6px; resize: vertical;
        }
        .qa-input:focus { outline: 2px solid #9cc4ff; outline-offset: -1px; border-color: #9cc4ff; }
        .qa-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .qa-actions button {
            font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 6px;
            border: 1px solid var(--line); background: #f7f9fc; color: var(--ink); cursor: pointer;
        }
        .qa-actions button:hover { background: #eef3fa; }
        .qa-actions button:disabled { opacity: .55; cursor: default; }
        .qa-save { background: var(--ok-bg) !important; border-color: #b6e0cd !important; color: var(--ok) !important; }
        .qa-waive { color: var(--muted-ink, #5b6675); }
        .qa-msg { font-size: .78rem; }
        .qa-msg.ok { color: var(--ok); }
        .qa-msg.bad { color: var(--bad); }
        .qa-hint { font-size: .76rem; color: var(--muted-ink, #7a8494); }

        /* 清单可折叠：标题行整行可点（默认折叠，2026-10-30 业务要求） */
        .qa-head { cursor: pointer; user-select: none; }
        .qa-head:hover { background: #f2f6fc; }
        .qa-head:focus-visible { outline: 2px solid #9cc4ff; outline-offset: -2px; }
        .qa-caret { width: .9em; text-align: center; font-size: .8rem; color: var(--muted-ink, #7a8494); }
        .qa-peek { max-width: 52ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div id="page"></div>
<input type="file" id="fileInput" accept=".json,application/json">
<input type="file" id="uploadInput" multiple
       accept=".xlsx,.xls,.csv,.pdf,.docx,.txt,.zip,.eml">
<input type="file" id="dirInput" webkitdirectory multiple>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   状态
   ═══════════════════════════════════════════════════════════════════════ */
const state = {
    schema: null,          // /api/schema 的回应
    exports: [],           // /api/exports 的 exports
    scanRoot: "",
    scanOk: false,         // 服务端可达 → 能自动扫描
    scanError: "",
    current: null,         // 当前选中的产物（原始对象）
    currentMeta: null,     // 列表项（含 relpath / mtime / superseded）
    validation: null,      // 权威取值校验结果（服务端给 /api/export 带回来的）
    incomplete: null,      // 交付闸门：CPMS 未写 / 中文品名占位符（服务端算，页面只显示）
    filter: "",
    showRaw: false,
    openPre: {},           // 长文本展开状态 { key: bool }

    // 1.0.43：上传 + 排队 + 自动刷新
    pending: [],           // /api/pending 的 items（还在等抽取的）
    pendingRoot: "",
    upload: { group: "one", busy: false, msg: "", ok: null },
    fresh: new Set(),      // 本轮刷新里「新出现」的产物 relpath（列表打「新」）
    lastScanAt: "",        // 上次自动刷新的时刻
    listFolded: false,     // 产物列表是否收起（浏览器记住选择）

    // ★ 2026-10-29 产物是数组：列表按**任务**聚合，详情按**产品记录**分 Tab
    tasks: [],             // 任务列表（一个任务 = 一次报价，可含多条产品记录）
    records: [],           // 当前任务的 N 条产品记录（/api/export 的 records）
    activeRecord: 0,       // 正在看第几条（0-based）
    validationByRecord: [],
    incompleteByRecord: [],

    // ★ 2026-10-30 起页面能**写答案**（question_answers）：草稿 / 保存中 / 结果提示
    //   草稿按「产物#第几条#项 id」存 —— 10 秒自动刷新重建 DOM 时不能把正在打的字冲掉
    drafts: {},            // { key: "还没保存的答案" }
    answering: {},         // { key: true }  正在保存
    answerMsg: {},         // { key: {ok, text} }  上一次保存的结果

    // ★ 内部确认清单**默认折叠**（业务 2026-10-30：「内部确认清单 默认是折叠状态」）。
    //   按「产物#第几条」记展开状态：undefined = 折叠（默认），true = 已展开。
    //   存在 state 里而不是 DOM 上 —— 10 秒自动刷新重建 DOM 时不会自己合上，
    //   也不会因为切 Tab 再切回来就丢掉。
    qaOpen: {},            // { key: true }
};

const BASE_TITLE = "ERP · 报价需求单导出查看器";

/* ── 简单的浏览器偏好读写（file:// 下 localStorage 可能不可用）────── */
const PREF_PREFIX = "cqr.";
function readPref(key) {
    try { return localStorage.getItem(PREF_PREFIX + key); } catch (_) { return null; }
}
function writePref(key, value) {
    try { localStorage.setItem(PREF_PREFIX + key, value); } catch (_) { /* 忽略 */ }
}
state.listFolded = readPref("listFolded") === "1";

/* ═══════════════════════════════════════════════════════════════════════
   小工具
   ═══════════════════════════════════════════════════════════════════════ */
function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = String(v);
        else if (k === "html") node.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") {
            node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) node.setAttribute(k, "");
        else node.setAttribute(k, String(v));
    }
    for (const c of children.flat(Infinity)) {
        if (c === null || c === undefined || c === false) continue;
        node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
}

const isEmptyValue = (v) => v === null || v === undefined || v === "";

/** 「有没有真值」：null / undefined / 空字符串都不算 —— 统计和徽章用它，别看「键在不在」
 *  （业务 2026-10-30 踩过：`question_answers` 时代之前的老产物 `version` 是 **null**，
 *   页面只判了 undefined，拼出来就是徽章「vnull」；同理「N / M 有值」拿 `k in cur`
 *   统计，null 也算有值 → 显示 11/11 有值但每个值都是 null，自相矛盾） */
const hasValue = (v) => v !== null && v !== undefined && v !== "";

/** 值的展示文本（null / 空 都变成可读文案，不显示 "null" 这种裸值） */
function describeValue(v) {
    if (v === null) return { text: "null（空值）", cls: "empty" };
    if (v === undefined) return { text: "本产物缺失该键", cls: "empty" };
    if (v === "") return { text: "（空字符串）", cls: "empty" };
    if (typeof v === "boolean") return { text: v ? "true（勾选）" : "false（未勾选）", cls: "plain" };
    if (typeof v === "number") return { text: String(v), cls: "" };
    return { text: String(v), cls: "plain" };
}

/** 是否属于「长文本」字段（用 <pre> 渲染 + 展开按钮） */
function isLongText(key, value) {
    if (typeof value !== "string") return false;
    if (value.includes("\n")) return true;
    if (/^(CPMS|BGMS|Remark|CPMX|Remark1|Remark3|Remark4)$/.test(key)) return value.length > 60;
    return value.length > 160;
}

/** 这个字段在网格里要不要跨整行 —— 长值 / 长文本 / 带校验原因的都要，短值挤成多列 */
function fieldIsWide(key, value) {
    if (isLongText(key, value)) return true;
    if (typeof value === "string" && value.length > 40) return true;
    const issue = issueMap()[key];
    return !!(issue && issue.message);
}

function fmtNum(n) {
    if (typeof n !== "number" || !Number.isFinite(n)) return String(n);
    return n.toLocaleString("en-US");
}

/* ═══════════════════════════════════════════════════════════════════════
   数据加载
   ═══════════════════════════════════════════════════════════════════════ */
async function fetchAll() {
    /* 一次拿「产物 + 排队」两份清单。pending 拿不到不算致命（老服务端没有这个接口）。 */
    const [listRes, pendRes] = await Promise.all([
        fetch("api/exports", { cache: "no-store" }),
        fetch("api/pending", { cache: "no-store" }),
    ]);
    if (!listRes.ok) throw new Error("exports HTTP " + listRes.status);
    const list = await listRes.json();
    let pend = { root: "", items: [] };
    if (pendRes.ok) pend = await pendRes.json();
    return { list, pend };
}

function applyList(list, pend) {
    state.exports = list.exports || [];
    // 服务端按任务目录聚合好的「任务列表」；老服务端没有 → 前端自己按目录兜一层
    state.tasks = Array.isArray(list.tasks) ? list.tasks : tasksFromExports(state.exports);
    state.scanRoot = list.root || "";
    state.pending = pend.items || [];
    state.pendingRoot = pend.root || "";
    state.scanOk = true;
    state.scanError = "";
    state.lastScanAt = new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

/** 老服务端（没有 /api/exports 的 tasks 字段）时的兜底：按任务目录把文件聚成任务 */
function tasksFromExports(items) {
    const map = new Map();
    for (const it of items || []) {
        const key = it.dir || it.task_id || it.relpath;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(it);
    }
    return [...map.entries()].map(([key, group]) => {
        const p = group[0];                      // items 已按 mtime 倒序
        return Object.assign({}, p, {
            task_key: key,
            record_count: p.record_count || (p.products || []).length,
            products: p.products || [],
            extra_exports: group.slice(1).map((x) => x.relpath),
        });
    }).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
}

async function loadFromServer() {
    try {
        const { list, pend } = await fetchAll();
        const [schemaRes] = await Promise.all([fetch("api/schema", { cache: "no-store" })]);
        if (!schemaRes.ok) throw new Error("schema HTTP " + schemaRes.status);
        state.schema = await schemaRes.json();
        applyList(list, pend);

        // 支持 ?path=…&r=… 深链接；否则自动选最新的一个任务
        const params = new URLSearchParams(location.search);
        const want = params.get("path");
        const target = (want && state.tasks.find((t) => t.relpath === want))
            || state.tasks.find((t) => !t.superseded)
            || state.tasks[0]
            || null;
        if (target) await selectExport(target, Number(params.get("r") || 1) - 1);
        render();
    } catch (err) {
        state.scanOk = false;
        state.scanError = (err && err.message) || String(err);
        state.exports = [];
        state.tasks = [];
        state.pending = [];
        render();
    }
}

/**
 * 10 秒一次的静默刷新（业务 2026-10-20：「设置 10s 异步更新一次数据」）。
 *
 * 规矩：
 *   · 出现**新产物** → 直接切过去（这就是「上传 → 抽取 → 立刻看产物」的那一步）
 *   · 其它情况**不动当前选中**，避免正在看的东西被刷新冲掉
 *   · 列表与排队都没变 → 连 DOM 都不重建（不打断搜索框、不闪）
 *   · 刷新失败保持旧画面（局域网抖一下不该白屏）
 */
async function refreshQuietly() {
    if (state.upload.busy) return;
    try {
        const { list, pend } = await fetchAll();
        const known = new Set(state.tasks.map((e) => e.relpath));
        const pendingBefore = state.pending.length;
        const sigBefore = state.tasks.map((e) => e.relpath + "|" + e.mtime).join(",");

        applyList(list, pend);

        const fresh = state.tasks.filter((e) => !known.has(e.relpath) && !e.superseded);
        for (const e of fresh) state.fresh.add(e.relpath);

        if (fresh.length) {
            await selectExport(fresh[0]);      // 新任务 → 直接看它
            return;
        }
        // 正在看的那个任务被挪走/删了 → 退到最新一个
        const cur = state.currentMeta;
        if (cur && !cur.manual && !state.tasks.some((e) => e.relpath === cur.relpath)) {
            const fallback = state.tasks.find((e) => !e.superseded) || state.tasks[0] || null;
            if (fallback) { await selectExport(fallback); return; }
        }
        const sigAfter = state.tasks.map((e) => e.relpath + "|" + e.mtime).join(",");
        if (sigAfter === sigBefore && state.pending.length === pendingBefore) return;
        render();
    } catch (_) {
        /* 轮询失败不打扰：下一次 10 秒再来 */
    }
}

/**
 * 选中一个**任务**（= 一个 processed/<task_id>/ 目录），并载入它的 N 条产品记录。
 * `wantRecord` 从 0 起；越界自动夹到范围内（深链接写错不会白屏）。
 */
async function selectExport(meta, wantRecord) {
    try {
        const res = await fetch("api/export?path=" + encodeURIComponent(meta.relpath), { cache: "no-store" });
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || ("HTTP " + res.status));
        }
        const payload = await res.json();
        const records = (payload.records && payload.records.length)
            ? payload.records : [payload.data || {}];
        state.records = records;
        state.validationByRecord = payload.validation_by_record || [];
        state.incompleteByRecord = payload.incomplete_by_record || [];
        state.activeRecord = clampIndex(wantRecord, records.length);
        state.currentMeta = meta;
        state.showRaw = false;
        state.openPre = {};
        applyActiveRecord();
        syncUrl(meta, state.activeRecord);
    } catch (err) {
        state.records = [];
        state.current = {};
        state.validation = null;
        state.incomplete = null;   // 取不到产物 → 交付状态未知，不瞎标
        state.currentMeta = meta;
        state.currentMeta.loadError = (err && err.message) || String(err);
    }
    render();
}

function clampIndex(i, total) {
    const n = Math.max(1, Number(total) || 1);
    if (!Number.isFinite(Number(i))) return 0;
    return Math.min(Math.max(0, Math.trunc(Number(i))), n - 1);
}

/** 把「当前选中的那条记录」的三份数据摆到 state 上（渲染函数只认 state.current）。 */
function applyActiveRecord() {
    const rec = state.records[state.activeRecord] || {};
    state.current = rec;
    const byRecord = state.validationByRecord;
    state.validation = byRecord.length ? byRecord[state.activeRecord] : null;
    const gates = state.incompleteByRecord;
    state.incomplete = gates.length ? (gates[state.activeRecord] || []) : null;
}

function setActiveRecord(index) {
    state.activeRecord = clampIndex(index, state.records.length);
    state.openPre = {};                 // 换一条记录就不保留上一条的展开状态
    applyActiveRecord();
    if (state.currentMeta) syncUrl(state.currentMeta, state.activeRecord);
    render();
}

function syncUrl(meta, index) {
    try {
        const q = new URLSearchParams();
        q.set("path", meta.relpath);
        if (state.records.length > 1) q.set("r", String(index + 1));
        history.replaceState(null, "", "?" + q.toString());
    } catch (_) { /* file:// 下可能不允许，忽略 */ }
}

/** 手动导入（没有服务端时唯一的路）。数组 = 一个任务里的多个产品 → 一样出 Tab。 */
function importFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            const records = Array.isArray(data) ? data
                : (data && Array.isArray(data.records) ? data.records : [data]);
            state.records = records.filter((r) => r && typeof r === "object");
            state.activeRecord = 0;
            state.validationByRecord = [];      // 手动导入没有权威校验结果（页面会说明）
            state.incompleteByRecord = [];      // 交付闸门也只在服务端算 → 判不了
            state.currentMeta = {
                relpath: file.name, filename: file.name,
                task_id: "(手动导入)", mtime_iso: new Date(file.lastModified).toLocaleString("sv-SE"),
                size: file.size, superseded: false,
                key_count: Object.keys(state.records[0] || {}).length,
                record_count: state.records.length,
                manual: true,
            };
            applyActiveRecord();
            state.validation = null;
            state.incomplete = null;
            state.showRaw = false;
            state.openPre = {};
            render();
        } catch (err) {
            alert("JSON 解析失败：" + err.message);
        }
    };
    reader.readAsText(file, "utf-8");
}

/* ═══════════════════════════════════════════════════════════════════════
   派生：结构对照（这份产物 vs 当前 59 键结构）
   ═══════════════════════════════════════════════════════════════════════ */
function structuralDiff() {
    const cur = state.current || {};
    const schema = state.schema || {};
    const erpKeys = (schema.erp_fields || []).map((f) => f.key);
    const internalKeys = (schema.internal_fields || []).map((f) => f.key);
    const actual = Object.keys(cur);
    return {
        erpKeys,
        internalKeys,
        missing: erpKeys.filter((k) => !(k in cur)),
        extra: actual.filter((k) => !erpKeys.includes(k) && !internalKeys.includes(k)),
        missingInternal: internalKeys.filter((k) => !(k in cur)),
        actualCount: actual.length,
    };
}

function specOf(key) {
    const list = (state.schema && state.schema.erp_fields) || [];
    return list.find((f) => f.key === key) || null;
}

function internalSpecOf(key) {
    const list = (state.schema && state.schema.internal_fields) || [];
    return list.find((f) => f.key === key) || null;
}

/** 枚举字段该显示哪些合法取值。
 *
 *  普通下拉 → 字典全集。联动下拉（`SHDQ` 送货地区 ← `YSLX` 运输类型）在字典里写成
 *  `linked_to` + `legal_groups`：父字段有值 → **只列该组的候选值**；父字段空着 →
 *  列全集并注明「随 X 变化」（父值未知，不知道属于哪组）。
 *
 *  ⚠️ 这里只决定「给业务看哪些候选值」，**不判定**值合不合法 ——
 *  合法性一律用服务端 `erp_schema.validate_result` 的结论
 *  （前端比字符串会把 CPLB 的「编号;名称」全误判，2026-09-24 踩过）。
 */
function legalForField(spec) {
    const all = (spec && spec.legal) || [];
    const parentKey = spec && spec.linked_to;
    const groups = (spec && spec.legal_groups) || [];
    if (!parentKey || !groups.length) {
        return { values: all, title: "字典合法取值" };
    }
    const parent = state.current ? state.current[parentKey] : null;
    const key = parent == null ? "" : String(parent).trim().toLowerCase();
    const hit = key
        ? groups.find((g) => (g.when || [])
            .some((w) => String(w).trim().toLowerCase() === key))
        : null;
    const parentSpec = specOf(parentKey);
    const parentZh = (parentSpec && parentSpec.label) || parentKey;
    if (hit) {
        return { values: hit.options || [],
                 title: "该「" + parentZh + "」下的合法取值" };
    }
    return { values: all,
             title: "字典合法取值（随「" + parentZh + "」变化）" };
}

/** {字段: {level, message}} —— 来自服务端的**权威**校验结果（erp_schema.validate_result
 *  原样带过来的当次运行报告）。页面**不自己比枚举**：
 *  `CPLB` 我们的口径是「编号;名称」，而字典的 legal 列表是 88 个裸名称 ——
 *  前端拿字符串直接比会把每一份产物的 CPLB 都误标成非法（真踩过，2026-09-24）。 */
function issueMap() {
    const map = {};
    const v = state.validation;
    if (!v) return map;
    for (const issue of [...(v.errors || []), ...(v.warnings || [])]) {
        const f = issue && issue.field;
        if (!f) continue;
        const level = issue.level === "error" ? "error" : "warn";
        // 同一字段多条：error 优先
        if (!map[f] || (map[f].level === "warn" && level === "error")) {
            map[f] = { level, message: issue.message || "" };
        }
    }
    return map;
}

/* ═══════════════════════════════════════════════════════════════════════
   上传 + 排队（1.0.43）
   ═══════════════════════════════════════════════════════════════════════ */
/**
 * 上传一个或多个客户文件。
 *
 * `group` 的两种口径（跟 `main.py` 的输入单元语义一一对应，别自己造规则）：
 *   one  → 这几个文件是**同一份报价**的参考文件（落 pending/<批次>/ 一个目录）
 *   each → 每个文件**各算一份报价**（平铺在 pending/ 根下）
 */
async function doUpload(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    state.upload.busy = true;
    state.upload.ok = null;
    state.upload.msg = "上传中… " + files.length + " 个文件";
    render();

    const fd = new FormData();
    for (const f of files) fd.append("files", f, f.name);
    fd.append("group", state.upload.group);

    try {
        const res = await fetch("api/uploads", { method: "POST", body: fd });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));

        const saved = body.saved || [];
        const rejected = body.rejected || [];
        let msg = "已上传 " + saved.length + " 个文件";
        msg += body.batch ? "（同一份报价 → 批次 " + body.batch + "/）" : "（各算一份 → pending/）";
        if (rejected.length) {
            msg += "；被拒 " + rejected.length + " 个：" +
                rejected.map((r) => r.name + "（" + r.reason + "）").join("；");
        }
        msg += "。定时任务每 5 分钟扫一次，抽出后这里会自动出现（页面每 10 秒刷新）。";
        state.upload.ok = !rejected.length || saved.length > 0;
        state.upload.msg = msg;
    } catch (err) {
        state.upload.ok = false;
        state.upload.msg = "上传失败：" + ((err && err.message) || err);
    } finally {
        state.upload.busy = false;
        try {
            const p = await (await fetch("api/pending", { cache: "no-store" })).json();
            state.pending = p.items || [];
            state.pendingRoot = p.root || "";
        } catch (_) { /* 排队条刷不到不影响上传结果 */ }
        render();
    }
}

function renderUpload() {
    const up = state.upload;

    /* ⚠️ 拖拽高亮用 classList 直接改，**不**走 render()：
       重建被拖拽的那个节点会让 dragleave/drop 丢事件（试过，会闪）。 */
    const zone = el("div", {
        class: "dropzone",
        title: "也可以直接把文件拖进来；文件夹请用右侧「选择文件夹」",
        onclick: () => document.getElementById("uploadInput").click(),
        ondragover: (e) => { e.preventDefault(); zone.classList.add("hot"); },
        ondragleave: () => zone.classList.remove("hot"),
        ondrop: (e) => {
            e.preventDefault();
            zone.classList.remove("hot");
            doUpload(e.dataTransfer.files);
        },
    },
        el("div", { class: "d1", text: "⬆️ 拖客户报价文件到这里，或点击选择" }),
        el("div", { class: "d2", text: "xlsx / xls / csv / pdf / docx / txt / zip / eml · 单次 ≤ 64 MB（邮件 .eml 请单独传）" }),
    );

    const radio = (value, label, hint) => el("label", { title: hint },
        el("input", {
            type: "radio", name: "upload-group", value: value,
            checked: up.group === value,
            onchange: () => { up.group = value; render(); },
        }),
        label);

    const side = el("div", { class: "upload-side" },
        el("div", { class: "upload-opts" },
            radio("one", "这几份是同一份报价",
                  "多个文件（Excel + PDF + 图片说明…）合成一份 ERP JSON"),
            radio("each", "每份各算一份报价",
                  "文件夹里躺着两个独立单时选这个：每个文件各出一份 ERP JSON"),
        ),
        el("div", { class: "upload-opts" },
            el("button", {
                type: "button",
                disabled: up.busy,
                onclick: () => document.getElementById("dirInput").click(),
                title: "选一个文件夹上传：里面的文件会被当成同一份报价的参考文件",
            }, "📁 选择文件夹"),
            el("span", { class: "status", text: "抽取由定时任务执行（每 5 分钟）" }),
        ),
    );

    const card = el("div", { class: "upload" },
        el("div", { class: "upload-row" }, zone, side));

    if (up.msg) {
        const cls = up.busy ? "busy" : (up.ok ? "ok" : "err");
        card.append(el("div", { class: "upload-msg " + cls, text: up.msg }));
    }
    return card;
}

/** 排队条：pending 里还有东西在等抽取时出现（省得用户以为上传没生效） */
function renderPendingStrip() {
    const items = state.pending || [];
    if (!items.length) return null;

    const oldest = items.reduce((a, b) => (a.age_seconds > b.age_seconds ? a : b));
    const mins = Math.floor(oldest.age_seconds / 60);
    const age = mins >= 1 ? (mins + " 分钟") : (oldest.age_seconds + " 秒");
    const names = items.slice(0, 4).map((it) => it.name).join("、");

    return el("div", { class: "pending-strip" },
        el("b", { text: "⏳ 等待抽取 " + items.length + " 项" }),
        el("span", { text: "最久等了 " + age + "（定时任务每 5 分钟扫一次）" }),
        el("div", { class: "spacer" }),
        el("span", { class: "pname", text: names + (items.length > 4 ? " …" : ""),
                     title: items.map((it) => it.name).join("\n") }),
    );
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：头部
   ═══════════════════════════════════════════════════════════════════════ */
function renderHeader() {
    const cfgVer = state.schema ? state.schema.config_version : null;
    const cur = state.current || {};
    const curVer = cur.version;

    let verBadge;
    if (curVer === undefined) {
        verBadge = el("span", { class: "badge old", text: "产物无 version（第 1 代口径）" });
    } else if (cfgVer !== null && curVer === cfgVer) {
        verBadge = el("span", { class: "badge v2", text: "version " + curVer + "（= 当前配置）" });
    } else {
        verBadge = el("span", { class: "badge warn", text: "version " + curVer + "（当前配置 " + cfgVer + "）" });
    }

    const status = el("span", { class: "status" + (state.scanOk ? "" : " err") });
    if (state.scanOk) {
        const prodTotal = state.tasks.reduce((n, t) => n + (t.record_count || 0), 0);
        status.textContent = "已扫描 " + state.tasks.length + " 个任务（"
            + prodTotal + " 条产品记录）"
            + (state.lastScanAt ? " · 上次刷新 " + state.lastScanAt + "（每 10 秒自动）" : "");
    } else {
        status.textContent = "未连上服务端（" + state.scanError + "）";
    }

    const toolbar = el("div", { class: "toolbar" },
        status,
        el("button", {
            onclick: () => loadFromServer(),
            title: "重新扫描 customer-files/processed",
        }, "🔄 刷新"),
        el("button", {
            onclick: () => document.getElementById("fileInput").click(),
        }, "⬆️ 导入 JSON"),
        el("button", {
            class: "no-print",
            disabled: !state.currentMeta,
            onclick: () => window.print(),
            title: "打开浏览器打印对话框 → 目标选「另存为 PDF」。"
                 + "PDF 由浏览器生成（零依赖、离线可用），排版跟屏幕一致；"
                 + "侧栏、工具栏、原始 JSON、字典取值清单都不会进 PDF。",
        }, "🖨 导出 PDF"),
        el("button", {
            class: state.showRaw ? "primary" : "",
            disabled: !state.currentMeta,
            onclick: () => { state.showRaw = !state.showRaw; render(); },
        }, "{ } 原始 JSON"),
        state.current ? verBadge : null,
    );

    const head = el("header", { class: "top" },
        el("div", { class: "title-row" },
            el("h1", {}, "📘 ERP · 报价需求单导出",
                el("span", { class: "sub", text: "配置版本 " + (cfgVer === null ? "?" : cfgVer) + " · 59 个 ERP 字段 + 内部字段" })),
            el("div", { class: "spacer" }),
            toolbar,
        ),
    );

    // 上传 + 排队（服务端可达时才给上传入口：连不上就别假装能传）
    if (state.scanOk) {
        head.append(renderUpload());
        const strip = renderPendingStrip();
        if (strip) head.append(strip);
    }

    if (!state.scanOk) {
        head.append(el("div", { class: "banner warn" },
            el("span", {},
                "浏览器不允许 ", el("code", { text: "file://" }), " 页面列出本地目录，所以「自动扫描」需要一个小服务端。",
                el("br"),
                "在仓库根目录跑：", el("code", { text: "uv run python -m CQR_Web" }),
                " 然后打开它给出的地址（会自动开浏览器）。现在也可以点「导入 JSON」手动看单份文件。"),
        ));
    }

    // ★ 未完成 · 不得交付 —— 比下面的「提醒」更严重，放上头
    //   （CPMS / 中文品名这两处脚本刻意不写，管道刚跑完的产物天然是这个状态）
    //   多产品时这是**当前这条记录**的闸门（按 Tab 切换各看各的）。
    if (Array.isArray(state.incomplete) && state.incomplete.length) {
        const total = state.records.length;
        const which = total > 1 ? ("（第 " + (state.activeRecord + 1) + " / " + total
                                   + " 条产品记录）") : "";
        const gate = el("div", { class: "banner bad" },
            el("div", {},
                el("b", { text: "❗ 未完成 · 不得交付" }),
                el("span", { text: which + " —— 这条记录里还有必须由 agent 亲自补的地方：" })));
        for (const why of state.incomplete) {
            gate.append(el("div", { class: "gate", text: "· " + why }));
        }
        head.append(gate);
    }

    const reminder = cur.Reminder;
    if (typeof reminder === "string" && reminder.trim() !== "") {
        head.append(el("div", { class: "banner bad" },
            el("span", { text: "⚠️ " + reminder })));
    }
    if (state.currentMeta && state.currentMeta.loadError) {
        head.append(el("div", { class: "banner bad", text: "读取失败：" + state.currentMeta.loadError }));
    }
    return head;
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：左侧产物列表
   ═══════════════════════════════════════════════════════════════════════ */

/** 收起状态下的窄条（点一下展开，选择记在浏览器里） */
function renderListRail() {
    return el("aside", { class: "panel list rail", id: "listPanel" },
        el("button", {
            class: "rail-btn", type: "button", title: "展开任务列表",
            onclick: () => setListFolded(false),
        },
            el("span", { text: "▸" }),
            el("span", { text: "任务列表 " + state.tasks.length }),
        ));
}

function setListFolded(folded) {
    state.listFolded = !!folded;
    writePref("listFolded", state.listFolded ? "1" : "0");
    render();                  // 整页重画：列宽 + 列表要一起变
}

/** 一条产品记录的摘要行（任务列表里一眼看出这条询价有哪些产品） */
function productLine(p) {
    const name = String(p.CPMC_ZH || p.CPMC || "（无产品名称）").trim();
    const dims = [];
    if (p.CPLB) dims.push(String(p.CPLB));
    if (p.TZS !== undefined && p.TZS !== null) dims.push("TZS " + p.TZS);
    if (p.CPSL1) dims.push(fmtNum(Number(p.CPSL1)) + " cps");
    return el("div", { class: "prod-line" },
        el("span", { class: "idx2", text: p.index + "." }),
        el("span", { text: name, title: name }),
        dims.length ? el("span", { class: "cplb", text: "· " + dims.join(" · ") }) : null,
        (p.incomplete && p.incomplete.length)
            ? el("span", { class: "badge bad", text: "未写完", title: p.incomplete.join("；") })
            : null,
        // v3：这条产品记录还有几项没确认（blocking 的用红色）
        (p.questions && p.questions.open)
            ? el("span", {
                class: "badge " + (p.questions.open_blocking ? "bad" : "warn"),
                text: p.questions.open + " 项待确认",
                title: "内部确认清单：未确认 " + p.questions.open
                    + " 项" + (p.questions.open_blocking
                        ? "（其中 " + p.questions.open_blocking + " 项卡交付）" : ""),
              })
            : null,
    );
}

function renderList() {
    if (state.listFolded) return renderListRail();

    const q = state.filter.trim().toLowerCase();
    const items = state.tasks.filter((it) => {
        if (!q) return true;
        const hay = [it.source_name, it.task_id, it.ID, it.relpath, it.mtime_iso,
                     String(it.version ?? ""), it.customer];
        for (const p of it.products || []) {
            hay.push(p.CPMC, p.CPMC_ZH, p.CPLB, p.KHDH);
        }
        return hay.some((s) => String(s ?? "").toLowerCase().includes(q));
    });

    const head = el("div", { class: "panel-head" },
        el("h2", { text: "任务列表" }),
        el("span", { class: "count-badge", text: items.length + " / " + state.tasks.length }),
        el("button", {
            class: "fold-btn", type: "button", title: "收起列表（把宽度还给内容）",
            onclick: () => setListFolded(true),
        }, "⟨ 收起"),
    );

    const search = el("div", { style: "padding:8px 10px 0" },
        el("input", {
            type: "search", id: "filterInput",
            placeholder: "按文件名 / 单号 / 产品名称 / 版本 过滤…",
            value: state.filter, style: "width:100%",
            oninput: (e) => { state.filter = e.target.value; renderListOnly(); },
        }));

    const totalProducts = items.reduce((n, it) => n + (it.record_count || 0), 0);
    const sub = el("div", {
        class: "hint",
        style: "padding:4px 12px 0;font-size:.74rem;color:var(--ink-3)",
        text: items.length + " 个任务 · 共 " + totalProducts + " 条产品记录",
    });

    const box = el("div", { class: "items", id: "itemsBox" });
    if (!state.tasks.length) {
        box.append(el("div", { class: "empty-state", style: "padding:22px 12px" },
            el("div", { text: state.scanOk ? "processed/ 下还没有 ERP_*.json" : "未连上服务端" })));
    }
    for (const it of items) {
        const active = state.currentMeta && state.currentMeta.relpath === it.relpath;
        const badges = el("div", { class: "l3" });
        if (state.fresh.has(it.relpath)) {
            badges.append(el("span", { class: "badge ok", text: "新",
                                       title: "刚抽出来的任务（10 秒刷新时发现的新产物）" }));
        }
        if (it.broken) {
            badges.append(el("span", { class: "badge bad", text: "文件损坏" }));
        } else {
            const count = it.record_count || 0;
            badges.append(el("span", {
                class: "badge " + (count > 1 ? "v2" : "plain"),
                text: count > 1 ? count + " 条产品" : "1 条产品",
                title: count > 1
                    ? "一个报价文件里有多条产品记录（按报价结构分组）→ 详情页分 Tab 切换"
                    : "这份询价只有一条产品记录",
            }));
            // 版本徽章：`version` 可能是 **null**（不是 undefined）—— 老产物 JSON 里就是
            // `"version": null`，只判 undefined 会拼出「vnull」这种脏字（业务报过）
            badges.append(!hasValue(it.version)
                ? el("span", { class: "badge old", text: "v1（无 version）",
                               title: "这份产物没有配置版本（第 1 代口径产物）" })
                : el("span", { class: "badge v2", text: "v" + it.version }));
            // 当次运行的校验结果（没有报告就不标，别拿现算的吓人）
            const v = it.validation;
            if (v) {
                badges.append(el("span", {
                    class: "badge " + (v.error ? "bad" : (v.warn ? "warn" : "ok")),
                    text: v.error || v.warn ? `${v.error}e/${v.warn}w` : "校验通过",
                    title: "本次运行的取值校验（erp_schema）"
                        + (it.customer ? "，客户档案 " + it.customer : ""),
                }));
            }
            if (it.customer) {
                badges.append(el("span", { class: "badge plain", text: it.customer }));
            }
            if (it.incomplete && it.incomplete.length) {
                badges.append(el("span", {
                    class: "badge bad", text: "未完成",
                    title: "不得交付：" + it.incomplete.join("；"),
                }));
            }
            // v3 内部确认清单（任务级合计）：还没确认的项数
            const qs = it.questions || {};
            if (qs.open) {
                badges.append(el("span", {
                    class: "badge " + (qs.open_blocking ? "bad" : "warn"),
                    text: qs.open + " 项待确认",
                    title: "内部确认清单：未确认 " + qs.open + " 项"
                        + (qs.open_blocking ? "（其中 " + qs.open_blocking + " 项卡交付）" : "")
                        + (qs.confirmed ? "；已确认 " + qs.confirmed + " 项" : ""),
                }));
            }
            if (it.superseded) badges.append(el("span", { class: "badge old", text: "已被取代" }));
        }

        // 产品明细：最多列 3 条，其余折成「+N」
        const productBox = el("div", { style: "margin-top:2px" });
        const prods = it.products || [];
        for (const p of prods.slice(0, 3)) productBox.append(productLine(p));
        if (prods.length > 3) {
            productBox.append(el("div", { class: "prod-line" },
                el("span", { class: "idx2", text: "+" }),
                el("span", { class: "cplb", text: "还有 " + (prods.length - 3) + " 条，点开看全部" })));
        }

        box.append(el("button", {
            class: "item" + (active ? " active" : ""),
            onclick: () => { state.fresh.delete(it.relpath); selectExport(it); },
        },
            el("div", { class: "l1" },
                el("span", { class: "when", text: it.mtime_iso || "" }),
                el("div", { class: "spacer" }),
            ),
            it.source_name
                ? el("div", {
                    class: "src", text: it.source_name,
                    title: "原始输入：" + it.source_name + "（任务 " + (it.task_id || "") + "）",
                  })
                : el("div", { class: "tid", text: it.task_id || "",
                              title: "找不到原始输入文件 → 只能显示 task_id" }),
            productBox,
            badges,
        ));
    }

    const foot = el("div", { class: "foot", text: state.scanRoot || "(未连接服务端)" });
    return el("aside", { class: "panel list", id: "listPanel" }, head, search, sub, box, foot);
}

/* 只刷列表，避免每次输入都重建整个页面（会丢焦点） */
function renderListOnly() {
    const old = document.getElementById("listPanel");
    if (!old) return render();
    old.replaceWith(renderList());
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：字段值
   ═══════════════════════════════════════════════════════════════════════ */
function renderValue(key, value, spec) {
    const wrap = el("div", { class: "field-value" });
    const isMissing = !(key in (state.current || {}));

    // 勾选框
    if (typeof value === "boolean") {
        wrap.append(el("div", { class: "line" },
            el("span", { class: "chk" },
                el("span", { class: "box", text: value ? "☑" : "☐" }),
                el("span", { text: value ? "勾选" : "未勾选" })),
        ));
        return wrap;
    }

    // 空值 / null / 缺失
    if (isEmptyValue(value) && !isMissing) {
        const d = describeValue(value);
        wrap.append(el("span", { class: "val " + d.cls, text: d.text }));
        return wrap;
    }
    if (isMissing) {
        wrap.append(el("span", { class: "val empty", text: "本产物缺失该键" }));
        return wrap;
    }

    // 长文本
    if (isLongText(key, value)) {
        const open = !!state.openPre[key];
        const pre = el("pre", { class: "long" + (open ? " open" : ""), text: value });
        const btn = el("button", {
            style: "align-self:flex-start;font-size:.76rem;padding:3px 10px",
            onclick: () => { state.openPre[key] = !open; render(); },
        }, open ? "收起" : ("展开全文（" + value.length + " 字）"));
        wrap.append(pre, btn);
        return wrap;
    }

    // 普通值 + 枚举校验
    const line = el("div", { class: "line" });
    const text = String(value);
    if (typeof value === "number") {
        line.append(el("span", { class: "val", text: text }));
        /* ⚠️ 这里**不能**写成 `line.append(a, text.length > 4 ? badge : null)`：
           浏览器原生 `ParentNode.append()` 不过滤 null，会把它当文本节点插进去 →
           页面上就是「1null」「0null」（值明明有，后面跟个字面 null）。
           2026-10-30 业务报的就是这个：短数字（TZS 1 / CPSL 0 / YYS 1）全中招，
           长数字走徽章分支反而没事。所以条件 append，别把 null 交给 append()。 */
        if (text.length > 4) {
            line.append(el("span", { class: "badge plain", text: fmtNum(value) }));
        }
    } else {
        line.append(el("span", { class: "val plain", text: text }));
    }

    const legalInfo = legalForField(spec);
    const issue = issueMap()[key];
    if (issue) {
        // 权威校验结果：error 红 / warn 黄，带后端给的原因
        line.append(el("span", {
            class: "badge " + (issue.level === "error" ? "bad" : "warn"),
            text: issue.level === "error" ? "校验 error" : "校验 warn",
            title: issue.message,
        }));
        if (issue.message) {
            wrap.append(el("div", {
                style: "font-size:.77rem;color:" + (issue.level === "error"
                    ? "var(--bad)" : "var(--warn)") + ";line-height:1.45",
                text: issue.message,
            }));
        }
    }
    wrap.append(line);

    // 枚举字段：折叠列出字典里的合法取值，纯参考（**不做判定** —— 认定交给 erp_schema）
    //  联动下拉按父字段（运输类型）筛过再列，见 legalForField()
    if (legalInfo.values.length) {
        const listBox = el("div", { class: "legal-list" },
            legalInfo.values.map((v) => el("span", { class: "legal-item" + (v === text ? " cur" : ""), text: v })));
        wrap.append(el("details", { class: "legal" },
            el("summary", { text: legalInfo.title + "（" + legalInfo.values.length + "）" }), listBox));
    }
    return wrap;
}

function renderField(key, spec, badgeText) {
    const cur = state.current || {};
    const missing = !(key in cur);
    const zh = spec ? spec.label : "";
    const label = el("div", { class: "field-label" },
        el("span", { class: "zh", text: (zh || "（字典里没有）") }),
        el("span", { class: "code", text: key }),
    );
    // 长值跨整行，短值跟邻居并排（排版见 CSS 的 .field-grid / .field.wide）
    const wide = fieldIsWide(key, cur[key]) ? " wide" : "";
    const field = el("div", { class: "field" + wide + (missing ? " missing" : "") }, label,
        renderValue(key, cur[key], spec));
    if (badgeText) {
        label.querySelector(".zh").append(" ", el("span", { class: "badge int", text: badgeText }));
    }
    return field;
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：主区
   ═══════════════════════════════════════════════════════════════════════ */
/** 取值校验徽章 —— 用服务端权威结果（run_report 最可信） */
function validBadge() {
    const v = state.validation;
    if (!v) return el("span", { class: "badge plain", text: "无校验结果" });
    const e = (v.errors || []).length;
    const w = (v.warnings || []).length;
    if (v.source === "unavailable") return el("span", { class: "badge warn", text: "校验不可用" });
    const src = v.source === "run_report"
        ? ("本次运行报告" + (v.customer ? "·客户 " + v.customer : ""))
        : "现场重算（未按档案豁免）";
    return el("span", {
        class: "badge " + (e ? "bad" : (w ? "warn" : "ok")),
        text: "校验 " + e + " error / " + w + " warn（" + src + "）",
        title: v.note || "",
    });
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：任务级摘要 + 产品记录 Tab（★ 2026-10-29 产物是数组）
   ═══════════════════════════════════════════════════════════════════════ */

/** 任务级信息（这条询价是谁发的、什么时候跑的、里面有几条产品记录） */
function renderTaskSummary() {
    const m = state.currentMeta || {};
    const n = state.records.length;
    const kvs = [
        ["原始输入", m.source_name || "（找不到原件：可能是手动导入或老产物）"],
        ["任务ID", m.task_id || "-"],
        ["产品记录", n + " 条（ERP 导出为数组）" + (n > 1 ? " —— 下方按条切换" : "")],
        ["产出时间", m.mtime_iso || "-"],
        ["文件名", m.filename || "-"],
        ["任务目录", m.dir || "-"],
    ];
    const panel = el("section", { class: "panel" },
        el("div", { class: "panel-head" },
            el("h2", { text: "本次任务" }),
            m.superseded ? el("span", { class: "badge old", text: "已被取代" }) : null,
            m.manual ? el("span", { class: "badge plain", text: "手动导入" }) : null,
            m.broken ? el("span", { class: "badge bad", text: "文件损坏" }) : null,
            el("div", { class: "spacer" }),
            el("span", { class: "badge " + (n > 1 ? "v2" : "plain"),
                         text: n + " 条产品记录" }),
        ),
        el("div", { class: "summary" },
            el("div", { class: "kv-grid" },
                kvs.map(([k, v]) => el("div", { class: "kv" },
                    el("span", { class: "k", text: k }),
                    el("span", { class: "v", text: v }))))),
    );
    // 读取失败的横幅由 renderHeader() 统一显示，这里不重复
    return panel;
}

/** Tab 徽章配色：这条记录能不能交付 */
function recordStatus(rec, index) {
    const gates = state.incompleteByRecord[index];
    if (Array.isArray(gates) && gates.length) return "bad";
    const v = state.validationByRecord[index];
    if (v && (v.errors || []).length) return "bad";
    if (v && (v.warnings || []).length) return "warn";
    if (Array.isArray(gates)) return "ok";
    return "";
}

/**
 * 多条产品记录 → **可切换的 Tab**（业务 2026-10-29：「原先的 ERP 数据展示页，
 * 变成多个 Tag 可切换的展示页」）。只有 1 条时不渲染 Tab 条，直接显示内容。
 */
function renderTabs() {
    const records = state.records || [];
    if (records.length <= 1) return el("span", { class: "hidden" });

    const bar = el("div", { class: "tabs" });
    records.forEach((rec, i) => {
        const name = String(rec.CPMC_ZH || rec.CPMC || "").trim() || ("产品记录 " + (i + 1));
        const dims = [];
        if (rec.CPLB) dims.push(String(rec.CPLB));
        if (rec.TZS !== undefined && rec.TZS !== null && rec.TZS !== "") dims.push("TZS " + rec.TZS);
        if (rec.CPSL1) dims.push(fmtNum(Number(rec.CPSL1)) + " cps");
        const status = recordStatus(rec, i);
        bar.append(el("button", {
            class: "tab" + (i === state.activeRecord ? " active" : "") + (status ? " " + status : ""),
            type: "button",
            title: name + (dims.length ? "（" + dims.join(" · ") + "）" : ""),
            onclick: () => setActiveRecord(i),
        },
            el("span", { class: "t1" },
                el("span", { class: "idx", text: String(i + 1) }),
                el("span", { text: name })),
            el("span", { class: "t2", text: dims.join(" · ") || "（结构键待补）" }),
        ));
    });
    return el("section", { class: "panel", style: "padding:0;overflow:hidden" }, bar);
}

/* ═══════════════════════════════════════════════════════════════════════
   渲染：内部确认清单（schema v3 · question_answers）
   —— 判定逻辑只在服务端（scripts/question_answers.py），这里只显示。
   v2 旧产物没有这个键 → 返回 null，页面不出现这个块。
   ═══════════════════════════════════════════════════════════════════════ */
/* ── 写答案（POST /api/answer）────────────────────────────────────────────
   页面能写的**只有** question_answers 的答案/状态；CPMS、品名、59 个 ERP 字段
   一律只读 —— 那些是 agent 通读客户原文后手写的，页面上没有编辑部。
   ──────────────────────────────────────────────────────────────────────── */
function answerKey(ridx, qid) {
    const rel = (state.currentMeta && state.currentMeta.relpath) || "";
    return rel + "#" + (ridx + 1) + "#" + qid;
}

/** 能不能写：要连服务端、且不是「手动导入的本地文件」 */
function canWriteAnswers() {
    return !!(state.scanOk && state.currentMeta && !state.currentMeta.manual);
}

async function saveAnswer(ridx, item, text, status) {
    const key = answerKey(ridx, item.id);
    if (state.answering[key]) return;
    state.answering[key] = true;
    state.answerMsg[key] = null;
    render();
    try {
        const res = await fetch("api/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                path: state.currentMeta.relpath,
                record: ridx + 1,
                id: item.id,
                answer: text,
                status: status || null,
                mtime: state.currentMeta.mtime,
            }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
        delete state.drafts[key];
        state.answerMsg[key] = { ok: true,
            text: "已保存 " + new Date().toLocaleTimeString("sv-SE") };
        // 服务端回来的 mtime 才是权威值 → 下次保存的乐观锁用它（列表里的可能还没刷新）
        if (body.mtime) state.currentMeta.mtime = body.mtime;
        // 服务端已重算 Reminder 快照与闸门 → 重取一次详情（保持当前 Tab）
        await refreshDetailInPlace();
    } catch (err) {
        state.answerMsg[key] = { ok: false, text: "保存失败：" + ((err && err.message) || err) };
        // 409（文件被别处改过）→ 自动重取，让人看到最新内容再决定改不改
        if (String((err && err.message) || "").indexOf("改过") >= 0) await refreshDetailInPlace();
        render();
    } finally {
        delete state.answering[key];
    }
}

/** 只重取当前任务的详情（不换 Tab、不动草稿）—— 保存答案后刷新闸门/徽章用 */
async function refreshDetailInPlace() {
    if (!state.currentMeta || state.currentMeta.manual) return;
    try {
        const res = await fetch("api/export?path=" + encodeURIComponent(state.currentMeta.relpath),
                                { cache: "no-store" });
        if (!res.ok) return;
        const payload = await res.json();
        const records = (payload.records && payload.records.length)
            ? payload.records : [payload.data || {}];
        state.records = records;
        state.validationByRecord = payload.validation_by_record || [];
        state.incompleteByRecord = payload.incomplete_by_record || [];
        state.activeRecord = clampIndex(state.activeRecord, records.length);
        applyActiveRecord();
        // 列表里的 mtime 可能还没刷新（10 秒轮询）→ 只许往更新的方向走，别把乐观锁退回去
        const t = state.tasks.find((x) => x.relpath === state.currentMeta.relpath);
        if (t && t.mtime) state.currentMeta.mtime = Math.max(state.currentMeta.mtime || 0, t.mtime);
        render();
    } catch (_) { /* 静默：下一轮 10 秒刷新会补上 */ }
}

function recordQuestions(cur) {
    const raw = cur ? cur.question_answers : undefined;
    const items = Array.isArray(raw) ? raw : (raw && typeof raw === "object" ? [raw] : []);
    const out = { total: 0, open: 0, open_blocking: 0, confirmed: 0, waived: 0 };
    for (const it of items) {
        if (!it || typeof it !== "object") continue;
        out.total += 1;
        const status = String(it.status || "open").toLowerCase();
        const answered = String(it.answer == null ? "" : it.answer).trim() !== "";
        if (status === "waived") out.waived += 1;
        else if (status === "confirmed" || answered) out.confirmed += 1;
        else {
            out.open += 1;
            if (it.blocking) out.open_blocking += 1;
        }
    }
    return out;
}

/* ── 清单的折叠状态（默认折叠，2026-10-30 业务要求）──────────────────────
   为什么记在 state 里而不是用 <details>：页面每 10 秒整体重建 DOM，
   用 DOM 自带状态会在刷新后弹回默认；`state.qaOpen` 按「产物#第几条」记，
   重建 / 切 Tab / 保存后重取详情都不会把已经展开的块合上。
   ──────────────────────────────────────────────────────────────────────── */
function qaOpenKey(ridx) {
    const rel = (state.currentMeta && state.currentMeta.relpath) || "";
    return rel + "#" + (ridx + 1);
}

function qaIsOpen(ridx) {
    return !!state.qaOpen[qaOpenKey(ridx)];
}

/** 折叠时那行提示：第一条还开着的确认项（没有就说明都处理完了） */
function firstQuestionPeek(items) {
    for (const it of items) {
        if (!it || typeof it !== "object") continue;
        const status = String(it.status || "open").toLowerCase();
        const answered = String(it.answer == null ? "" : it.answer).trim() !== "";
        if (status === "waived" || status === "confirmed" || answered) continue;
        const q = String(it.question || "").trim();
        if (!q) continue;
        return (it.id ? it.id + " · " : "") + (q.length > 58 ? q.slice(0, 55) + "…" : q);
    }
    return items.length ? "全部已确认 / 已作废" : "（空清单）";
}

function toggleQuestions(ridx) {
    const key = qaOpenKey(ridx);
    state.qaOpen[key] = !state.qaOpen[key];
    render();
}

function renderQuestions(cur) {
    if (!cur || cur.question_answers === undefined) return null;   // v2 旧产物
    const items = Array.isArray(cur.question_answers) ? cur.question_answers
        : (cur.question_answers ? [cur.question_answers] : []);
    const sum = recordQuestions(cur);
    const ridx = state.activeRecord;
    const open = qaIsOpen(ridx);

    const head = el("div", {
        class: "panel-head qa-head",
        role: "button",
        tabindex: "0",
        "aria-expanded": open ? "true" : "false",
        title: open ? "点击折叠（答案不会丢）" : "点击展开确认清单",
        onclick: () => toggleQuestions(ridx),
        onkeydown: (e) => {
            if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
                e.preventDefault();
                toggleQuestions(ridx);
            }
        },
    },
        el("span", { class: "qa-caret", text: open ? "▾" : "▸" }),
        el("h2", { text: "内部确认清单" }),
        el("span", { class: "badge " + (sum.open_blocking ? "bad" : (sum.open ? "warn" : "ok")),
                     text: sum.open ? (sum.open + " 项未确认"
                         + (sum.open_blocking ? "（" + sum.open_blocking + " 项卡交付）" : ""))
                         : "无未确认项" }),
        el("div", { class: "spacer" }),
        // 折叠时也让人知道里面有什么 —— 徽章不够细，补一句首条问题
        open ? el("span", { class: "hint", text: "question_answers · 待办只记这里，CPMS 正文只留结论" })
            : el("span", { class: "hint qa-peek", text: firstQuestionPeek(items) }),
    );

    // 折叠时不构建 body（不是 CSS 隐藏）：块里有 textarea，藏着也占 DOM 与刷新开销
    if (!open) return el("section", { class: "panel" }, head);

    const body = el("div", { style: "padding:0 16px 14px;display:flex;flex-direction:column;gap:8px" });
    if (!items.length) {
        body.append(el("div", { class: "banner info", style: "margin:0" },
            "✅ 没有待确认项（空数组）"));
    }
    for (const it of items) {
        if (!it || typeof it !== "object") continue;
        const status = String(it.status || "open").toLowerCase();
        const answered = String(it.answer == null ? "" : it.answer).trim() !== "";
        const state2 = status === "waived" ? "waived"
            : (status === "confirmed" || answered) ? "confirmed" : "open";
        const chip = state2 === "confirmed" ? ["ok", "已确认"]
            : state2 === "waived" ? ["old", "作废"] : ["warn", "未确认"];
        body.append(el("div", {
            style: "border:1px solid var(--line,#e3e3e3);border-radius:8px;padding:8px 10px;"
                 + "display:flex;flex-direction:column;gap:4px",
        },
            el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" },
                el("span", { class: "badge " + chip[0], text: chip[1] }),
                el("span", { style: "font-family:var(--mono);font-size:.76rem", text: it.id || "(无 id)" }),
                it.field ? el("span", { class: "badge plain", text: it.field }) : null,
                it.blocking ? el("span", { class: "badge bad", text: "卡交付" }) : null,
                it.source ? el("span", { class: "badge plain", text: it.source }) : null,
                el("div", { class: "spacer" }),
                it.asked_at ? el("span", { class: "hint", text: "提出 " + it.asked_at }) : null,
                it.answered_at ? el("span", { class: "hint", text: "确认 " + it.answered_at }) : null,
            ),
            el("div", { text: it.question || "（没写问题）" }),
            answerEditor(state.activeRecord, it),
        ));
    }
    return el("section", { class: "panel" }, head, body);
}

/** 一条确认项的答案编辑区：能写就给文本框 + 保存/作废，不能写就只读显示 */
function answerEditor(ridx, it) {
    const key = answerKey(ridx, it.id);
    const draft = state.drafts[key];
    const value = draft !== undefined ? draft
        : (it.answer === null || it.answer === undefined ? "" : String(it.answer));
    const busy = !!state.answering[key];
    const msg = state.answerMsg[key];

    if (!canWriteAnswers()) {
        const why = state.currentMeta && state.currentMeta.manual
            ? "手动导入的本地文件（没连服务端）→ 只读"
            : "没连服务端 → 只读";
        return el("div", { style: "font-size:.82rem;color:var(--muted,#666);display:flex;flex-direction:column;gap:2px" },
            el("div", { text: value ? ("→ " + value) : "→ （还没确认）" }),
            el("div", { class: "qa-hint", text: why }));
    }

    return el("div", { class: "qa-edit" },
        el("textarea", {
            id: "qa-" + it.id,
            class: "qa-input",
            rows: 2,
            placeholder: "在这里写确认结果；保存后自动标为已确认，清空再保存 = 回到未确认",
            oninput: (e) => { state.drafts[key] = e.target.value; },
        }, value),
        el("div", { class: "qa-actions" },
            el("button", {
                class: "qa-save", type: "button", disabled: busy || undefined,
                onclick: () => saveAnswer(ridx, it, answerText(key, value), null),
            }, busy ? "保存中…" : "保存答案"),
            el("button", {
                class: "qa-waive", type: "button", disabled: busy || undefined,
                title: "不用确认了 → 标成作废，不再卡交付",
                onclick: () => saveAnswer(ridx, it, it.answer || "", "waived"),
            }, "作废"),
            msg ? el("span", { class: "qa-msg " + (msg.ok ? "ok" : "bad"), text: msg.text }) : null,
        ),
    );
}

/** 取「当前文本框里真正的内容」：草稿优先（自动刷新重建 DOM 后靠它不丢字） */
function answerText(key, fallback) {
    const d = state.drafts[key];
    return d !== undefined ? d : fallback;
}

function renderSummary() {
    const m = state.currentMeta || {};
    const d = structuralDiff();
    const cur = state.current || {};
    const n = state.records.length;
    const idx = state.activeRecord;
    const qsum = recordQuestions(cur);
    const kvs = [
        ["产品名称", String(cur.CPMC_ZH || cur.CPMC || "").trim() || "（空 —— 必须 agent 拟）"],
        ["产品类别", cur.CPLB === undefined ? "缺" : String(cur.CPLB || "（空）")],
        ["产品大类", cur.CPDL === undefined ? "缺" : String(cur.CPDL || "（空）")],
        ["TZS / CPSL1", (cur.TZS ?? "缺") + " 款 / " + (cur.CPSL1 ?? "缺")],
        ["尺寸 CD×KD×GD", [cur.CD, cur.KD, cur.GD].map((v) => v ?? "缺").join(" × ")],
        ["客户单号", cur.KHDH === undefined ? "缺" : (cur.KHDH || "（空）")],
        ["CPMS 字数", (typeof cur.CPMS === "string" && cur.CPMS.trim())
            ? cur.CPMS.length + " 字" : "未写（agent 必填）"],
        ["配置版本", !hasValue(cur.version) ? "缺（第 1 代产物）" : String(cur.version)],
        ["格式版本", !hasValue(cur.schema_version)
            ? "缺（v2 及更早：无 question_answers）" : "v" + cur.schema_version],
        ["内部确认", cur.question_answers === undefined ? "缺（v2 旧产物）"
            : (qsum.total
                ? qsum.open + " 未确认 / " + qsum.total + " 项"
                  + (qsum.open_blocking ? "（" + qsum.open_blocking + " 卡交付）" : "")
                  + (qsum.confirmed ? "，已确认 " + qsum.confirmed : "")
                : "无待确认项")],
        ["键统计", d.actualCount + " 个（应有 " + d.erpKeys.length + " ERP"
            + (d.internalKeys.length ? " + " + d.internalKeys.length + " 内部" : "") + "）"],
    ];
    const panel = el("section", { class: "panel" },
        el("div", { class: "panel-head" },
            el("h2", { text: n > 1 ? ("第 " + (idx + 1) + " / " + n + " 条产品记录") : "本份产物" }),
            m.broken ? el("span", { class: "badge bad", text: "文件损坏" }) : null,
            validBadge(),
        ),
        el("div", { class: "summary" },
            el("div", { class: "kv-grid" },
                kvs.map(([k, v]) => el("div", { class: "kv" },
                    el("span", { class: "k", text: k }),
                    el("span", { class: "v", text: v })))),
        ),
    );

    // 结构对照：缺了哪些当前结构的键 —— 旧产物一眼看出差在哪
    const notes = el("div", { style: "padding:0 16px 14px;display:flex;flex-direction:column;gap:7px" });
    if (d.missing.length) {
        notes.append(el("div", { class: "banner warn", style: "margin:0" },
            el("div", {}, el("b", { text: "缺 " + d.missing.length + " 个 ERP 字段（当前结构有、这份没有）：" })),
            el("div", { class: "code", style: "font-family:var(--mono);font-size:.76rem", text: d.missing.join(", ") }),
        ));
    }
    if (d.missingInternal.length) {
        notes.append(el("div", { class: "banner warn", style: "margin:0" },
            el("b", { text: "缺内部字段：" }), String(d.missingInternal.join(", "))));
    }
    if (d.extra.length) {
        notes.append(el("div", { class: "banner info", style: "margin:0" },
            el("b", { text: "多出 " + d.extra.length + " 个不在当前结构与内部清单里的键：" }),
            " " + d.extra.join(", ")));
    }
    if (!d.missing.length && !d.extra.length && !d.missingInternal.length) {
        notes.append(el("div", { class: "banner info", style: "margin:0" },
            "✅ 键与当前结构完全一致（" + d.erpKeys.length + " ERP + " + d.internalKeys.length + " 内部）"));
    }
    if (notes.children.length) panel.append(notes);
    return panel;
}

function renderGroups() {
    const cur = state.current || {};
    const schema = state.schema;
    if (!schema) return el("div");

    const groups = schema.groups || [];
    const groupKeys = new Set(groups.flatMap((g) => g.keys));
    // 字典里有、但没归组的键 → 落到「其他」，绝不静默丢掉
    const ungrouped = (schema.erp_fields || []).map((f) => f.key).filter((k) => !groupKeys.has(k));

    const sections = [];
    for (const g of [...groups, { name: "其他（未归组）", hint: "字典里有但还没归类的字段", keys: ungrouped }]) {
        const keys = g.keys;
        if (!keys.length) continue;
        // 「有值」= **真有值**，不是「键在不在」：null / 空字符串不算，否则一堆 null
        // 也会显示「11 / 11 有值」，跟下面每格都写 null 自相矛盾（业务 2026-10-30 报过）
        const fieldCount = keys.filter((k) => hasValue(cur[k])).length;
        const presentCount = keys.filter((k) => k in cur).length;
        sections.push(el("section", { class: "panel" },
            el("div", { class: "group-head" },
                el("h3", { text: g.name }),
                el("span", { class: "hint", text: g.hint || "" }),
                el("div", { class: "spacer" }),
                el("span", { class: "badge " + (fieldCount === keys.length ? "plain" : "warn"),
                             text: fieldCount + " / " + keys.length + " 有值",
                             title: presentCount === fieldCount
                                 ? "有实际取值的字段数（null / 空字符串不算）"
                                 : "有实际取值的字段数；另有 "
                                   + (presentCount - fieldCount)
                                   + " 个键存在但值为 null/空（ERP 口径：无 → null）" }),
            ),
            el("div", { class: "field-grid" }, keys.map((k) => renderField(k, specOf(k)))),
        ));
    }

    // 内部导出字段单独成组
    // ★ question_answers 是结构化清单（kind=questions），由 renderQuestions 单独成块渲染，
    //   不能塞进字段表格（会被显示成 [object Object]）。
    const internal = (schema.internal_fields || []).filter((f) => f.kind !== "questions");
    const ig = schema.internal_group || { name: "内部导出字段", hint: "" };
    if (internal.length) {
        sections.push(el("section", { class: "panel group internal" },
            el("div", { class: "group-head" },
