# ═══════════════════════════════════════════════════════════════
# 客户档案：igl  （IGL / Flamingo）
#
# status: calibrated —— 已用真实报价文件 `PUZZLE COLOUR DISNEY.xlsx`
#         校准，字段别名表来自 assets/customer_erp_mapper.xlsx（25 行）。
#
# 改这里的任何值 → 必须重跑回归：
#     uv run ./scripts/main.py customer-files/pending/<样本> --customer igl
#   并确认 59 键断言通过、字段值无意外变化。
# ═══════════════════════════════════════════════════════════════
id: igl
name: IGL
priority: 100
status: calibrated
notes: >
  香港书商，报价单是「横向键值对」表格：第一行 Imprint | Autumn | Complexity | Low …
  同一行右侧还可能续上第 3、4 组键值（如 Group/Series Number | | 6366）。

# ── 1. 身份识别：怎么从邮件/文件认出这是 igl ───────────────────
detect:
  # 文件名关键词（小写、包含匹配）
  filename_keywords:
    - puzzle
    - colour
  # 附件/邮件里出现下列任一「特征标签」即判为 igl
  label_signatures:
    - "Works References For all Titles"
    - "Safety Checks Req? (Y/N)"
    - "Extent (pp + cover)"
  min_signature_hits: 1
  # 发件人域名（可选，留空表示不按发件人判断）
  sender_domains: []
  # 邮件主题关键词（可选）
  subject_keywords: []

# ── 2. 字段别名表：客户表里的列名 → 规范键 ─────────────────────
# 匹配规则：归一化（小写 / 压缩空白）后「完全相等」，或整词包含。
# 多个别名同时命中时取最长者（所以 Group 不会抢走 Group/Series Number）。
fields:
  imprint:              ["Imprint"]
  complexity:           ["Complexity"]
  requested_by:         ["Requested By"]
  pub_month:            ["Pub Month", "Publication Month", "Publishing Month"]
  series_name:          ["Series Name", "Series"]
  number_of_titles:     ["Number of titles", "Number of Titles", "No. of titles", "Titles"]
  group:                ["Group"]
  category:             ["Category"]
  safety_checks:        ["Safety Checks Req? (Y/N)", "Safety Checks Required?", "Safety Checks"]
  target_age_group:     ["Target Age Group", "Age Group"]
  works_references:     ["Works References For all Titles", "Works References"]
  group_series_number:  ["Group/Series Number"]
  isbn:                 ["ISBNs of All Titles", "ISBNs", "ISBN"]
  project_description:  ["Project description", "Project Description"]
  size:                 ["Size (tps) H x W x D mm", "Size"]
  format:               ["Format"]
  extent:               ["Extent (pp + cover)", "Extent"]
  text_printing_spec:   ["Text Printing Spec"]
  text_material:        ["Text Material"]
  cover_printing_spec:  ["Cover Printing Spec"]
  cover_material:       ["Cover Material"]
  # ★ 2026-10-29（BIBLE HEROES Treasury 实单）：环衬纸/环衬印色是**独立两行**，
  #   旧别名表里没有 → 抽不出来，CPMS 的「皮壳衬纸」只能靠 agent 手工回读原文。
  #   NGV 那边早就有 ends_material，IGL 这里补齐（只喂 CPMS，不映射 ERP 字段）。
  ends_material:        ["End Paper Material", "Ends Material", "Endpaper Material"]
  ends_printing_spec:   ["End Paper Printing Spec", "Ends Printing Spec"]
  # 成品尺寸两行：`Size (tps) H x W` 是**成品/裁切尺寸**（进 CD/KD），
  # `Size (actual) H x W x D mm` 是**实际外廓**（皮壳/包装用，只进 CPMS）。
  # 别名取最长，所以 `Size (actual) …` 不会抢走 `size`。
  size_actual:          ["Size (actual) H x W x D mm", "Size (actual)"]
  spine_width:          ["Spine width"]
  binding:              ["Binding instructions", "Binding"]
  finishes:             ["Finishes"]
  # 数量档位行的标签（CPSL1~CPSL10 的来源）
  quantity_tiers:       ["Total Costs", "Total Cost", "Cost", "Quantity", "数量"]

# ── 2b. 已知的「非 ERP 字段」附加信息 ──────────────────────────
# 这些栏位不进 ERP JSON（模板里没有对应字段），但**必须**体现在 CPMS 里。
# 登记在这里的好处：① `calibrate_customer.py` 不再把它们当成「认不出的标签」；
# ② `main.py` 会把它们列成「CPMS 素材」提醒 agent 别漏。
extras:
  - Quotation Number
  - Quote Valid Until
  - Production Facility Name & Address
  - Carton Weight
  - Carton Weight (mm) H x W x L
  - Carton Length
  - Carton Width / Depth
  - Carton Height
  - Carton dimensions to be adhered too
  - Based on carton qty
  - Minimum
  - Maximum
  - GRAND TOTAL
  - Add 100%foil
  - Add 50%foil
  - Add 25%foil
  - Add 100% holo foil
  - Add 50% holo foil
  - Add spot UV
  - Add emboss
  - Add 1 PMS
  - Add pallets
  - Text paper type and brand
  - Cover paper type and brand

# ── 3. ERP 固定值（该客户所有单子都一样的值）────────────────────
# 取值必须落在 assets/erp_form_schema.yaml 的合法枚举内 —— main.py 步骤 5b 会校验。
erp_fixed:
  CPDL: 书版          # ERP 枚举：4=书版
  YYS: 1
  # BZ（客户目标价币种）不再在这里声明 —— 它已挪到公共 `_defaults.yaml` 的
  # erp_defaults（默认值层）。业务 2026-10-30 定的口径：没提到才用默认，客户写明了
  # 币种就听客户的。igl 原本写死的「美元」效果不变（没有任何来源会推导 BZ），
  # 但语义从「无条件覆盖」变成「补空」。偏好表里的 BZ 一行仍然有效。
  PXH: 1
  KHMBDJ: 0
  DWMC: 本            # 业务确认 2026-09-23：书版产品单位用「本」（ERP 单位枚举含「本」）

# ── 客户偏好表 ──────────────────────────────────────────────
# 业务 2026-09-24 提出：长期合作客户有稳定口径，要一份「喜爱表」一眼看全、快速填写。
# 口径只有两种：写了值 → 直接落库；值为空 → 显式留空（推不出来不猜）。
# ⚠️ 与 erp_fixed 必须同步（有校验 + 测试拦着），本段是给人看的、erp_fixed 是落库值。
# ⚠️ 待业务确认（2026-09-24）：`PXH` 排序号目前 igl 仍填 1，而 NGV 已按业务口径留空
#    （4 份 NGV 导出 3 空 1 填 1）。要不要对 igl 也留空？一行的事。
preferences:
  - { field: CPDL,   value: "书版", reason: "产品大类只有『书版』一个合法值（ERP 枚举 4=书版）" }
  - { field: YYS,    value: "1",    reason: "该客户报价单口径为单语言（旧口径；NGV 已改为单语言留空，igl 待确认）" }
  - { field: BZ,     value: "美元", reason: "该客户报价一律美元（历史单据存 label）" }
  - { field: PXH,    value: "1",    reason: "排序号默认 1（⚠️ 业务 2026-09-24 对 NGV 定的是留空，igl 待确认）" }
  - { field: KHMBDJ, value: "0",    reason: "客户目标价金额：报价阶段没有，落 0（业务 2026-09-24 确认 0 可接受）" }
  - { field: DWMC,   value: "本",   reason: "业务 2026-09-23 确认：书版产品单位用「本」" }

# ── 4. 解析规则 ────────────────────────────────────────────
rules:
  layout:
    # 依次尝试的布局策略；先到先得（不覆盖已抽到的值），所以可以互补
    #   auto_pairs    —— 主策略：标签在下方 or 右侧，一条规则通吃大多数报价单
    #   column_pairs  —— 固定列：标签在 label_col，值在 value_col
    #   shifted_pairs —— 只向右扫（纯横向键值对布局）
    strategies: [auto_pairs, column_pairs, shifted_pairs]
    label_col: 1              # column_pairs 用的标签列（0 基）
    value_col: 2              # 对应的值列
    min_label_row_hits: 2     # 一行里有 ≥2 个已知标签即视为「密集标签行」→ 优先取下方
    max_label_len: 60         # 超过这个长度的单元格不可能是标签（防值被当标签）

  size:
    unit: mm
    order: [CD, KD, GD]       # 客户写 "H x W x D"，第 1 段=长(CD) 第 2 段=宽(KD) 第 3 段=厚(GD)

  # ── GD（成品厚度）────────────────────────────────────────────
  # ★ 2026-10-21 业务拍板（`BIBLE HEROES Treasury` 那单之后）：
  #   **不做厚度推算**。客户表里写了 `D`（`Size … H x W x D`）就照抄客户的；
  #   客户没写（`Spine width: To suit extent` / 只给 H x W）→ **GD 落 0**，
  #   不许按「页数 × 纸张克重」推、更不许估灰板。理由：
  #   ① 推算值没有客户出处，审计/报价都对不上（推出来的 11.16 客户从不给）；
  #   ② 语料里业务绝大多数精装单 GD 也是 0（1597 条里 1567 条为 0）；
  #   ③ 厚度影响纸箱与书脊，猜错的代价比留 0 高（留 0 业务会问，猜错不会）。
  #   所以 `enabled: false` + `boards.enabled: false` 两处都关；将来若业务要恢复
  #   「客户没给就推算」，把 enabled 打开即可（代码路径仍在，`boards` 负责灰板补偿）。
  thickness:
    enabled: false
    boards:
      enabled: false
      # `over 3mm boards` / `3mm灰板` / `3 mm chipboard`
      trigger: "cased|case\\s*bound|hardcover|hard\\s*back|精装"
      source_keys: [cover_material, binding]
      pattern: "(\\d+(?:\\.\\d+)?)\\s*mm\\s*(?:boards?|灰板|chipboard)"
      panels: 2                # 前封面 + 后封面各一块

  # 数量档位（CPSL1~CPSL10）识别方式
  quantity_tiers:
    k_suffix: true                            # 支持 3k / 7.5k
    plain: true                               # 支持 3000
    plain_label_hint: "quantity|qty|total|cost|数量|印数"
    max_tiers: 10

  # 材质 → 厚度表纸张类型（TODO「纸张类型映射表」的落地）
  materials:
    text:
      default: 书纸
      map:
        - { match: "woodfree|uncoated|书纸|胶版|munk|蒙肯", page_style: 书纸 }
        - { match: "art ?paper|c1s|c2s|铜版|光粉|粉卡|白卡", page_style: 光粉纸 }
    cover:
      default: 光粉纸
      map:
        - { match: "c1s|artboard|art ?card|光粉|粉卡|白卡|卡纸", page_style: 光粉纸 }
        - { match: "c2s|art ?paper|铜版", page_style: 紫罗兰高压双铜 }

  # 装订方式 → ERP `ZDFS`
  # ★ 2026-09-23 已定口径：合法取值以 ERP 表单为准（assets/erp_form_schema.yaml）：
  #   胶装/PAD书 · 精装书 · 骑马钉 · 其他 · 套装 · 车线书 · 线圈书 · 快线/中线/慢线BB书
  #   注意「无线胶装」不是合法值（历史单据 0e39e2e2 就填错了）→ 对应「胶装/PAD书」。
  #   映射表命中不到时用 default（同样必须是合法值）。
  binding:
    enabled: true
    default: 胶装/PAD书
    map:
      "perfect bound": 胶装/PAD书
      "perfectbound": 胶装/PAD书
      "paperback": 胶装/PAD书
      "paper back": 胶装/PAD书
      "无线胶装": 胶装/PAD书
      "wire-o": 线圈书
      "wiro": 线圈书
      "coil": 线圈书
      "saddle": 骑马钉
      "staple": 骑马钉
      # ★ 2026-10-29 修的真 bug（BIBLE HEROES Treasury 实单）：
      #   `Cased book, section sewn, cover drawn on over 3mm boards` —— `cased` 不在
      #   旧表里、`case bound` 也匹配不上（cased ≠ case bound），于是落到下表最后的
      #   `sewn` → ZDFS=车线书。而语料库 1597 条 `CPLB=方脊精装书` 里 1588 条 ZDFS 是
      #   `精装书`（99.4%）—— 皮壳 + 锁线是**精装**，车线书是软封面车线（25 类）。
      #   所以 `cased` 必须排在 `sewn` 前面；`sewn` 只在没有皮壳线索时才用。
      "cased": 精装书
      "case bound": 精装书
      "hardcover": 精装书
      "hardback": 精装书
      "sewn": 车线书
      "thread sewn": 车线书
      "slipcase": 套装
      "box set": 套装

  # 系列名的「表单痕迹」清理（2026-10-29 BIBLE HEROES 实单）：
  # 客户把 `Series Name` 写成 `Working Title: 'BIBLE HEROES Treasury'`，
  # 直接拼 CPMC 会变成 `22.02;方脊精装书-Working Title: 'BIBLE HEROES Treasury'`。
  # 只清前缀与包裹引号，不翻译、不改写 —— 清完 `BIBLE HEROES Treasury`。
  series_name:
    strip_pattern: "(?i)^\\s*(?:working\\s+title|w\\.?\\s*t\\.?|series\\s+name|title)\\s*[:：]\\s*"

  # ── 产品名称 CPMC / 产品英文名 ECPMC ───────────────────────────
  # ★ 2026-10-21 业务拍板：IGL 按 **NGV 口径** 做（此前 IGL 用旧写法
  #   `23.01;无线胶装书-<系列名>`，那是历史 ERP 记录的样子，不再沿用）。
  #   新口径：
  #     CPMC    = 产品名称的**中文译名**（agent 从客户文件译出，脚本不翻译）
  #     CPMC_ZH = 与 CPMC 同值
  #     ECPMC   = 报价的**原始产品名**，客户写什么语言就照抄什么（不译不拼类别）
  #   中文品名是**每单**的，档案里给不出来 → 模板留可见占位符 `【中文品名待定】`，
  #   交付前由 agent 直接改产物（needs_agent=true 会在日志里点名，也进 cpms_todo）。
  #   ⚠️ 只改这里不够：tests/test_pipeline.py 的 EXPECTED_VALUES / UNTOUCHED 同步改，
  #      否则端到端基线立刻红（口径变更四处同步，见总纲）。
  cpmc:
    allow_chinese: true      # CPMC 允许中文（新口径就是中文译名）
    cn_name: ""              # 每单不同 → 留空，占位符 + agent 补
    template: "【中文品名待定】"
    zh_template: "【中文品名待定】"
    needs_agent: true
  # 产品英文名 ECPMC（ERP 字段 `txtECPMC`，label「产品英文名」＝原始产品名）：
  # IGL 表里能当品名用的就是 `Series Name`（已是 `Working Title:` 前缀清过的原文）。
  # 取不到时留空 + WARN，由 `cpms_todo.py` 列为待办，**不许自己编英文名**。
  ecpmc:
    source_keys: [series_name]

  # 产品类别查表：先走 cplb.map（档案关键词 → 树节点，精确可控），
  # 命中不到再退回 assets/product_categories.xlsx 的 customer_product_categories 列
  # （该列只有 paperback 一行有值，是历史遗留路径，尽量用 cplb.map 取代）。
  cplb:
    match_keys: [format, binding, finishes, project_description, series_name]
    map:
      # 长正则在前（先到先得），限定「纸板书」类词以免 board 误命中
      - { match: "board\\s*book|纸板书|厚纸板", node: "27.02" }
      - { match: "lift[- ]the[- ]flap|翻翻|揭页", node: "27.05" }
      - { match: "pop[- ]?up", node: "28.01" }
      - { match: "wire[- ]?o|wiro|spiral|线圈|蛇圈", node: "26.01" }
      - { match: "saddle|staple|骑马钉|骑钉", node: "24.01" }
      - { match: "case\\s*bound|hardcover|hard\\s*back|精装", node: "22.02" }
      - { match: "thread\\s*sewn|车线", node: "25.01" }
      - { match: "perfect\\s*bound|perfectbound|paperback|paper\\s*back|无线胶装", node: "23.01" }
  product_category:
    fallback: "32.00;其他"

  # 产品属性 CPSX：由客户文件里的 Target Age Group + Safety Checks 推导（业务确认 2026-09-23）
  cpsx:
    threshold: 3
    above: 三岁以上
    below: 三岁以下
    above_with_test: "3岁以上（要寄第三方测试）"
    below_with_test: "3岁以下（要寄第三方测试）"
    safety_true: ["y", "yes", "true", "是", "1", "✓"]

  # 日期字段
  dates:
    JHRQ: { from: pub_month }
    WCRQ: { mode: today_plus_days, days: 10 }
  # 书脊方向 Drop_SJFX（业务确认 2026-09-23：默认由 CD/KD 比较决定）
  # ERP 合法枚举（assets/erp_form_schema.yaml）：短书脊(0) / 长书脊(1) / 四边裁(2)
  # 本档案只按尺寸判前两种；「四边裁」需要业务明确判据后再加规则。
  spine:
    mode: cd_vs_kd
    long: 长书脊
    short: 短书脊
    four_sided: 四边裁

# ── 5. 邮件规则 ────────────────────────────────────────────
email:
  # 客户单号 KHDH：优先邮件标题/正文，其次附件列
  khdh:
    attachment_keys: ["works_references"]
    # 标题里的单号：`PO 23992` / `Ref: 23992 / 23993` / 裸 5 位数
    subject_patterns:
      - '(?i)\b(?:p\.?o\.?|ref(?:erence)?|order)\s*(?:no\.?|number)?\s*[:#]?\s*(\d{4,6}(?:\s*[/,&]\s*\d{4,6})*)'
      - '\b(\d{5}(?:\s*[/,&]\s*\d{5})*)\b'
    # 正文里的单号：`Works References: 23992 / 23993`
    body_patterns:
      - '(?i)works?\s+references?\s*[:#]?\s*(\d{4,6}(?:\s*[/,&]\s*\d{4,6})*)'
      - '(?i)\bcustomer\s+(?:ref|reference|no)\b\s*[:#]?\s*(\d{4,6}(?:\s*[/,&]\s*\d{4,6})*)'
