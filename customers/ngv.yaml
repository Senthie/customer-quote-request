# ═══════════════════════════════════════════════════════════════
# 客户档案：NGV
#
# status: calibrated ✅ 2026-09-23
#   校准样本：4 份真实报价需求附件（CU26051601-01 / CU26061701 /
#             CU26072301 / CU26072302）+ 对应的 ERP 导出数据。
#
# NGV 的报价文件和 igl 完完全全是两套东西：
#
#   igl = 平铺键值对表（标签与值同列/同行）→ 用 auto_pairs 策略
#   NGV = 德英双语的「enquiry 分区表单」       → 用 section_pairs 策略
#
# NGV 表单的真实结构（4 份样本完全一致，一张 enquiry 工作表 A1:K32）：
#
#     A 列 = 分区名（双语挤在一格：finishing\nVerarbeitung），向下继承
#     B 列 = 标签（extent\nUmfang / paper\nPapier / printing\nDruck）
#     C 列起 = 值
#
#   几个必须知道的坑：
#     1. **同一个标签在不同的分区含义不同** —— content 下的 paper 是内文纸、
#        cover 下的 paper 是封面纸；A 列不切分区，B 列光看字面会串。
#     2. **同一分区里同一个标签会重复** —— content 下 paper 出现两次
#        （内文纸 + 环衬纸）、cover 下 paper/printing/finishing 各出现两次
#        （封面 + 护封）。靠「按行序消费」区分，见 sections: 的排列顺序。
#     3. **A 列有干扰文字** —— ends / Vor-/Nachsatz / jacket / Schutzumschlag
#        不是分区，是行内子说明；档案里不声明它们，引擎就不会切分区。
#     4. **B 列自己可能是值** —— 合并单元格（B1:J1 / B5:J5 / B24:K24 …）
#        里放的是产品名、数量、款数、specials、notes 本身，不是标签。
#        引擎靠「B 列不匹配任何已声明标签 → 该格即值」来处理。
#     5. **端到端实测：4/4 份样本的字段全部落到正确规范键**，
#        tests/test_ngv_profile.py 把这 4 份的行为钉成了回归测试。
# ═══════════════════════════════════════════════════════════════
id: ngv
name: NGV
priority: 50
status: calibrated
notes: >
  NGV（德国/欧洲的 Aldi、Circon 线）的报价需求是德英双语 enquiry 分区表单，
  一张 enquiry 工作表、A1:K32、结构固定。已用 4 份真实附件 + ERP 导出校准。
  交货走 FOB(NGV)（ERP 送货方式下拉里的 FOB(NGV) 就是给这家用的）。

detect:
  filename_keywords:
    - ngv
  label_signatures:
    - "enquiry"
    - "Angebotsfrist"
    - "VK-Verpackung"
    - "Sortierung/VE"
    - "Schutzumschlag"
    # 2026-10-19：NGV 也会发「纯英文 enquiry 邮件」（正文即规格，无 xlsx 附件）。
    # 这类没有 enquiry 表单标签，靠下面这几个正文特征识别（KiK / Ostermalblock 实单）。
    - "price enquiry"
    - "Finished binding"
    - "euroscale"
    - "Technical Specification and Print Runs"
    # 2026-10-29：Lidl 的 IAN 项目也是走 NGV 这条线（VEMAG 接单 → 我们报价），
    # 但附件是 Lidl 自己的 `Anlage_<IAN>` 款量表，上面那些 enquiry 标签一个都没有，
    # 而且是 Rex 内部转发（发件人不是 vemag-medien.de）→ 靠这两行表头/交期行识别。
    - "Overview of Countries, Quantities, and Titles"
    - "Delivery Time: KW"
  min_signature_hits: 2
  # 发件方域名（Naumann & Göbel / VEMAG 出版社集团）；域名 30 分，配合正文特征才稳
  sender_domains:
    - vemag-medien.de
    - naumann-goebel.de
    - ngv.de
  subject_keywords:
    - ngv

# ── 平铺标签别名（section_pairs 之外的后备层）─────────────────────
# 注意：NGV 主要靠下面的 sections: 取值；这里的 fields 仍然要维护，因为
#   * _values_to_the_right 用它判断「这一格是不是标签（不能当值）」；
#   * 校准报告 / unmatched 统计用它；
#   * 万一 NGV 换了平铺写法，auto_pairs 还能兜住。
fields:
  product_name:         ["enquiry", "Anfrage", "title", "Titel"]
  quantity:             ["quantity", "Auflage", "QTY", "Qty"]
  versions:             ["versions", "Versionen"]
  offer_deadline:       ["offer deadline", "Angebotsfrist"]
  files_to_printer:     ["files to printer", "Inhalt an Drucker"]
  delivery_date:        ["ETA w/h", "Lieferung", "ETD"]
  size:                 ["TPS", "Format"]
  extent:               ["extent", "Umfang"]
  text_material:        ["paper", "Papier", "content", "Inhalt"]
  text_printing_spec:   ["printing", "Druck"]
  ends_material:        ["ends", "Vor-/Nachsatz"]
  boards:               ["boards", "MGP"]
  padding:              ["padding", "Wattierung"]
  cover_material:       ["cover", "Umschlag"]
  finishes:             ["finishing", "Veredelung"]
  jacket_material:      ["jacket", "Schutzumschlag"]
  # 纯英文 enquiry 邮件写 `Finished binding:`（KiK / Ostermalblock 实单）
  binding:              ["binding", "finished binding", "bindung fertig"]
  binding_instructions: ["Bindung"]
  back:                 ["back", "Rücken"]
  specials:             ["specials", "Sonstiges"]
  primary_packaging:    ["primary packaging", "VK-Verpackung", "packaging", "verpackung"]
  sticker:              ["sticker", "Aufkleber"]
  packaging_unit:       ["packing unit", "VE"]
  assortment:           ["assortment", "Sortierung/VE"]
  notes:                ["notes", "Bemerkungen"]

# ── 分区表：NGV 表单的按行序「标签 → 规范键」映射 ────────────────
# entries 顺序 = 表单里的行顺序，同一分区内重复标签靠顺序区分。
#   section_value : 该分区第一行的 B 列本身是值
#   label         : B 列是标签，值取右侧
#   value_mode    : first（默认，取第一个非空格）| join（把右侧拼起来）
sections:
  - names: [enquiry, Anfrage]
    entries:
      - { section_value: product_name }
      # ★ 2026-09-24 修正：这一行**是有值的**（C 列 = 报价截止日期），此前被错当成
      #   「纯标题」塞进 ignored_labels → 等于把真实日期藏起来，main.py 永远拿不到
      #   offer_deadline，业务要的「过期提醒」也就无从谈起。
      #   实测 5/5 份样本都有值：CU26051601-01=2026-05-26 / CU26061701=2026-06-17 /
      #   CU26072301=2026-07-27 / CU26072302=2026-07-27 / PR-00091345=2026-06-26。
      #   值形态：`2026-06-26 00:00:00`（Excel 日期），不给 format → 原样落规范键，
      #   由 main.py「报价截止日期检查」段用 parse_date_to_datestr 标准化后比较。
      - { label: "offer deadline", key: offer_deadline }

  - names: [schedule, Termine]
    entries:
      # 2025 版表单把 `offer deadline` 放在 schedule 里（2026 版在 enquiry 里）。
      # 两处都声明 → 哪一版都能取到；values.setdefault 先到先得。放最前是为了
      # 2025 版能匹配到（自适应模式找不到标签时不推进游标，顺序已无副作用）。
      - { label: "offer deadline",   key: offer_deadline }
      - { label: "files to printer", key: files_to_printer }
      - { label: "ETA w/h",          key: delivery_date }

  - names: [quantity, Auflage]
    entries:
      - { section_value: quantity }

  - names: [versions, Versionen]
    entries:
      # B6 是值（"12 titles, 8 countries, 5 languages"）；B7 的 TPS/Format 是标签。
      - { section_value: versions }
      # 尺寸必须整行拼：`145 | x | 210 | mm | portrait` 只取第一格只剩 145。
      - { label: "TPS", key: size, value_mode: run }

  - names: [content, Inhalt]
    entries:
      # 2025 版表单把 TPS 放在 content 分区（2026 版在 versions 分区）→ 两处都声明。
      - { label: "TPS",      key: size,           value_mode: run }   # 145 | x | 210 | mm | portrait
      - { label: "extent",   key: extent,         value_mode: run }   # 36 pp + Cover
      - { label: "paper",    key: text_material,  value_mode: run }   # 120 gsm woodfree…
      - { label: "printing", key: text_printing_spec, value_mode: run }
      # ↓ 这两行是环衬（A 列的 ends / Vor-/Nachsatz 不切分区，靠行序认）
      - { label: "paper",    key: ends_material,  value_mode: run }
      - { label: "printing", key: ends_printing_spec, value_mode: run }
      - { label: "boards",   key: boards,         value_mode: run }
      - { label: "padding",  key: padding,        value_mode: run }

  - names: [cover, Umschlag]
    entries:
      - { label: "paper",     key: cover_material,        value_mode: run }
      - { label: "printing",  key: cover_printing_spec,   value_mode: run }
      - { label: "finishing", key: finishes,              value_mode: run }
      # ↓ 这三行是护封（jacket / Schutzumschlag 同样不切分区）
      - { label: "paper",     key: jacket_material,       value_mode: run }
      - { label: "printing",  key: jacket_printing_spec,  value_mode: run }
      - { label: "finishing", key: jacket_finishes,       value_mode: run }
      # binding 行在 cover 分区里（A21 为空），值是 Softcover / ridged box / see below
      # value_continue（2026-10-29）：2025 版表单的装订工艺**跨两行** ——
      #   C20=`Flexcover` / C21=`thread-stitching`（C21 那行 B 列是空的）
      #   → 只取第一格会把「锁线」丢掉，CPMS 的装订段就写不全。
      - { label: "binding",   key: binding, value_continue: true }

  - names: [finishing, Verarbeitung]
    entries:
      # Bindung 行要整行拼：`perfect binding | 210 | mm side`
      # 左值给『装订工艺』，右值 `210 mm side` 由 rules.scan 捞出装订边。
      # value_continue：2025 版表单把装订工艺写成两行（`C20=Flexcover` / `C21=thread-stitching`，
      # 第二行 B 列空），只取第一格会丢掉「锁线」→ CPMS 装订段写不全。
      - { label: "Bindung", key: binding_instructions, value_mode: run, value_continue: true }
      - { label: "back",    key: back }

  - names: [specials, Sonstiges]
    entries:
      # B24 是 specials 正文（长文本），因为超过 max_label_len 不会被当成标签。
      - { section_value: specials }
      - { label: "primary packaging", key: primary_packaging }
      - { label: "sticker",           key: sticker }

  - names: [packaging, Verpackung]
    entries:
      # 2025 版表单的包装分区多两行：`shrinkwrapping`（是/否）与 `sticker`（贴纸内容），
      # 2026 版把它们并进 specials 分区 → 两处都声明，哪版都能取到。
      - { label: "shrinkwrapping", key: primary_packaging }
      - { label: "sticker",        key: sticker }
      - { label: "packing unit", key: packaging_unit }
      - { label: "assortment",   key: assortment }
      - { label: "specials",     key: packaging_specials }

  - names: [notes, Bemerkungen]
    entries:
      # 尾部三行都是「B 列即值」：备注正文 / 客户联系人 / 页脚数字（4 份样本里
      # 分别是 35/35/12/12，语义未明 → 明确忽略，靠 section_value: null 吃掉）。
      - { section_value: notes }
      - { section_value: contact }
      - { section_value: null }

# ── 纯标签（表单栏目标题，双语挤在一格）─────────────────────────────
# ★ 2026-09-24 从 extras: 拆出来（实测踩过）：它们是**栏目标题、不含值**，
#   塞在 extras 里会同时踩两个坑 ——
#     ① extras_found（「CPMS 素材」）里出现 `TPS\nFormat`、`back\nRücken` 这种，
#        看起来像漏了信息，实际只是标题格；
#     ② 校准报告会把它们算成「认不出的标签」而被登记成 extras 掩盖掉。
#   现在登记为 ignored_labels：两处都不再出现。**值**本身由 sections: 与 rules.scan
#   正常抽取（offer_deadline / delivery_date / files_to_printer / …）。
ignored_labels:
  # ⚠️ "offer deadline" / "Angebotsfrist" **不在这里** —— 它是有值标签（见 sections
  #    的 enquiry），误登记为纯标题会静默丢值（2026-09-24 踩过，已回归测试钉住）。
  - "schedule"
  - "Termine"
  - "files to printer"
  - "ETA w/h"
  - "Lieferung"
  - "versions"
  - "Versionen"
  - "ends"
  - "Vor-/Nachsatz"
  - "boards"
  - "MGP"
  - "padding"
  - "Wattierung"
  - "jacket"
  - "Schutzumschlag"
  - "back"
  - "Rücken"
  - "primary packaging"
  - "VK-Verpackung"
  - "sticker"
  - "Aufkleber"
  - "packing unit"
  - "VE"
  - "assortment"
  - "Sortierung/VE"
  - "specials"
  - "Sonstiges"
  - "notes"
  - "Bemerkungen"
  - "TPS"
  - "Format"
  # 2025 版表单的包装分区多这两行：前者已映射到 primary_packaging、
  # 后者（每箱本数）ERP 无对应字段 → 登记为「已知标题」，不再进未识别清单。
  - "shrinkwrapping"
  - "Einschweißung"
  - "copies per carton"
  - "Expl. pro Karton"
  - "quantity"
  - "Auflage"

# ── 非 ERP 字段但必须体现在 CPMS 里 ────────────────────────────────
# NGV 的表单里**没有**这类栏位：非 ERP 的内容全在 `specials`（长文本）与
# `packing specials` 里，它们已经作为规范键抽出来了，agent 写 CPMS 时读原文即可。
extras: []

# ── ERP 固定值（NGV 专属；已用 4 份 ERP 导出核对）─────────────────
erp_fixed:
  # ── 客户偏好表（机器读的部分；人看的见 preferences: 段）─────────────
  # 业务拍板 2026-09-24 的第二批口径都在这几条里：
  #   * PXH   → **显式留空**（模板默认是 1，必须在这里清掉；排序号由 ERP/业务侧填）
  #   * CPDL  → 「书版」是唯一合法值，照填；4 份导出 3 份空是业务核对时补
  #   * SFYPJ / Remark1（是否有配件 / 配件描述）→ 已从偏好表**删除**：
  #     推不出就留空（业务 2026-09-24 拍板），不再写死「否」——
  #     CU26072301 就有配件，写死「否」是错的。
  # ★ 2026-10-30 业务把这批「常用值」重新定性为**默认值**（见下面 erp_defaults）：
  #   客户询价里写明了就听客户的，没写才用默认 —— 所以 BZFS / TBLX / SHFS / BZ
  #   从这一段挪走了（留在 erp_fixed 就等于无条件覆盖，会把客户写明的值盖掉）。
  CPDL: 书版
  # 业务员（YWY）：业务 2026-10-20 明确 —— **必须填 `KM`**，
  # 「这是我们区分谁生成的单」：KM = 脚本/agent 产出的标记（业务手写的单会带本人姓名，
  # 如「陈纯」）。⚠️ 别当「ERP 自动带出」清空，也别换成业务员姓名（1.0.34 之所以
  # 把 KM 落在这里，就是让它有处可去；2026-10-20 复核确认这是对的）。
  # 同时它**不是** CPMC 的前缀（那是旧口径，已作废）。
  YWY: KM
  PXH: ""                 # 显式留空（见上）
  # YYS 也显式留空：实际值由 rules.versions 决定（单语言 → 空、提取不到 → 0、
  # 多语言 → 该数字），模板/公共默认的 1 在这里清掉，免得漏掉任何一种情况时
  # 悄悄落成 1（那是错的：这个客户 4 份导出里 YYS 要么空要么是真实语言数）。
  YYS: ""
  # NGV 每单固定的第三方检测清单（3 份 v2 导出逐字相同、共 378 字符 → 属该客户常量）
  # ⚠️ 必须**逐字照抄** ERP 原文，包括：
  #    * `monochloroo-` 的双 o（ERP 里的既有错别字 —— 改成单 o 会让每单都产生差异）
  #    * `(MCPD).Colour` 之间没有空格、后半段各分句之间也没有空格
  #    * `foam` 前有一处换行
  #    用 `|-` 保留内部换行、去掉结尾换行；用 `>-` 会把换行折成空格 → 与 ERP 不符。
  Remark4: |-
    1、氯丙醇化合物1,3-dichloro-2-propanol (DCP) 和 monochloroo-1,2-propanediol (MCPD).Colour Fastness to Perspiration & Saliva 2、EN71:part1,part2,part3 , part9。REACH:Cadmium ,Lead, Phthalates, PAHs,Nickel Release,Organotin compounds,甲醛 ,AZO dyes,REACH SVHC，RoHS，EN62115，EU - TCEP, TCPP & TDCP of 2014/79/EU,DIN 53160 (grade 5),Aniline,Reach Formamide + flame retardants 2014/79/EU for
    foam

# ── ERP 客户默认值（NGV 专属；业务 2026-10-30 拍板的 11 条）──────────
# 口径（业务原话）：「如果客户的询价文件中没有提到，就使用默认值；客户写了就听客户的」。
# 与上面 erp_fixed 的区别：这一层**只补空**（main.py step13b，跑在所有推导之后），
# 客户/上游给了值就保留。取值全部按 assets/erp_form_schema.yaml 的**下拉 label 逐字**
# 对照过（半角括号、全角字符都不能改）：
#   ZBLX 002 A=B双坑纸板 / ZXLB 008 普通纸箱 / ZXFS 0 平装 / DKMC 02 B3B坑纸板 /
#   YSLX 015 FOB(拼柜) / SHFS FOB(NGV) / TBLX 06 不打卡板 / BZ 02 美元
# ⚠️ SHDQ（送货地区）是**联动下拉**：可选值由 YSLX（运输类型）决定 —— 8 种外贸运输类型
#    共用 FOB盐田(普通)/香港/FOB(美加线)/FOB(NGV)/DPU/日本（Tokyo）/FOB蛇口（业务 2026-10-30
#    给出的分组关系，落在 assets/erp_form_schema.yaml 的 SHDQ.linked_to）。
#    NGV 用 FOB(拼柜) → 落 FOB(NGV) 在同组内，validate_result 跨字段校验会守住这件事；
#    改这两个值时两个字段要一起看。
erp_defaults:
  BZFS: 纸箱包装          # 包装方式（4 份导出逐字相同）
  TBLX: 不打卡板          # 台板类型（导出里的 code 06）
  BZ: 美元                # 客户目标价币种（长期口径；询价写别的币种就听客户的）
  SHFS: FOB(NGV)          # 送货方式（半角括号，ERP 下拉原文）
  ZXLB: 普通纸箱          # 纸箱类别（导出里是空 → 之前不填，2026-10-30 起补默认）
  ZBLX: A=B双坑纸板       # 纸板类型（2026-10-30 改口径：选枚举 002；历史导出里的
                          #   B3B普通芯 不在下拉枚举内，属 ERP 侧旧数据）
  ZXFS: 平装              # 装箱方式
  DKMC: B3B坑纸板         # 底卡名称（注意在 DKMC 下拉里，不在 ZBLX）
  YSLX: FOB(拼柜)         # 运输类型（半角括号；历史导出里是 FOB(底价) 或空）
  SHDQ: FOB(NGV)          # 送货地区（联动下拉，无静态枚举）
  chkBSYTB: true          # 不使用台板（勾选框 → JSON true）

# ── 客户偏好表（业务 2026-09-24 提出：长期合作客户有稳定口径，要一眼看全、快速填写）
# ───────────────────────────────────────────────────────────────────
# 口径规则（两种，都必须显式声明，不许留空白让人猜）：
#   value 非空 → 落库这个值（= erp_fixed[field]，有测试校验两者一致）
#   value 空   → **显式留空**：该客户这个字段就该空着，推不出来不猜
#                （模板若自带默认值，档案必须写成 '' 才能真正清掉）
# 与 erp_fixed 的分工：preferences 是**给人看的**（含依据，供业务快速核对/填写）；
# erp_fixed 是**机器读的**落库值。改口径改两处，测试会拦住不一致。
# 依据来自权威 ERP 导出（4 份）+ 业务逐条拍板。
preferences:
  - { field: CPDL,   value: "书版",   reason: "产品大类只有『书版』一个合法值（导出 3 空 1 有是业务核对时补）" }
  # ── 以下 11 条 = 业务 2026-10-30 拍板的「常用值」，口径是**默认值**：
  #    询价文件里没提到才补，客户写明了就听客户的（落库在 erp_defaults 那一段）
  - { field: BZ,     value: "美元",   reason: "客户目标价一律美元（长期口径）；询价写别的币种就听客户的" }
  - { field: SHFS,   value: "FOB(NGV)", reason: "送货方式默认 FOB(NGV)（半角括号，ERP 下拉原文）" }
  - { field: BZFS,   value: "纸箱包装", reason: "包装方式默认纸箱包装（4 份导出逐字相同）" }
  - { field: TBLX,   value: "不打卡板", reason: "台板类型默认不打卡板（ERP 枚举 code 06）" }
  - { field: ZXLB,   value: "普通纸箱", reason: "纸箱类别默认普通纸箱（枚举 code 008；历史导出为空）" }
  - { field: ZBLX,   value: "A=B双坑纸板", reason: "纸板类型默认 A=B双坑纸板（枚举 code 002，2026-10-30 定；历史导出的 B3B普通芯 不在下拉里）" }
  - { field: ZXFS,   value: "平装",   reason: "装箱方式默认平装（枚举 code 0；历史导出为空）" }
  - { field: DKMC,   value: "B3B坑纸板", reason: "底卡名称默认 B3B坑纸板（DKMC 枚举 code 02；历史导出为空）" }
  - { field: YSLX,   value: "FOB(拼柜)", reason: "运输类型默认 FOB(拼柜)（枚举 code 015，2026-10-30 定；历史导出是 FOB(底价) 或空）" }
  - { field: SHDQ,   value: "FOB(NGV)", reason: "送货地区默认 FOB(NGV)（联动下拉、无静态枚举，取值由业务给定；历史导出为空）" }
  - { field: chkBSYTB, value: true,   reason: "不使用台板默认勾选（历史导出是 false，2026-10-30 改）" }
  # ── 以下仍是「留空即正确」的字段（推不出来就不猜）──────────────────
  - { field: PXH,    value: "",       reason: "排序号由 ERP/业务侧填 —— 导出 4 份里 3 空 1 填 1，模板默认 1 必须清掉" }
  - { field: SFYPJ,  value: "",       reason: "是否有配件：改由 rules.accessories 推导（有 → true，无 → false），档案不再写死空值" }
  - { field: Remark1, value: "",      reason: "配件描述随 SFYPJ；推不出就留空" }
  - { field: Remark3, value: "",      reason: "修改记录：我们产出的是**第一版**报价，不存在修改记录（2026-09-24 拍板）" }
  - { field: FSCMC,  value: "",       reason: "多材质混用时该填哪个推不出来 → 留空（rules.scan 的 fsc 已设 unique: true）" }
  - { field: JHRQ,   value: "",       reason: "交货日期报价阶段不落库（4 份导出全空，附件给了 ETA 也不填）" }
  - { field: WCRQ,   value: "",       reason: "预计下单日期不落库（4 份导出全空，不用『今天+10 天』）" }
  - { field: YYS,    value: "",       reason: "单语言不落库；提取不到语言数则落 0（rules.versions.when_missing）" }

rules:
  # ── 允许为空的字段（豁免 ERP 字典的通用必填校验）─────────────────
  # 2026-09-24：字典里 KHDH（客户单号）是业务必填，Drop_SJFX 是建议填写，
  # 但 NGV 的报价阶段本来就取不到 —— 4 份权威 ERP 导出里 KHDH 全空；
  # 套装单（28/29 类）没有书脊方向。不豁免就会每单报假 error，淹没真问题。
  # ★ 同日业务补拍：**KHDDH（香港单号）默认就是空** —— 附件文件名里带
  #   「香港单号 CU…」时由 rules.scan 扫出来落库，没带就留空，不算缺陷。
  #   （PR-00091345 文件名只有 PR 号，没有 CU 号 → KHDDH 空是预期结果。）
  required_empty: [KHDH, KHDDH, Drop_SJFX]
  # ── 口径例外：业务拍板用、但**不在 ERP 下拉枚举里**的取值 ─────────────
  # 【本客户当前**没有**需要声明的条目 —— 这是有意的，别看漏】
  #   1.0.21 曾在这里声明 `CPSX: 无`（因为「无」不在 ERP 枚举里，硬校验会每单报 error）。
  #   1.0.23 业务给了更干净的解法：「『无』使用 json 里的 null 填充」
  #   → 走全局 rules.null_values（_defaults.yaml）把「无」翻成 JSON null，
  #     null 属**空值**，压根不触发枚举校验 → 本条声明随之删除。
  #   机制本身保留（erp_schema.declared_exceptions + validate_result(allow_values=)），
  #   将来若真出现「业务要用枚举外的字符串值」，在这里加 {field, value, reason} 即可。
  enum_exceptions: []
  layout:
    # NGV 只用 section_pairs。**不要**加 auto_pairs —— NGV 表里 `paper`
    # 这类标签在 B 列反复出现，平铺策略会抓出一堆错值（校准前实测：
    # format 变成 145、series_name 变成签字人 Ebers, Lea）。
    # `lidl_anlage`（2026-10-29 新增）专吃 Lidl 发来的 `Anlage_<IAN>` 多国别款量表：
    # 那种表一行一款一市场，数量/语言码/结构全在固定列上，section_pairs 完全抽不到
    # （实测只抽出一个 `quantity: 'Spaltenbeschriftungen'` 的垃圾值）。
    strategies: [lidl_anlage, section_pairs]
    section_col: 0          # A 列 = 分区
    label_col: 1            # B 列 = 标签
    first_value_col: 2      # C 列起 = 值
    # ★ 2026-10-29（PR-00078025 / 100 Dinge 实单）：NGV 的 enquiry 表单有**两个版本**，
    #   行顺序不同 —— 严格按行号对齐会整段错位（19 条 WARN、CD/KD=0、纸张/印色全丢）。
    #   自适应 = 分区内按声明标签向后找行：多行/少行/换位置都能对上，
    #   找不到的字段留空（绝不硬取隔壁字段的值）。2026 版样本回归见 test_ngv_profile。
    sections_adaptive: true
    max_label_len: 60       # >60 字符的单元格一律不当标签（保护 B24 的长文本）
    # ★ Lidl `Anlage_<IAN>` 表（2026-10-29 实单 IAN 574237 / 574239 校准）：
    #   H2 = `IAN 574237 K Motiv Puzzlebücher Overview of Countries, Quantities, and Titles`
    #   A 列国别分区标题（`Griechenland:` / `Online Shop: DE unmixed`），
    #   数据行 F=article、H=title、J=quantity/title、E=语言码、O=尺寸、P=结构、S=材质。
    #   列号是 0 基（pandas 矩阵下标），与 Excel 列字母差 1。
    lidl_anlage:
      enabled: true
      sheet_prefix: "Anlage"          # Pivot / Tabelle1 是同一批数据的另一种排布，跳过
      title_pattern: "IAN\\s*(\\d{6})\\s*(.*?)\\s*Overview"
      delivery_label: "Delivery Time"
      article_pattern: "^\\d{6}_[A-Z]$"
      columns:
        pub: 3        # D 出版社
        lang: 4       # E 语言码（20/ 德国 22/ 法国 …）
        art: 5        # F article
        title: 7      # H title /style
        assort: 8     # I assortiment
        qty: 9        # J quantity / title
        weight: 13    # N weight
        dim: 14       # O dimension
        tech: 15      # P quality / technical specifications
        brand: 16     # Q Brand reference
        material: 17  # R material
        spec: 18      # S material（含材质与克重明细）
        color: 19     # T color
  size:
    unit: mm
    # TPS 是「先宽后高」（148 x 210 portrait）。
    # ★ 2026-10-21 业务改口径（取代 2026-10-20 的「长边进 CD」）：
    #   **默认顺序 = 长 x 宽 x 高，按书写顺序依次落 CD / KD / GD，不比较长短边。**
    #   依据：LG26090401 真实录入 `240 x 330` → CD=240 / KD=330。
    #   所以 148x210 → CD=148 / KD=210（旧的 `long_first: true` 已删除）。
    order: [CD, KD]
    # 套装（盒子）录系统尺寸一律写 0/0/0 —— 业务决定（2026-09-24）。
    # 附件的 TPS 是盒内单件的尺寸（CU26061701 是 160x104 的卡片、CU26072301 是
    # 100x155 的明信片），不采用；ERP 记录里三单套装全是 0/0/0。
    zero_tops: [套装]
  # NGV 的 ERP 导出里 GD（高）恒为 0：书本厚度只写在 CPMS 里，不进 ERP 规格。
  # 所以关掉「按页数+纸张推算厚度」那一步（否则会算出 2.55 / 10.8）。
  thickness:
    enabled: false
  # NGV 的数量是**单一总数**（不是 igl 那种 3k/5k/7.5k 阶梯），落 CPSL1
  quantity:
    mode: single            # single = 一个总数 | tiers = 多档位
  # ── 是否有配件 SFYPJ（布尔，业务 2026-10-21 拍板：有 → true，无 → false）──
  # 为什么按关键词而不是「specials 非空」：NGV 的 `specials/Sonstiges` 还装着
  #   圆角、光油、语言分配这类**非配件**说明 —— LG26090401 的 specials 是
  #   `rounded corners / glossy print-varnish`，按非空判会把「无配件」错判成 true。
  # 校准依据（4 份权威导出 + 2 份真实录入）：
  #   CU26072301（Postkarten-Box + Aufsteller）→ 是／true
  #   CU26072401（2-way sequin patch 粘前封面）→ 是／true
  #   CU26051601-01（内文含贴纸页）、CU26061701（卡片+盒）、CU26072302 → 否／false
  accessories:
    enabled: true
    source_keys: [specials, sticker, assembling, accessories]
    keywords:
      - aufsteller        # 立座（CU26072301 的 stand）
      - stand
      - sequin            # 亮片贴片（CU26072401）
      - patch
      - 贴片
      - 亮片
      - 磁石
      - 立牌
      - 发声
      - 音乐
      - 布袋
      - 手偶
      - 玩具
      - 拉链
      - 丝带
  versions:
    title_pattern: "(\\d+)\\s*titles?"
    language_pattern: "(\\d+)\\s*languages?"
    # 单语言不落库 —— 业务决定（2026-09-24）。
    # 依据：附件写 `4 titles, 1 language` 的两单（CU26072301 / CU26072302），
    # ERP 里 YYS 都是空的；写 `12 titles, 8 countries, 5 languages` 的
    # CU26061701 才是 5。所以「1」要留空，不落成 1。
    empty_when_single: true
    # 提取不到语言数时落 0 —— 业务决定（2026-09-24）：
    # 「客户的邮件可能后面补充了某些内容，但是附件没有更新」→ 0 是「待业务核对」的信号，
    # 不许拿档案固定值 1 冒充，也不许留空（留空与「单语言留空」撞车、分不清）。
    # 实测：CU26051601-01 附件只写 `8 titles`（没有语言数），ERP 里是 3 —— 那个 3
    # 只能来自邮件/历史单，附件推不出来，所以我们落 0。
    when_missing: 0
  materials:
    text:
      default: 书纸
      map:
        - { match: "woodfree|uncoated|书纸|胶版|munk|蒙肯", page_style: 书纸 }
        - { match: "art ?card|art ?paper|c1s|c2s|铜版|光粉|粉卡|白卡", page_style: 光粉纸 }
    cover:
      default: 光粉纸
      map:
        - { match: "c1s|art ?card|artboard|光粉|粉卡|白卡|卡纸", page_style: 光粉纸 }
        - { match: "c2s|art ?paper|铜版", page_style: 紫罗兰高压双铜 }
  # 装订方式 ZDFS：要看 binding（Softcover/ridged box）**和** Bindung
  # （safety saddle-stitched / perfect binding / lose）两行才能定。
  # 顺序即优先级：'safety saddle-stitched' 必须排在 'lose' 前面。
  binding:
    enabled: true
    default: ""
    match_keys: [binding, binding_instructions]
    map:
      "safety saddle-stitched": 骑马钉      # CU26051601-01 → ERP 骑马钉 ✓
      # ★ 2026-10-29（A00152 / CU26093001-01 option B）客户写的是
      #   `softcover, safety saddle-stitching`（-ing 形式），旧 key 是 -ed → 不命中，
      #   ZDFS 落空。两种时态都要认。
      "safety saddle-stitching": 骑马钉
      "saddle-stitching": 骑马钉
      "saddle stitch": 骑马钉
      "perfect binding": 胶装/PAD书          # CU26072302 → ERP 胶装/PAD书 ✓
      "open pad": 胶装/PAD书
      "ridged box": 套装                     # CU26061701 → ERP 套装 ✓
      "lose": 套装
      "hardcover": 精装书
      # ★ 2026-10-29 Rossmann 半返单（PO 15910）实单：
      #   `flexocover, thread-stitching, square back, glue-on end sheet, case-in book block`
      #   —— `flexocover`（软封套硬壳 = 假精装）与 `case-in`（书芯装进皮壳）都不在旧表里，
      #   只有 `thread-stitching` 能认，而它单独出现时是「车线」不是「精装」→ ZDFS 会落空。
      #   历史权威单 CU26100601（同一 Rossmann 项目）ZDFS=精装书。
      #   顺序要紧：flexocover / case-in 必须排在通用词之前，命不中才往下走。
      "flexocover": 精装书
      "flexcover": 精装书        # 客户也写 Flexcover（少一个 o）
      "flexo cover": 精装书
      "case-in": 精装书
      "case in book block": 精装书
      # 2026-09-24 新增（PR-00091345 那单实测：binding=Softcover + Bindung=Wire-O Binding）：
      # 蛇圈/线圈类。ERP 合法值是「线圈书」（不是「蛇圈书」—— 那是 CPLB 树里的类别名）。
      "wire-o": 线圈书
      "wire o": 线圈书
      "wiro": 线圈书
      "spiral": 线圈书
      "coil": 线圈书
  # 单位 DWMC：套装类用「套」，书本用「本」（与 ERP 导出核对过）
  unit:
    default: 本
    map:
      - { cplb_top: 套装, unit: 套 }
  # 产品类别 CPLB：NGV 的表单里没有类别栏，只能由装订/结构推断到树节点。
  # ★ 顺序 = 优先级，**先认装订方式，再用结构（冲形状/PAD）细分**（2026-10-20 重排）。
  #   依据：assets/cplb_tree.yaml 的判定路径 ——
  #     第 2 问「装订方式」→ 23 胶装 / 24 骑钉 / 26 线圈 / 22 精装 …
  #     第 5 问「整书冲形状」→ 取同装订的「冲形状 XXX」（如 23.03）
  #     第 6 问（胶装特例）「PAD 头」→ 23.05 / 23.06
  #   ⚠️ 2026-10-20 修的真 bug（CU26070802 暴露）：旧规则把
  #     `perfect\s*binding|open\s*pad|pad\s*bind` 一律映射到 23.06「PAD头书(全封面)」，
  #     于是「perfect binding at the top」被判成 PAD 头书：
  #       ① perfect binding 只是**装订方式**（无线胶装），不是产品形态；
  #       ② `at the top` 的 top 被误读成 PAD 的「头」（那是装订边位置）；
  #       ③ 整书冲形状（shape die-cutting egg form）根本没进判定 → 23.03 才是对的。
  #     真单 BJXQ260708007（KiK Ostermalblock）的 ERP 类别就是「冲形状无线胶装书」。
  #   PAD头书 23.05/23.06 的前提是「封面大于内文 / 露 PAD 头 / 需二次上胶装」——
  #   这条只能人工判，客户文件里常常只写 perfect binding（CU26072302 就是），
  #   所以脚本落到 23.01 并打 WARN 交业务改，绝不主动猜 PAD。
  cplb:
    match_keys: [binding, binding_instructions, specials, text_material, product_name]
    map:
      - { match: "safety\\s*saddle|saddle[- ]stitch", node: "24.03" }   # 贴纸骑钉书
      - { match: "wire[- ]?o|wiro|YO书|双线圈", node: "26.07" }          # 普通YO书（双线圈）
      - { match: "spiral|蛇圈|单线圈|线圈", node: "26.01" }              # 普通蛇圈书
      # 假精装书（22.03，树里判据「软封套硬壳，成本低于精装」）：
      #   Rossmann 半返单实单写 `flexocover`（客户德语习惯写法），旧 map 无此词
      #   → 落 32.00;其他。历史单 CU26100601 的 CPLB 就是「假精装书」。
      #   必须排在 case bound / 精装 之前：`case-in book block` 含 case 但不含 `case bound`，
      #   所以不会互抢，但 flexocover 与精装类同现时以「假精装」为准。
      - { match: "flex\\s*o?\\s*cover|flexibond|假精装|半精装", node: "22.03" }
      - { match: "case\\s*bound|hardcover|精装", node: "22.02" }          # 精装书
      # BB书（纸板书）：封面无灰板 → 27.01 普通BB书。放在精装之后，硬封优先。
      #   实测（LG26090401，2026-10-21）：附件写 `binding: board book` /
      #   `board book binding`，旧 map 没有这条 → 落成 32.00;其他（业务真单是「普通BB书」）。
      #   德语同义：Pappbilderbuch / Pappband。
      - { match: "board\\s*book|pappbilderbuch|pappband|纸板书", node: "27.01" }
      - { match: "ridged?\\s*box|folded\\s*box|\\blose\\b", node: "29.04" }  # 其它套装
      # PAD 头书：**必须原文出现 PAD 字样**（open pad / pad binding / 露 PAD 头）。
      # 有封面的 PAD 头书（二次上胶装）→ 23.06；其余 PAD → 23.05。
      - { match: "pad\\s*(?:head|头)|露\\s*PAD|PAD\\s*头|open\\s*pad", node: "23.06" }
      # 整书冲形状 + 胶装 → 冲形状无线胶装书（本单 KiK 蛋形冲 = 23.03）
      - { match: "(?:shape\\s*die|die[- ]?cut|egg\\s*form|冲形状|啤\\s*形状)",
          node: "23.03", requires: "perfect\\s*binding|softcover|open\\s*pad|无线胶装|胶装" }
      - { match: "perfect\\s*binding|softcover|无线胶装", node: "23.01" }  # 普通无线胶装书
  product_category:
    fallback: "32.00;其他"
  # 产品名称 CPMC：NGV 的 CPMC 是人写的复合串（权威导出 4 份实测）：
  #     `Kathrin/Aldi 24PP内文 + 12PP贴纸 贴纸骑马钉书（有贴纸）/price enquiry. A00112 License Sticker Books 2(FSC Mix)`
  #     `Kathrin/Aldi 揭盖卡盒卡片填色套装 其他套装/price enquiry for ALDI. Colouring Cards Aldi Süd(FSC Mix)`
  #     `Corinna/Aldi A款 卡片套装 其他套装/Type A - A00125 Post- und Klappkarten - Postkarten-Box mit Aufsteller (4 titles)(FSC Mix)`
  #     `Corinna/Aldi B款 开脊PAD头书/Type B - A00125 Post- und Klappkarten - Klappkarten-Buch (4 titles)(FSC Mix)`
  #   → 结构 = `<业务员>/Aldi <中文品名>[ <中文类别>]/<英文品名原文>(<FSC>)`
  #   * 业务员：**KM**（业务 2026-09-24 拍板；此前留【业务员待填】是错的，被测试拦住）
  #   * 中文品名：只能人工拟（含款别时可写「A款 卡片套装」）→ needs_agent，脚本给占位
  #   * 中文类别：用 CPLB 树里的类别名（注意导出里人写的是「其他套装」而树里是「其它套装」——
  #     人写的部分本来就不严格，我们统一取树里的权威名，差异记在 ngv.erp_diff.json）
  # ★ 业务 2026-09-24（第二批）：「将 CPMC 修改为存英文表达，使用 CPMC_ZH 来标注中文表达」
  #   → CPMC 只留**英文**（业务员/Aldi + 英文品名原文 + FSC），
  #     中文表达（就是上面那条历史写法）落内部字段 **CPMC_ZH**（见
  #     assets/internal_export_fields.yaml）。main.py 会检查 CPMC 里没有中文字符。
  # ★ 业务 2026-10-19 更正（实单 CU26070802）：**CPMC 就是产品名称**，
  #   由 agent 从客户文件里译出来；业务员（KM）落 `YWY`，不进 CPMC。
  #   品牌（Aldi/KiK）、类别、FSC 也都不再拼进产品名 —— 它们各有自己的字段。
  cpmc:
    salesperson: KM        # 落 YWY（见 erp_fixed），不再作 CPMC 前缀
    allow_chinese: true    # CPMC 允许中文（产品名的中文译名）
    # 中文品名是**每单**的（不是客户常量）→ 这个开关给「品名稳定」的客户偶尔用；
    # NGV 保持空，由 agent 交付前直接改产物 JSON 里的 CPMC_ZH（脚本会给可见占位符）。
    cn_name: ""
    # CPMC / CPMC_ZH 都只放**产品名称**。脚本不会翻译 → 两侧都给占位符，
    # 交付前由 agent 从客户文件译出中文名并同时改这两个字段（严格模式：不许猜）。
    template: "【中文品名待定】"
    zh_template: "【中文品名待定】"
    needs_agent: true
  # 产品英文名 ECPMC（ERP 独立字段 `txtECPMC`，label「产品英文名」）：
  # ★ 业务 2026-10-20 指出：CPMS 有了、ECPMC 却空着 —— 它是**必看的品名字段**。
  # ★★ 业务 2026-10-21 澄清口径：ECPMC = **报价的原始产品名**，不限于英文 ——
  #    德文 `Malbücher`、日文、法文一律**照抄原文**，不许因为「不是英文」就留空
  #    （ERP 字段名叫「产品英文名」是历史命名，口径以业务这句为准）。
  #    取值 = 客户文件里的产品名原文（`Title: Ostermalblock` → `Ostermalblock`），
  #   **照抄，不翻译、不拼类别、不带 FSC**（那些是 CPMC 的事）。
  #   脚本取不到时（纯文本邮件没有 `Title:` 标签）→ **由 agent 从原文照抄补上**，
  #   `cpms_todo.py` 会把「档案声明了 ecpmc 但字段空着」列为待办。
  #   NGV 的品名在规范键 product_name；取不到再退回 series_name。
  ecpmc:
    source_keys: [product_name, series_name]
    # ★ 1.0.49（2026-10-21，LG26090401 实测）：文件夹 / 压缩包单元里的「规格样张」
    #    只覆盖**其中一款**，它的品名不是这份报价的品名 —— 样张写
    #    `Wimmelbuch Peppa Pig`，而本单是 10 款的 `Wimmelbücher (Winter)`。
    #    所以单元里 ≥2 个参考文件时，品名取**订单标题**（邮件 subject）。
    #    单文件单元不受影响（那份文件就是本单本身）→ 照旧取 product_name。
    prefer_email_subject_when_unit: true
    # 标题开头的项目号要去掉：`A00142 Wimmelbücher (Winter)` → `Wimmelbücher (Winter)`
    subject_strip_pattern: "^[A-Za-z]{1,3}\\d{3,6}[\\s._-]+"
  # 产品属性 CPSX：NGV 的表单里**没有**年龄段/安全检查栏 → 推不出来时的口径由业务定：
  #   业务 2026-09-24：「CPSX 如果没有获取到就显示**无**」
  #   同日补充：「『无』使用 json 里的 null 填充」→ 产物里落的是 **null**（不是字符串「无」）。
  # 所以这条链路是：档案写 when_missing: 无 → main.py 的口径转换（rules.null_values）
  # 把「无」翻成 JSON null → top 层看是空值，与 4 份权威导出一致（它们 CPSX 都是 None）。
  # ⚠️ 正因为落 null（空值），**不再需要** rules.enum_exceptions：null 不触发枚举校验。
  #    （1.0.21 曾用 enum_exceptions 声明「无」为口径例外，1.0.23 起已删。）
  cpsx:
    threshold: 3
    above: 三岁以上
    below: 三岁以下
    above_with_test: "3岁以上（要寄第三方测试）"
    below_with_test: "3岁以下（要寄第三方测试）"
    safety_true: ["y", "yes", "true", "是", "1", "✓"]
    when_missing: 无
  dates:
    # 交货日期 / 预计下单日期：业务决定（2026-09-24）**都不落库**（保持空）。
    # 依据：4 份 ERP 导出 JHRQ 与 WCRQ 全为空 —— 即使附件给了 ETA
    # （CU26061701 写 2027-03-15、CU26072302 的 files to printer 更早）也不填。
    JHRQ: { mode: empty }
    WCRQ: { mode: empty }
  # 书脊方向 Drop_SJFX：NGV 走「装订边」判据 —— Bindung 行右边给了
  # `<N> mm side`，N 等于较长边即长书脊（145x210 + 210 mm side → 长书脊，
  # 与对应 ERP 导出一致）。
  # ★ 业务口径（2026-10-20 二次拍板，实单 CU26070802 / Ostermalblock）：
  #   **识别不到装订方向 / 装订边 → `Drop_SJFX` 留空（JSON `null`），不猜长/短书脊。**
  #   为什么：邮件只说 `perfect binding at the top`，没给 `N mm side`。
  #   「顶/底/左/右」是**装订边位置**，和 ERP 的「长/短书脊」不是同一维度，
  #   反推不出长/短 → 认不出来就空着（业务原话：「识别不到则设置为 书脊方向为 Null」）。
  #   装订方向原文（`at the top`）只写进 CPMS 的「装订」段，不参与 ERP 判定。
  #   套装类跳过（书脊方向无意义）。
  spine:
    mode: binding_side
    long: 长书脊
    short: 短书脊
    # 识别不到装订边 / 装订方向时的落库值：**空**（main.py 会写成 JSON null 并打 WARN）。
    # ⚠️ 别改回「长书脊」—— 业务 2026-10-20 明确要求留空。
    default: ""
    default_note: "识别不到装订方向 → 书脊方向留空（null），不猜长/短书脊"
    # 装订方向原文的规范键（rules.scan 扫出）；仅供 CPMS 与日志引用，不映射 ERP 字段。
    direction_keys: [binding_direction]
    skip_tops: [套装]
  # 全表正则扫描：不挂标签、只在某处出现一次的值
  scan:
    - { key: our_ref, pattern: "PR-\\d{5,}" }
    # fsc 带 unique: true —— **不唯一就留空**（业务确认 2026-09-24）。
    # 实测 CU26072301 同时有 FSC Recycled（盒底）/ FSC Mix（盒盖纸+卡片）/
    # FSC 100%（竹底座），权威 ERP 导出里 FSCMC 是**空的** → 扫到第一个就填是错的。
    # ★ 2026-10-20 修正（CU26070802 暴露）：客户把混用写成 **`FSC-Mix`（带连字符）**，
    #   旧正则只认空格分隔 → 只扫到备注里的 `FSC Recycled`，把「混用」误判成单一取值，
    #   险些落成 FSCMC=FSC Recycled。分隔符改成 `[\s-]*`，让 `FSC-Mix` 与 `FSC Recycled`
    #   同时入账 → 不唯一 → 留空 + 记 scan_note（这才是业务要的结果）。
    - { key: fsc, unique: true, unique_ignore_separators: true, pattern: "FSC[\\s-]*(?:Mix(?:[\\s-]*\\d+%)?|100%|Recycled(?:[\\s-]*\\d+%)?|Mix[\\s-]*Credit)" }
    - { key: text_thickness, pattern: "(\\d+(?:\\.\\d+)?)\\s*mm\\s*bookblock" }
    - { key: binding_side, pattern: "(\\d+(?:\\.\\d+)?)\\s*mm\\s*side" }
    # 装订方向原文：`perfect binding at the top` / `at the head` / `at the side` …
    # **只写进 CPMS 的「装订」段**，不映射 ERP 字段（业务 2026-10-20 口径：
    # 装订边位置 ≠ ERP 的长/短书脊）。识别不到时 Drop_SJFX 走 rules.spine.default。
    # ⚠️ 2026-10-20：加 `side` —— 客户写 `perfect binding at the side` 时旧正则抓不到，
    #   书脊方向就白丢了（`at long side` 这种没 the 的写法仍抓不到，靠 binding_side 数字兜）。
    # ★ 2026-10-29 加「必须先出现 binding/stitch/Bindung/装订」的上下文约束：
    #   A00152 那封邮件的上一轮往来里写着 `specs are mentioned at the bottom left`
    #   （说的是 Excel 里规格在左下角），旧正则把它当成装订边 → Drop_SJFX 落「短书脊」。
    #   捕获组只留方向词本身（`at the top`），测试与 CPMS 都按这个字符串用。
    - { key: binding_direction, pattern: "(?i)(?:binding|stitch\\w*|bindung|装订)[^.\\n]{0,40}?((?:at|on|along)\\s+the\\s+(?:top|bottom|left|right|head|spine|side|short|long)\\b[\\w ]{0,12})" }
    # 款数：纯文本 enquiry 里写成 `3 titles (all in one language):`（没有 `versions:` 标签）。
    # ⚠️ 必须锚在**行首且紧跟括号**，否则会抓到邮件串里客户自己的疑问句
    #    `it should be 60,000cps/15,000cps = 4 titles instead of 3 titles`
    #    （CU26070901 实单实测：不加锚点会落 TZS=4，那是客户的假设不是订单事实）。
    - { key: number_of_titles, pattern: "(?m)^(\\d+)\\s+titles?\\s*\\(" }
    # ★ 2026-10-29 Rossmann 半返单：款数**单独一行、不带括号**（`2 titles`）。
    #   锚行首 + 整行只有这一句 → 不会抓到句子中间的 `= 4 titles instead of 3 titles`。
    - { key: number_of_titles, pattern: "(?m)^\\s*(\\d+)\\s+titles?\\s*$" }
    # 香港单号：附件文件名里带「香港单号 CU26072301」，表内也常有。
    # ⚠️ 落到 **KHDDH**（模板第 43 键，中文标签就是「香港单号」），不是 KHDH。
    - { key: khddh, pattern: "香港单号\\s*([A-Z]{2}\\d{6,}(?:-\\d+)?)" }
    # Lidl 的项目号（IAN = 德国的商品编号）。不确定订单号，但它是**客户原文里
    # 唯一能标识这一单的编号** —— 进 scanned 供 CPMS / 汇报引用，不映射 ERP 字段。
    - { key: ian, pattern: "IAN\\s*(\\d{6})" }
    # ★ 2026-10-29 CU26093001-01（A00152）实单：客户回信只说「option B …The rest
    #   remains as before」，款数/语言数/总数量全在**同一封邮件引用的上一轮往来**里
    #   （`6 Titles 6 Language` / `Total QTY: 112,266 cps in total`）。
    #   `versions_from_email` 只读最新一封（那是为了防止引用旧项目串数），所以这里
    #   用全表扫描兜：整串一起抓成一个值，再交给 versions.title_pattern /
    #   language_pattern 各自取数 —— 只抓数字会丢掉「哪个是款、哪个是语言」。
    - { key: versions, pattern: "(\\d+\\s*titles?\\s*[,+/]?\\s*\\d+\\s*languages?)" }
    # 总数量：`Total QTY: 112,266 cps in total`（德式/英式千分位都交给
    # parse_single_quantity 归一）。只在正文里出现时用它兜底。
    - { key: quantity, pattern: "(?i)total\\s*qty\\s*[:：]\\s*(\\d[\\d.,]*)" }
    # ★ 2026-10-29 Rossmann 半返单的数量写法：
    #     `12,500 cps each (= 25,600 cps in total)`
    #   `12,500 cps each` = **每款**数量（报价基数），总数要 ×TZS 才对得上。
    #   quantity 取不到时，main.py 用 qty_per_title × TZS 落 CPSL1，
    #   并把客户自己写的 qty_total（这里的 25,600，与 2×12,500=25,000 不符）打 WARN。
    - { key: qty_per_title, pattern: "(?i)(\\d[\\d.,]*)\\s*cps\\s*(?:each|/\\s*title|per\\s*title)" }
    - { key: qty_total, pattern: "(?i)(\\d[\\d.,]*)\\s*cps\\s*(?:in\\s+total|insgesamt)" }

# ── 邮件规则：两组单号必须分开 ───────────────────────────────────
# 2026-09-24 修正：KHDH 与 KHDDH 只差一个字母，此前把附件里的「香港单号」
# 写进了 KHDH（客户单号），而 KHDDH 永远是空的。4 份权威 ERP 导出显示：
#   香港单号 → KHDDH（CU26051601-01 / CU26061701 / CU26072301 / CU26072302）
#   客户单号 → KHDH（这 4 单都是空的 —— 终端客户的 PO 号报价阶段还没有）
# 每组规则用 target 指定落哪个 ERP 字段。
email:
  # ① 客户单号 KHDH：客户自己的订单号，**只可能来自邮件标题/正文**。
  #    明确不声明 attachment_keys —— 附件里那个号码是香港单号，别混。
  #    ⚠️ 正则必须写严：`po` 这类短词极易误捕 —— 实测 `Postkarten in Box`
  #       被 `\bpo\s*(?:no)?\s*([A-Z0-9]{5,})` 抓成了 `stkarten`。
  #       所以必须出现 no/nr/number/# 这样的「编号词」，且捕获值必须以字母或数字开头。
  khdh:
    target: KHDH
    attachment_keys: []
    subject_patterns:
      - "(?i)\\b(?:po|p\\.?\\s*o\\.?|order|bestellung|auftrag)\\s*(?:no\\.?|nr\\.?|number|#)\\s*[:#]?\\s*([A-Z0-9][A-Z0-9/-]{3,})"
      - "(?i)\\b(?:po|order)\\s*[:#]\\s*([A-Z0-9][A-Z0-9/-]{3,})"
    body_patterns:
      - "(?i)\\b(?:po|p\\.?\\s*o\\.?|order|bestellung|auftrag)\\s*(?:no\\.?|nr\\.?|number|#)\\s*[:#]?\\s*([A-Z0-9][A-Z0-9/-]{3,})"
      - "(?i)\\b(?:po|order)\\s*[:#]\\s*([A-Z0-9][A-Z0-9/-]{3,})"
  # ② 香港单号 KHDDH：附件文件名/表内的「香港单号 CU…」，邮件里也常有。
  khddh:
    target: KHDDH
    attachment_keys: [khddh]
    subject_patterns:
      - "\\b([A-Z]{2}\\d{6,}(?:-\\d+)?)\\b"          # CU26051601-01 / CU26072302
      - "(?i)香港单号\\s*[:：]?\\s*([A-Z]{2}\\d{6,}(?:-\\d+)?)"
    body_patterns:
      - "\\b([A-Z]{2}\\d{6,}(?:-\\d+)?)\\b"
      - "(?i)香港单号\\s*[:：]?\\s*([A-Z]{2}\\d{6,}(?:-\\d+)?)"
